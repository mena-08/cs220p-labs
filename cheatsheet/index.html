<script type="text/plain" id="sol-flood">
from collections import deque
def flood_fill(img, start, new_color):          # paint bucket: BFS over same-color pixels
    old = img[start[0]][start[1]]
    frontier, reached = deque([start]), {start}
    while frontier:
        r, c = frontier.popleft()
        img[r][c] = new_color
        for nr, nc in [(r-1, c), (r+1, c), (r, c-1), (r, c+1)]:
            if 0 <= nr < len(img) and 0 <= nc < len(img[0]) and (nr, nc) not in reached and img[nr][nc] == old:
                reached.add((nr, nc)); frontier.append((nr, nc))
    return len(reached)                           # area in pixels (oil slick: 137 px)
</script>
<script type="text/plain" id="sol-knight">
from collections import deque
def knight_moves(start, goal):                   # fewest knight moves: BFS on an implicit graph
    jumps = [(1,2),(2,1),(2,-1),(1,-2),(-1,-2),(-2,-1),(-2,1),(-1,2)]
    frontier, dist = deque([start]), {start: 0}
    while frontier:
        sq = frontier.popleft()
        if sq == goal: return dist[sq]           # a1 -> h8: 6
        for dr, dc in jumps:
            n = (sq[0] + dr, sq[1] + dc)
            if 0 <= n[0] < 8 and 0 <= n[1] < 8 and n not in dist:
                dist[n] = dist[sq] + 1; frontier.append(n)
</script>
<script type="text/plain" id="sol-ladder">
from collections import deque
def one_letter_apart(a, b): return sum(x != y for x, y in zip(a, b)) == 1
def word_ladder(start, goal, words):             # COLD -> CORD -> CARD -> WARD -> WARM
    frontier, parent = deque([start]), {start: None}
    while frontier:
        w = frontier.popleft()
        if w == goal:
            path = []
            while w: path.append(w); w = parent[w]
            return path[::-1]
        for n in words:
            if n not in parent and one_letter_apart(w, n):
                parent[n] = w; frontier.append(n)
    return None                                   # no ladder (e.g. to QUIZ)
</script>
<script type="text/plain" id="sol-objects">
def count_objects(img):                           # connected components with DFS (islands: 5)
    seen, count = set(), 0
    for r in range(len(img)):
        for c in range(len(img[0])):
            if img[r][c] == 1 and (r, c) not in seen:
                count += 1
                stack = [(r, c)]; seen.add((r, c))
                while stack:
                    y, x = stack.pop()
                    for ny, nx in [(y-1, x), (y+1, x), (y, x-1), (y, x+1)]:
                        if 0 <= ny < len(img) and 0 <= nx < len(img[0]) and img[ny][nx] == 1 and (ny, nx) not in seen:
                            seen.add((ny, nx)); stack.append((ny, nx))
    return count
</script>
<script type="text/plain" id="sol-folders">
def folder_size(folder):                          # DFS: a folder's size needs everything below it
    total = sum(f.size for f in folder.files)
    for sub in folder.subfolders:
        total += folder_size(sub)                 # finish the child before the parent (Home: 8.1 GB)
    return total
</script>
<script type="text/plain" id="sol-build">
def build_order(task, needs, done=None, active=None, order=None):
    done, active, order = done or set(), active or set(), order if order is not None else []
    if task in done: return order
    if task in active: raise ValueError("cycle at " + task)   # gray -> gray: a cycle
    active.add(task)
    for pre in needs.get(task, []):
        build_order(pre, needs, done, active, order)
    active.discard(task); done.add(task); order.append(task)  # DFS post-order = build order
    return order
</script>
<script type="text/plain" id="sol-expand">
def neighbors(grid, cell):
    """The free cells next to cell, in the order Up, Down, Left, Right."""
    rows, cols = len(grid), len(grid[0])
    r, c = cell
    result = []
    for dr, dc in [(-1, 0), (1, 0), (0, -1), (0, 1)]:   # Up, Down, Left, Right
        nr, nc = r + dr, c + dc
        if not (0 <= nr < rows and 0 <= nc < cols):     # off the map
            continue
        if grid[nr][nc] == "#":                         # a wall
            continue
        result.append((nr, nc))
    return result

print("Start:", START, " neighbors:", neighbors(grid, START))

from collections import deque

def path_to(state, reached):
    """Follow the parents back from state to the start."""
    path = []
    while state is not None:
        path.append(state)
        state = reached[state]
    return path[::-1]

def bfs(start, goal, expand):
    if start == goal:
        return [start]
    frontier = deque([start])
    reached = {start: None}          # state -> parent
    while frontier:
        node = frontier.popleft()    # the oldest node
        for child in expand(node):   # Up, Down, Left, Right; walls skipped
            if child not in reached:
                reached[child] = node
                if child == goal:    # early goal test
                    return path_to(child, reached)
                frontier.append(child)
    return None

<script type="text/plain" id="sol-dfs">
from collections import deque

def path_to(state, reached):
    """Follow the parents back from state to the start."""
    path = []
    while state is not None:
        path.append(state)
        state = reached[state]
    return path[::-1]

def dfs(start, goal, expand):
    if start == goal:
        return [start]
    frontier = deque([start])
    reached = {start: None}          # state -> parent
    while frontier:
        node = frontier.pop()        # the newest node: the frontier is a stack
        for child in expand(node):
            if child not in reached:
                reached[child] = node
                if child == goal:
                    return path_to(child, reached)
                frontier.append(child)
    return None

<script type="text/plain" id="sol-dls">
def depth_limited(path, goal, expand, limit):
    """A path to goal using at most limit more moves, 'cutoff', or None."""
    node = path[-1]
    if node == goal:
        return path
    if limit == 0:
        return 'cutoff'
    cut = False
    for child in expand(node):
        if child not in path:            # no loops on this branch
            result = depth_limited(path + [child], goal, expand, limit - 1)
            if result == 'cutoff':
                cut = True
            elif result is not None:
                return result
    return 'cutoff' if cut else None

def iterative_deepening(start, goal, expand):
    limit = 0
    while True:
        result = depth_limited([start], goal, expand, limit)
        if result != 'cutoff':
            return result
        limit += 1
</script>
<script type="text/plain" id="sol-puzzle">
from collections import deque

GOAL = (1, 2, 3,
        4, 5, 6,
        7, 8, 0)                 # 0 is the blank
BOARD = (1, 2, 0,
         4, 8, 3,
         7, 6, 5)                # 6 moves from GOAL

def successors(board):
    """The boards one move away: the blank moves Up, Down, Left, Right."""
    i = board.index(0)                    # where the blank is
    r, c = divmod(i, 3)
    result = []
    for dr, dc in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
        nr, nc = r + dr, c + dc
        if not (0 <= nr < 3 and 0 <= nc < 3):
            continue
        j = nr * 3 + nc
        b = list(board)
        b[i], b[j] = b[j], b[i]
        result.append(tuple(b))
    return result

# Your BFS from before, unchanged: it works for any problem.
def path_to(state, reached):
    """Follow the parents back from state to the start."""
    path = []
    while state is not None:
        path.append(state)
        state = reached[state]
    return path[::-1]

def bfs(start, goal, expand):
    if start == goal:
        return [start]
    frontier = deque([start])
    reached = {start: None}          # state -> parent
    while frontier:
        node = frontier.popleft()    # the oldest node
        for child in expand(node):   # Up, Down, Left, Right; walls skipped
            if child not in reached:
                reached[child] = node
                if child == goal:    # early goal test
                    return path_to(child, reached)
                frontier.append(child)
    return None

path = bfs(BOARD, GOAL, successors)
print(len(path) - 1, "moves")
for board in path:
    print(board[0:3], board[3:6], board[6:9])

/* Python solutions (lab 2): code lives in the <script type="text/plain" id="sol-…"> blocks above */
const SOL = {
  expand: { title: "1 · expand(): neighbors(grid, cell)", expect: "With BFS: Campus Library → Cafeteria 28 moves, 283 expansions; gate closed: None after 369." },
  bfs: { title: "2 · BFS", expect: "Library → Cafeteria 28 moves, 283 expansions; gate closed: None after 369." },
  dfs: { title: "3 · DFS (starts from the student's own BFS, pasted in)", expect: "frontier.pop(): 98 moves, 325 expansions (340 if the goal is tested when popped; both pass), max frontier 131; gate closed: None after 369." },
  dls: { title: "4 · Depth-limited + iterative deepening (stretch)", expect: "Corner map: ℓ = 7 'cutoff' after 17 expansions, ℓ = 8 path after 22; IDS 8 moves after 78 (BFS 16). Walled-in G: None at ℓ = 8 after 24; IDS None after 111." },
  puzzle: { title: "8-puzzle: successors() + BFS (starts from the student's own BFS, pasted in)", expect: "6 moves, 34 expansions; the 12-move board: 1,157 expansions." },
  flood: { title: "Paint bucket / oil slick (BFS)", expect: "Fills ring by ring; the oil slick is 137 pixels = 0.34 km²." },
  knight: { title: "Knight moves (BFS)", expect: "a1 → h8: 6 moves." },
  ladder: { title: "Word ladder (BFS)", expect: "COLD → CORD → CARD → WARD → WARM; no ladder to QUIZ." },
  objects: { title: "Count objects (DFS)", expect: "5 islands; 15 objects on the roof (18 panels, three touching pairs)." },
  folders: { title: "Folder sizes (DFS)", expect: "Totals bottom-up; Home is 8.1 GB." },
  build: { title: "Build order (DFS with cycle detection)", expect: "Post-order is a valid build order; an edge to a task still in progress is a cycle." },
};
Object.entries(SOL).forEach(([k, v]) => { v.code = document.getElementById("sol-" + k).textContent.replace(/^\n/, "").replace(/\s+$/, ""); });
const SOL_STEPS = { "2:code": ["expand", "bfs", "dfs", "dls"], "2:puzzle": ["puzzle"], "2:applied": ["flood", "knight", "ladder", "objects", "folders", "build"] };

/* ---------- rendering ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;
const COLORS = ["--t1", "--t2", "--t3", "--t4"];
let current = 1, query = "";

// cumulative clock per step
LABS.forEach((L) => { let t = 0; L.steps.forEach((s, i) => { s.no = i + 1; s.from = t; t += s.m; s.to = t; s.best = BEST[L.n + ":" + s.id]; s.sol = SOL_STEPS[L.n + ":" + s.id]; }); L.total = t; });

function hl(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  const re = new RegExp("(" + terms.map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return out.replace(re, "<mark>$1</mark>");
}
const norm = (s) => s.toLowerCase();
const matches = (hay, terms) => { const h = norm(hay); return terms.every((t) => h.includes(t)); };
const stepLink = (L, s) => `${SITE}lab${L.n}.html#${s.id}`;
const stepLabel = (s) => (s.id === "tournament" ? "tournament" : `step ${s.no}`);

function renderTabs() {
  $("#tabs").innerHTML = LABS.map((L) => `<button class="tab" role="tab" data-lab="${L.n}" aria-selected="${!query && L.n === current}"><b>Lab ${L.n}</b><span>${esc(L.short)}</span></button>`).join("");
}

function card(L, s, c, terms, showLab) {
  const [name, x, ex, url] = c;
  return `<article class="card${url ? " ta" : ""}" style="--c:var(${COLORS[L.n - 1]})">
    ${showLab ? `<span class="labtag">Lab ${L.n} · ${esc(L.short)}</span>` : ""}
    <h3>${hl(name, terms)}</h3>
    <p class="x">${hl(x, terms)}</p>
    <p class="ex">${hl(ex, terms)}</p>
    ${url ? `<div class="in"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(SITE, ""))} ↗</a></div>` : ""}
    <div class="in">In the lab: <a href="${stepLink(L, s)}" target="_blank" rel="noopener">${stepLabel(s)} ↗</a></div>
  </article>`;
}

function answerKey(k, terms = []) {
  const head = `<tr><th>${esc(k.head || "Agent")}</th>${k.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
  const rows = k.rows.map(([agent, cells]) => `<tr><td class="agent">${hl(agent, terms)}</td>${cells.map(([a, why]) => `<td><b>${hl(a, terms)}</b><span>${hl(why, terms)}</span></td>`).join("")}</tr>`).join("");
  return `<div class="key"><h3>${esc(k.title)}</h3><table>${head}${rows}</table></div>`;
}

function bestBox(b, rows, terms = []) {
  const body = rows.map(([goal, set, res]) => `<tr><td class="agent">${hl(goal, terms)}</td><td>${hl(set, terms)}</td><td><b>${hl(res, terms)}</b></td></tr>`).join("");
  return `<div class="key best"><h3>Best settings${b.note ? ` <span>${hl(b.note, terms)}</span>` : ""}</h3><table><tr><th>Target</th><th>Settings</th><th>Result</th></tr>${body}</table></div>`;
}

const solText = (k) => SOL[k].title + " " + SOL[k].expect + " " + SOL[k].code;
function solBlock(kinds, terms = []) {
  const items = kinds.map((k) => `<details open><summary><b>${hl(SOL[k].title, terms)}</b><span>${hl(SOL[k].expect, terms)}</span></summary>
    <div class="code"><button type="button" class="copy" data-copy="${k}">Copy</button><pre><code>${hl(SOL[k].code, terms)}</code></pre></div></details>`).join("");
  return `<div class="key sol"><h3>Python solutions <span>TA only: students no longer see them.</span></h3>${items}</div>`;
}

function stepBlock(L, s, cards, terms = [], withKey = true, bestRows = s.best ? s.best.rows : [], sols = s.sol || []) {
  return `<section class="step" id="l${L.n}-${s.id}" style="--c:var(${s.id === "tournament" ? "--tour" : COLORS[L.n - 1]})">
    <h2><span class="num">${s.id === "tournament" ? "★" : s.no}</span>${esc(s.t)}<span class="clk">${clock(s.from)}–${clock(s.to)} · ${s.m} min</span><a href="${stepLink(L, s)}" target="_blank" rel="noopener">open ${stepLabel(s)} ↗</a></h2>
    ${bestRows.length ? bestBox(s.best, bestRows, terms) : ""}
    ${s.key && withKey ? answerKey(s.key, terms) : ""}
    ${sols.length ? solBlock(sols, terms) : ""}
    <div class="cards">${cards}</div>
  </section>`;
}

function renderLab(L) {
  const col = COLORS[L.n - 1];
  const timeline = L.steps.map((s) => `<button class="seg${s.id === "tournament" ? " tour" : ""}" style="--m:${s.m};--c:var(${col})" data-jump="l${L.n}-${s.id}" title="${esc(s.no + ". " + s.t + " · " + clock(s.from) + "–" + clock(s.to) + " · " + s.m + " min")}">
      <span class="n">${s.id === "tournament" ? "★" : s.no}</span> <span class="clk">${clock(s.from)}–${clock(s.to)}</span><span class="tt">${esc(s.t)}</span></button>`).join("");
  const formulas = L.formulas.map(([k, f]) => `<span class="fx"><b>${esc(k)}</b><span class="f">${esc(f)}</span></span>`).join("");
  const steps = L.steps.map((s) => stepBlock(L, s, s.c.map((c) => card(L, s, c, [], false)).join(""))).join("");
  const faq = L.faq.map(([q, a]) => `<div class="qa"><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></div>`).join("");
  return `<div class="labhead"><h1>Lab ${L.n} · ${esc(L.title)}</h1><span class="meta">${esc(L.when)} · ${L.total} min · ${L.steps.length} steps</span><a href="${SITE}lab${L.n}.html" target="_blank" rel="noopener">open lab ↗</a></div>
    <p class="scenario">${esc(L.scenario)}</p>
    <nav class="timeline" aria-label="Timeline">${timeline}</nav>
    <div class="formulas">${formulas}</div>
    <div class="cols"><div>${steps}</div><aside class="faq"><h2>Students often ask</h2>${faq}</aside></div>`;
}

function renderSearch(terms) {
  let total = 0;
  const parts = LABS.map((L) => {
    const steps = L.steps.map((s) => {
      const hits = s.c.filter((c) => matches(c.join(" ") + " " + s.t, terms));
      const keyHit = !!s.key && matches(s.key.title + " " + s.key.rows.flat(3).join(" "), terms);
      const bestHits = s.best ? s.best.rows.filter((r) => matches(r.join(" ") + " " + (s.best.note || "") + " best settings", terms)) : [];
      const solHits = (s.sol || []).filter((k) => matches(solText(k) + " python solutions", terms));
      total += hits.length + (keyHit ? 1 : 0) + bestHits.length + solHits.length;
      return hits.length || keyHit || bestHits.length || solHits.length ? stepBlock(L, s, hits.map((c) => card(L, s, c, terms, true)).join(""), terms, keyHit, bestHits, solHits) : "";
    }).join("");
    const faqs = L.faq.filter((qa) => matches(qa.join(" "), terms));
    total += faqs.length;
    if (!steps && !faqs.length) return "";
    const faq = faqs.length ? `<aside class="faq"><h2>Students often ask · Lab ${L.n}</h2>${faqs.map(([q, a]) => `<div class="qa"><div class="q">${hl(q, terms)}</div><div class="a">${hl(a, terms)}</div></div>`).join("")}</aside>` : "<div></div>";
    return `<section class="labsec"><div class="labhead"><h1 style="font-size:1.25rem">Lab ${L.n} · ${esc(L.title)}</h1></div><div class="cols"><div>${steps}</div>${faq}</div></section>`;
  }).join("");
  return `<p class="results-head">${total} match${total === 1 ? "" : "es"} for “${esc(query)}” in all labs · Esc to clear</p>` + (parts || `<p class="empty">Nothing found.</p>`);
}

function render() {
  renderTabs();
  const terms = norm(query).split(/\s+/).filter(Boolean);
  $("#main").innerHTML = terms.length ? renderSearch(terms) : renderLab(LABS[current - 1]);
  measure(); spy();
}

// sticky offsets: header height, and header + timeline for the FAQ panel and scroll targets
function measure() {
  const hh = $("header").offsetHeight, tl = $(".timeline");
  document.documentElement.style.setProperty("--hh", hh + "px");
  document.documentElement.style.setProperty("--stick", hh + (tl ? tl.offsetHeight : 0) + "px");
}

// mark the timeline segment of the step currently at the top of the screen
function spy() {
  const segs = document.querySelectorAll(".seg");
  if (!segs.length) return;
  const line = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stick")) + 40;
  let on = segs[0].dataset.jump;
  segs.forEach((s) => { const el = document.getElementById(s.dataset.jump); if (el && el.getBoundingClientRect().top <= line) on = s.dataset.jump; });
  segs.forEach((s) => s.classList.toggle("on", s.dataset.jump === on));
}
addEventListener("scroll", spy, { passive: true });
addEventListener("resize", () => { measure(); spy(); });

function setLab(n, push = true) {
  current = n; query = ""; $("#q").value = "";
  if (push) history.replaceState(null, "", "#lab" + n);
  render(); window.scrollTo({ top: 0 });
}

function jump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-lab]"); if (tab) return setLab(+tab.dataset.lab);
  const seg = e.target.closest("[data-jump]"); if (seg) return jump(seg.dataset.jump);
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const done = (msg) => { cp.textContent = msg; setTimeout(() => (cp.textContent = "Copy"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(SOL[cp.dataset.copy].code).then(() => done("Copied"), () => done("Select and copy"));
    else done("Select and copy");
  }
});
$("#q").addEventListener("input", (e) => { query = e.target.value.trim(); render(); window.scrollTo({ top: 0 }); });
document.addEventListener("keydown", (e) => {
  const inInput = e.target.matches("input, textarea");
  if (e.key === "Escape" && (query || inInput)) { query = ""; $("#q").value = ""; $("#q").blur(); render(); return; }
  if (inInput || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (/^[1-4]$/.test(e.key)) setLab(+e.key);
});

const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
$("#theme").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("cs220p-cheat-theme", t); } catch (e) {}
});

const labFromHash = () => { const m = /^#lab([1-4])$/.exec(location.hash); return m ? +m[1] : 0; };
addEventListener("hashchange", () => { const n = labFromHash(); if (n && (n !== current || query)) setLab(n, false); });
setLab(labFromHash() || 1, false);
</script>
