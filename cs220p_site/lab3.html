window.LAB_DEEPER = {
types: `<p>The four levels are Stevens' scales of measurement (1946). A scale is defined by the group of transformations that preserves its information: permutations for nominal, monotone maps for ordinal, affine maps x ↦ ax + b for interval, similarities x ↦ ax for ratio. A statistic is permissible if it is invariant (up to the same transformation) under that group: the mean of an ordinal variable can change its ordering under a monotone relabeling, the median cannot. The practical consequence for the rest of the course: Pearson correlation and k-means assume at least interval data; Spearman's rank correlation and k-medoids work on ordinal data.</p>`,
measurement: `<p>For an estimator X of a true value θ: MSE = E[(X − θ)²] = (E[X] − θ)² + Var(X) = bias² + variance, by adding and subtracting E[X] and noting the cross term vanishes. This decomposition reappears as the bias-variance trade-off of models in the classification lecture. Precision is the inverse of variance; accuracy is the inverse of MSE; a biased but precise instrument can be calibrated, a noisy one can only be averaged (variance falls as 1/n).</p>`,
outliers: `<p>The sample mean has breakdown point 0: one arbitrarily large value moves it arbitrarily; the median has breakdown point 50%. The z-rule is motivated by Chebyshev's inequality, P(|X − μ| ≥ kσ) ≤ 1/k², a distribution-free bound that is loose; for Gaussian data |z| > 3 flags 0.27%. Its weakness is masking: the outlier inflates the sample σ used to detect it. Tukey's fences Q1 − 1.5·IQR and Q3 + 1.5·IQR correspond to ±2.7σ for Gaussian data and are robust because quartiles have breakdown point 25%. In high dimensions use robust covariance (minimum covariance determinant) and Mahalanobis distance (Lab 4).</p>`,
missing: `<p>Rubin's taxonomy: MCAR (missingness independent of everything), MAR (depends only on observed values), MNAR (depends on the missing value itself, our short-sleepers case). Complete-case analysis is unbiased only under MCAR; mean imputation preserves the mean under MCAR but biases variance downward and attenuates correlations, because imputed points have zero residual variance. Regression or multiple imputation (Rubin 1987) draws several plausible values and pools estimates with between-imputation variance. Under MNAR no imputation from the observed data is unbiased without a model of the missingness mechanism; the honest answer is sensitivity analysis.</p>`,
sampling: `<p>The standard error of a sample mean is σ/√n, which is the 1/√n curve on the screen. Stratified sampling with proportional allocation has variance Σ<sub>h</sub> W<sub>h</sub>² σ<sub>h</sub>²/n<sub>h</sub>, never larger than simple random sampling when the strata means differ, and it guarantees coverage of small strata. Sampling without replacement adds the finite population correction (1 − n/N). Progressive sampling detects the plateau of a learning curve; for clustering, the inter-sample distance between two independent samples drops once both are representative.</p>`,
transform: `<p>Standardization is the affine map that gives mean 0 and variance 1; it is a permissible transformation only for interval and ratio scales. The log transform is variance-stabilizing for multiplicative noise and turns lognormal commute times into Gaussian ones. Equal-frequency binning is the quantile transform; entropy-based supervised discretization (Fayyad and Irani 1993) chooses the cut that minimizes the class entropy of the two intervals and stops with an MDL criterion. One-hot encoding embeds m categories in an (m − 1)-dimensional simplex; it is what makes nominal attributes usable by distance-based and linear methods.</p>`,
dimensions: `<p>Distance concentration (Beyer et al. 1999): for i.i.d. coordinates, (max<sub>i</sub> d<sub>i</sub> − min<sub>i</sub> d<sub>i</sub>)/min<sub>i</sub> d<sub>i</sub> → 0 in probability as the dimension grows, so nearest-neighbor queries lose meaning unless the data lies near a low-dimensional manifold. PCA: with the centered data matrix X<sub>c</sub> (n × p), the covariance is X<sub>c</sub>ᵀX<sub>c</sub>/(n − 1) and its eigenvectors are the principal axes; via the SVD X<sub>c</sub> = USVᵀ the axes are the columns of V and the variance along axis j is s<sub>j</sub>²/(n − 1). The proportion of variance explained by the first k components is Σ<sub>j≤k</sub> s<sub>j</sub>² / Σ<sub>j</sub> s<sub>j</sub>². Without centring you decompose X<sup>T</sup>X, whose first eigenvector points at the mean, the trap on the slides; without scaling, the attribute with the largest variance wins. PCA is the best linear reconstruction in the least-squares sense (Eckart-Young); nonlinear alternatives (kernel PCA, t-SNE, UMAP) relax linearity.</p>`,
};

/* Lab 3: Data Mining and Data. Scenario: the campus student survey */
(function () {
  const { h, RNG, fmt, mean, sd, median, range, select, check, metric, canvas, css, quiz, tournament, clamp, tween, sleep, examples, callout, pulse } = Lab;
  const MAJORS = ["CS", "EE", "ME", "Bio", "Chem"];
  const MAJOR_TYPOS = { CS: ["cs", "Comp Sci", "C.S."], EE: ["ee", "Elec Eng", "EE "], ME: ["me", "Mech", "M.E."], Bio: ["bio", "Biology", "BIO"], Chem: ["chem", "Chemistry", "CHEM"] };
  const MAJOR_COLORS = { CS: "#5b7cfa", EE: "#ee8a84", ME: "#3fae8a", Bio: "#d9a520", Chem: "#9b6bd6" };
  const YEARS = ["1st year", "2nd year", "3rd year", "4th year", "MS", "PhD"];
  const COLS = ["id", "major", "year", "satisfaction", "sleep_hours", "coffee_cups", "commute_min", "ac_temp_c", "study_hours", "gpa"];

  function clean(seed, n = 300) {
    const rng = RNG(seed); const rows = [];
    for (let i = 0; i < n; i++) {
      const major = MAJORS[Math.min(4, Math.floor(rng() * 5))];
      const study = clamp(rng.normal(20 + MAJORS.indexOf(major) * 1.2, 6), 2, 45);
      const sleep = clamp(rng.normal(6.8 - MAJORS.indexOf(major) * 0.15, 1.0), 3.5, 10);
      const gpa = clamp(2.1 + 0.07 * study + 0.05 * (sleep - 6.8) + rng.normal(0, 0.3), 1.5, 4.0);
      let coffee = 0; { const L = Math.exp(-2.2); let p = 1; while ((p *= rng()) > L) coffee++; }
      const commute = Math.exp(rng.normal(Math.log(14), 0.6));
      const temp = rng.normal(22.5, 1.4);
      const sat = clamp(Math.round(2.5 + 0.6 * (sleep - 6.8) + rng.normal(0, 0.9)), 1, 5);
      rows.push({ id: 1000 + i, major, year: YEARS[Math.min(5, Math.floor(rng() * 6))], satisfaction: sat, sleep_hours: +sleep.toFixed(1), coffee_cups: coffee, commute_min: +commute.toFixed(0), ac_temp_c: +temp.toFixed(1), study_hours: +study.toFixed(1), gpa: +gpa.toFixed(2) });
    }
    return rows;
  }
  /* inject quality problems. p: {missing, missingBiased, outliers, typos, duplicates, noise} */
  function messy(rows, p, seed) {
    const rng = RNG(seed + 77); let out = rows.map((r) => ({ ...r }));
    out.forEach((r) => {
      let pm = p.missing; if (p.missingBiased) pm = r.sleep_hours < 6 ? p.missing * 2.5 : p.missing * 0.4;
      if (rng() < pm) r.sleep_hours = null; if (rng() < p.missing) r.commute_min = null;
      if (p.noise > 0) r.study_hours = +(r.study_hours + rng.normal(0, p.noise)).toFixed(1);
      if (rng() < p.typos) { const v = MAJOR_TYPOS[r.major]; r.major = v[rng.int(v.length)]; }
    });
    for (let k = 0; k < p.outliers; k++) { const r = out[rng.int(out.length)]; const kind = rng.int(3); if (kind === 0) r.sleep_hours = 60 + rng.int(25); else if (kind === 1) r.coffee_cups = 30 + rng.int(40); else r.commute_min = 900 + rng.int(600); }
    for (let k = 0; k < p.duplicates; k++) { const r = out[rng.int(rows.length)]; const d = { ...r }; if (rng() < 0.5 && d.commute_min != null) d.commute_min += 1; out.push(d); }
    return out;
  }
  const canon = (m) => { if (m == null) return m; const t = String(m).trim().toLowerCase().replace(/[^a-z]/g, ""); if (t.startsWith("c") && t.includes("s") && !t.startsWith("ch")) return "CS"; if (t.startsWith("e")) return "EE"; if (t.startsWith("m")) return "ME"; if (t.startsWith("b")) return "Bio"; if (t.startsWith("ch")) return "Chem"; return m; };
  const col = (rows, k) => rows.map((r) => r[k]).filter((v) => v != null && !isNaN(v));
  /* Pearson correlation of the rows where both values exist; NaN when it is not defined (fewer than 2 pairs, or zero variance) */
  const corr = (rows, a, b) => { const xs = [], ys = []; rows.forEach((r) => { if (r[a] != null && r[b] != null) { xs.push(r[a]); ys.push(r[b]); } }); if (xs.length < 2) return NaN; const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0, syy = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; syy += (ys[i] - my) ** 2; }); return sxx * syy > 0 ? sxy / Math.sqrt(sxx * syy) : NaN; };
  /* Lab.mean of an empty list is 0; for statistics shown to students an empty list must give "undefined" */
  const avg = (a) => (a.length ? mean(a) : NaN);
  /* make leading and trailing spaces visible ("EE " → "EE␣"); inner spaces are normal text */
  const vis = (s) => String(s).replace(/^ +| +$/g, (m) => "␣".repeat(m.length));
  /* axis tick label without a stray "-0" */
  const tick = (x, d) => { const s = fmt(x, d); return s === "-0" ? "0" : s; };
  const tint = (c, p) => `color-mix(in srgb, ${c.startsWith("#") ? c : `var(${c})`} ${p}%, transparent)`;

  /* animation helpers */
  /* lerp: numbers glide, arrays and objects of the same shape glide element-wise, everything else (strings, NaN, shape changes) switches to the target */
  function lerp(a, b, t) {
    if (typeof a === "number" && typeof b === "number") return isFinite(a) && isFinite(b) ? a + (b - a) * t : b;
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length ? b.map((x, i) => lerp(a[i], x, t)) : b;
    if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) { const o = {}; for (const k in b) o[k] = k in a ? lerp(a[k], b[k], t) : b[k]; return o; }
    return b;
  }
  /* morpher(draw): returns go(target, {ms, instant}); each call glides the drawn state from wherever it is now to target; a newer call takes over an older one */
  function morpher(draw, ms = 450) {
    let cur = null, gen = 0;

      const g = ++gen, from = cur;
      if (!from || o.instant) { cur = target; draw(target); return Promise.resolve(); }

  /* metricsBox: a row of metrics whose numbers count to their new values; non-finite numbers show "undefined" */
  function metricsBox() {

      items.forEach((it, i) => {
        const m = els[i], v = m.querySelector(".v"), d = it.d ?? 2, u = it.u || "", old = vals[it.k];
        m.className = "metric " + (it.cls || "");
        if (typeof it.v === "number" && isFinite(it.v)) {
          vals[it.k] = it.v;
          if (typeof old === "number" && Math.abs(old - it.v) > 1e-12) anims.push([v, old, it.v, d, u]); else v.textContent = fmt(it.v, d) + u;
        } else { vals[it.k] = null; v.textContent = typeof it.v === "number" ? "undefined" : it.v; }
      });
      if (anims.length) tween(350, (t) => { if (g !== gen) return; anims.forEach(([v, a, b, d, u]) => (v.textContent = fmt(a + (b - a) * t, d) + u)); });
    };
    return el;
  }
  /* statusBox: one callout that only re-renders when its message changes (no flicker while a slider glides) */
  function statusBox() {
    const el = h("div"); let last = "";
    el.set = (html, kind = "edge") => { const key = html ? kind + html : ""; if (key === last) return; last = key; el.innerHTML = ""; if (html) el.append(callout(html, kind)); };
    return el;
  }

  /* drawing helpers */
  function histState(values, o = {}) {
    const v = values.filter((x) => x != null && isFinite(x));
    let lo = o.min ?? (v.length ? Math.min(...v) : 0), hi = o.max ?? (v.length ? Math.max(...v) : 1);
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const nb = o.bins ?? 30, bins = new Array(nb).fill(0);
    v.forEach((x) => bins[clamp(Math.floor(((x - lo) / (hi - lo)) * nb), 0, nb - 1)]++);
    return { lo, hi, bins, lines: o.lines || [], title: o.title || "", binColors: o.binColors || null, empty: v.length ? "" : o.emptyMsg || "No values to plot." };
  }
  function drawHist(cv, st, box) {
    const ctx = cv.getContext("2d"), bx = box || { x: 0, y: 0, w: cv.width, h: cv.height };
    if (!box) ctx.clearRect(0, 0, cv.width, cv.height);
    const L = bx.x + 40, R = bx.x + bx.w - 10, T = bx.y + 18, B = bx.y + bx.h - 26, lo = st.lo, hi = st.hi, nb = st.bins.length;
    const bmax = Math.max(1, ...st.bins), X = (x) => L + ((x - lo) / (hi - lo)) * (R - L), Y = (c) => T + (1 - c / bmax) * (B - T), bw = (R - L) / nb;
    st.bins.forEach((c, i) => { if (c < 0.02) return; ctx.fillStyle = (st.binColors && st.binColors[i]) || css("--lagoon"); ctx.fillRect(L + i * bw + 1, Y(c), Math.max(1, bw - 2), Y(0) - Y(c)); });
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, B + 0.5); ctx.lineTo(R, B + 0.5); ctx.stroke();
    ctx.font = "12px Public Sans"; ctx.fillStyle = css("--muted"); ctx.textAlign = "center";
    for (let g = 0; g <= 5; g++) { const x = lo + (g / 5) * (hi - lo); ctx.fillText(tick(x, hi - lo < 3 ? 2 : 1), X(x), B + 16); }
    ctx.textAlign = "left";
    (st.lines || []).forEach((ln) => {
      if (!isFinite(ln.x) || ln.x < lo - 1e-9 || ln.x > hi + 1e-9) return;
      ctx.strokeStyle = ln.color; ctx.setLineDash(ln.dash || []); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(ln.x), T); ctx.lineTo(X(ln.x), B); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = ln.color; const right = X(ln.x) > R - 110; ctx.textAlign = right ? "right" : "left"; ctx.fillText(ln.label || "", X(ln.x) + (right ? -4 : 4), T + 12 + (ln.dy || 0)); ctx.textAlign = "left";
    });
    if (st.title) { ctx.fillStyle = css("--ink"); ctx.fillText(st.title, L, bx.y + 12); }
    if (st.empty) { ctx.fillStyle = css("--coral"); ctx.textAlign = "center"; ctx.fillText(st.empty, (L + R) / 2, (T + B) / 2); ctx.textAlign = "left"; }
    return { X, Y };
  }
  function table(rows, cols, limit = 12) {
    const t = h("table", {}, h("tr", {}, ...cols.map((c) => h("th", {}, c))));
    rows.slice(0, limit).forEach((r) => t.append(h("tr", {}, ...cols.map((c) => h("td", { style: r[c] == null ? "color:var(--coral)" : "" }, r[c] == null ? "missing" : r[c])))));
    return h("div", { class: "wide" }, t, rows.length > limit ? h("p", { class: "note" }, `${rows.length - limit} more rows`) : null);
  }
  function lineChart(cv, series, opts = {}) {
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    const pad = { l: 44, r: 12, t: 22, b: 28 }; const xs = series.flatMap((s) => s.pts.map((p) => p[0])), ys = series.flatMap((s) => s.pts.map((p) => p[1]));
    const xlo = opts.xmin ?? Math.min(...xs), xhi = opts.xmax ?? Math.max(...xs), ylo = opts.ymin ?? Math.min(...ys), yhi = opts.ymax ?? Math.max(...ys);
    const X = (x) => pad.l + ((x - xlo) / (xhi - xlo || 1)) * (W - pad.l - pad.r), Y = (y) => pad.t + (1 - (y - ylo) / (yhi - ylo || 1)) * (H - pad.t - pad.b);
    ctx.font = "12px Public Sans"; ctx.fillStyle = css("--muted"); for (let g = 0; g <= 4; g++) { const y = ylo + (g / 4) * (yhi - ylo); ctx.fillText(tick(y, 2), 4, Y(y) + 4); } for (let g = 0; g <= 4; g++) { const x = xlo + (g / 4) * (xhi - xlo); ctx.fillText(tick(x, 0), X(x) - 8, H - 8); }

    series.forEach((s, j) => { ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath(); s.pts.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke(); ctx.fillStyle = s.color; ctx.fillRect(pad.l + j * 150, 6, 10, 10); ctx.fillStyle = css("--ink"); ctx.fillText(s.name, pad.l + 14 + j * 150, 15); });
    if (opts.marker && isFinite(opts.marker.x) && isFinite(opts.marker.y)) {
      const m = opts.marker; ctx.strokeStyle = css("--lagoon"); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(m.x), pad.t); ctx.lineTo(X(m.x), H - pad.b); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = css("--lagoon"); ctx.beginPath(); ctx.arc(X(m.x), Y(m.y), 6, 0, 7); ctx.fill();
      const right = X(m.x) > W - 160, ly = Y(m.y) - 8 < pad.t + 16 ? Y(m.y) + 20 : Y(m.y) - 8; ctx.textAlign = right ? "right" : "left"; ctx.fillText(m.label || "", X(m.x) + (right ? -10 : 10), ly); ctx.textAlign = "left";
    }
    return { X, Y };
  }

  const CLEAN = clean(1);
  const steps = [];

  steps.push({
    id: "intro", title: "What is data mining, and what is data?", time: 10,
    theory: `<h3>From raw records to patterns</h3>
      <p><b>Data mining</b> is the non-trivial extraction of implicit, previously unknown and potentially useful information from data: exploring large quantities of data, automatically or semi-automatically, to find meaningful patterns. The two families of methods:</p>
      <ul><li><b>Prediction</b>: use some variables to predict unknown or future values of others. Classification (which major will a student choose?), regression (what GPA will they get?).</li>
      <li><b>Description</b>: find human-interpretable patterns. Clustering (groups of similar students), anomaly detection (a strange record), association analysis (coffee drinkers also skip breakfast).</li></ul>
      <p>Before any of that we need to understand the <b>data</b>: a collection of <b>data objects</b> (records, points, cases, instances) described by <b>attributes</b> (variables, fields, features, dimensions). Our running example is a campus student survey: 300 students, 10 attributes. We generated it, so we also have the <i>true</i> clean version, which lets us measure how much damage each quality problem does.</p>`,
    ask: `<div class='a'>Click "One object = one row" and "One attribute = one column" first, then ask for one prediction task and one description task on this table ("Prediction vs description" shows one of each). Ask which attribute is the object identifier and whether it carries information before clicking the edge case: 300 distinct ids for 300 students, so it identifies and describes nothing. Removing it is feature selection.</div>`,
    mount() {
      const SHOW = 10;
      const head = COLS.map((c) => h("th", {}, c));
      const rowEls = CLEAN.slice(0, SHOW).map((r) => h("tr", {}, ...COLS.map((c) => h("td", {}, r[c]))));
      const cells = rowEls.map((tr) => [...tr.children]);
      const all = [...head, ...cells.flat()];
      all.forEach((td) => (td.style.transition = "background .25s, opacity .4s"));
      const info = h("div", { class: "callout info" }, "Click a button above: the table will show what an object and an attribute are.");
      const mb = metricsBox();
      const showMetrics = (attrs = COLS.length) => mb.update([{ k: "Objects (rows)", v: CLEAN.length, d: 0 }, { k: "Attributes (columns)", v: attrs, d: 0 }]);
      const reset = () => { all.forEach((td) => { td.style.background = ""; td.style.opacity = ""; }); showMetrics(); };
      showMetrics();
      const ex = examples([
        { label: "One object = one row", kind: "example", note: "The highlight walks down the table. Each row is one student: one <b>data object</b> (record, case, instance), described by the same 10 attributes.", run: async () => {
          reset();
          for (let i = 0; i < SHOW; i++) {
            if (i) cells[i - 1].forEach((td) => (td.style.background = ""));
            cells[i].forEach((td) => (td.style.background = tint("--lagoon", 25)));
            const r = CLEAN[i]; info.innerHTML = `Object ${i + 1} of ${CLEAN.length}: student ${r.id}, ${r.major}, ${r.year}, sleeps ${r.sleep_hours} h, GPA ${r.gpa}.`;
            await sleep(420);
          }
        } },
        { label: "One attribute = one column", kind: "example", note: "The column sleep_hours lights up cell by cell. An <b>attribute</b> is one property measured on every object; its values across all 300 students form a variable.", run: async () => {
          reset(); const j = COLS.indexOf("sleep_hours"); head[j].style.background = tint("--mint-2", 40);
          for (let i = 0; i < SHOW; i++) { cells[i][j].style.background = tint("--mint-2", 25); await sleep(150); }
          const v = col(CLEAN, "sleep_hours"), lo = Math.min(...v), hi = Math.max(...v);
          await tween(1000, (t) => (info.innerHTML = `Attribute <b>sleep_hours</b>: ${fmt(v.length * t, 0)} values counted.`));
          info.innerHTML = `Attribute <b>sleep_hours</b>: ${v.length} values, from ${fmt(lo, 1)} to ${fmt(hi, 1)} h, mean ${fmt(mean(v), 2)} h.`;
        } },
        { label: "Prediction vs description", kind: "example", note: "First the inputs (blue) and the target (red) of a <b>prediction</b> task light up; then the rows are colored by group, which is what a <b>description</b> task looks for.", run: async () => {
          reset(); const g = COLS.indexOf("gpa");

  steps.push({
    id: "types", title: "Attribute types and what you may compute", time: 15,
    theory: `<h3>Nominal, ordinal, interval, ratio</h3>
      <p>The type of an attribute is defined by which operations make sense on its values:</p>
      <table><tr><th>Type</th><th>Operations that make sense</th><th>Allowed statistics</th><th>Example</th></tr>
      <tr><td>Nominal</td><td>= ≠ (distinctness)</td><td>mode, entropy, contingency tables</td><td>major, zip code, ID</td></tr>
      <tr><td>Ordinal</td><td>= ≠ &lt; &gt; (order)</td><td>median, percentiles, rank correlation</td><td>satisfaction 1 to 5, year of study, grades</td></tr>
      <tr><td>Interval</td><td>+ − (differences are meaningful)</td><td>mean, standard deviation, Pearson correlation</td><td>temperature in °C, calendar dates</td></tr>
      <tr><td>Ratio</td><td>× ÷ (a true zero, ratios are meaningful)</td><td>geometric mean, percent variation</td><td>hours, counts, money, Kelvin, age</td></tr></table>
      <p>Attribute <i>values</i> are not the attribute: ID and age are both integers, but "the mean ID" is meaningless. Is 20 °C twice as warm as 10 °C? No: Celsius has no true zero. 20 K is twice 10 K.</p>
      <p>The test for a type: apply a transformation that keeps the information (relabel, rescale, shift) and see which statements survive. The scale lab below does exactly that, step by step.</p>`,
    ask: `<div class='a'>Run "Hours to minutes", "°C to °F" and "Relabel satisfaction" in that order and ask before each run which number on screen will stay fixed. Common mistakes: satisfaction 1 to 5 treated as ratio ("4 is twice as satisfied as 2", no). AC temperature in °C is interval, not ratio: the Kelvin edge case drops the ratio 24 ÷ 12 from 2 to 1.04. coffee_cups is a ratio attribute that is also discrete (a count). Year of study is ordinal, not nominal. Then let them do the quiz.</div>`,
    mount() {
      const SC = {

          stats: ([[a, b]]) => [{ k: "Ben ÷ Ana", v: b / a, cls: "good" }, { k: "Ben − Ana", v: b - a, d: 1 }] },
        fahr: { label: "ac_temp_c: °C to °F (1.8 x + 32)", rows: [[{ n: "12 °C", x: 12 }, { n: "18 °C", x: 18 }, { n: "24 °C", x: 24 }]], f: (x) => 1.8 * x + 32, zero: true, unit: "°C → °F",
          stats: ([[a, b, c]]) => [{ k: "24 ÷ 12 (ratio)", v: c / a, cls: Math.abs(c / a - 2) < 0.01 ? "good" : "bad" }, { k: "(24 − 18) ÷ (18 − 12)", v: (c - b) / (b - a), cls: "good" }] },

          stats: ([[a, b, c]]) => [{ k: "24 ÷ 12 (ratio)", v: c / a, cls: Math.abs(c / a - 2) < 0.01 ? "good" : "bad" }, { k: "(24 − 18) ÷ (18 − 12)", v: (c - b) / (b - a), cls: "good" }] },
        ordinal: { label: "satisfaction: relabel 4 → 10, 5 → 11", rows: [[2, 3, 3, 3, 4].map((x) => ({ n: "", x })), [1, 1, 4, 4, 4].map((x) => ({ n: "", x }))], names: ["Group A", "Group B"], f: (x) => ({ 1: 1, 2: 2, 3: 3, 4: 10, 5: 11 })[x], zero: false, unit: "answer codes", centers: true,
          stats: ([A, B]) => { const mA = mean(A), mB = mean(B), dA = median(A), dB = median(B); return [{ k: "Mean A", v: mA }, { k: "Mean B", v: mB }, { k: "Mean says", v: mA > mB ? "A happier" : "B happier", cls: mA > mB ? "good" : "bad" }, { k: "Median A", v: dA }, { k: "Median B", v: dB }, { k: "Median says", v: dA > dB ? "A happier" : "B happier", cls: "good" }]; } },
        nominal: { label: "major stored as codes 1 to 5: shuffle the codes", rows: [["CS", "CS", "CS", "Bio", "Chem", "EE"].map((m) => ({ n: m, x: MAJORS.indexOf(m) + 1 }))], f: (x) => [5, 1, 4, 2, 3][x - 1], zero: false, unit: "codes", centers: true, nominal: true,

        const sc = SC[key], T = (x) => (1 - t) * x + t * sc.f(x);

        const ctx = cv.getContext("2d"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
        const allv = R.flat().concat(sc.zero ? [0, T(0)] : []); let lo = Math.min(...allv), hi = Math.max(...allv); const span = hi - lo || 1; lo -= span * 0.08; hi += span * 0.08;
        const L = 90, Rt = W - 20, X = (x) => L + ((x - lo) / (hi - lo)) * (Rt - L);
        ctx.font = "12px Public Sans"; ctx.fillStyle = css("--ink"); ctx.fillText(`${sc.label}: ${fmt(100 * t, 0)}% applied (${sc.unit})`, 10, 16);
        R.forEach((vals, r) => {
          const y = sc.rows.length === 1 ? 130 : 85 + r * 95;
          ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(Rt, y); ctx.stroke();
          ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; for (let g = 0; g <= 6; g++) { const x = lo + (g / 6) * (hi - lo); ctx.fillRect(X(x) - 0.5, y - 3, 1, 6); ctx.fillText(tick(x, hi - lo < 20 ? 1 : 0), X(x), y + 18); }
          ctx.textAlign = "left"; if (sc.names) { ctx.fillStyle = css("--ink"); ctx.fillText(sc.names[r], 8, y + 4); }
          const seen = {}, stackOf = vals.map((x) => { const kx = fmt(x, 3); return [kx, (seen[kx] = (seen[kx] || 0) + 1) - 1]; });
          vals.forEach((x, i) => {
            const [kx, stack] = stackOf[i], py = y - 14 - stack * 20;
            ctx.fillStyle = sc.nominal ? MAJOR_COLORS[sc.rows[r][i].n] : css("--lagoon"); ctx.beginPath(); ctx.arc(X(x), py, 8, 0, 7); ctx.fill();
            const name = sc.rows[r][i].n;
            if (name && stack === seen[kx] - 1) { ctx.fillStyle = css("--ink"); ctx.textAlign = "center"; ctx.fillText(sc.nominal ? (seen[kx] > 1 ? `${name} ×${seen[kx]}` : name) + ` (code ${fmt(x, 1)})` : `${name}: ${fmt(x, 1)}`, X(x), py - 13); ctx.textAlign = "left"; }
          });
          if (sc.centers) {
            const m = mean(vals), md = median(vals);
            ctx.fillStyle = css("--coral"); ctx.beginPath(); ctx.moveTo(X(m), y + 26); ctx.lineTo(X(m) - 6, y + 36); ctx.lineTo(X(m) + 6, y + 36); ctx.fill(); ctx.fillText("mean", X(m) + 8, y + 36);
            if (!sc.nominal) { ctx.fillStyle = css("--mint-2"); ctx.beginPath(); ctx.moveTo(X(md), y + 26); ctx.lineTo(X(md) - 6, y + 36); ctx.lineTo(X(md) + 6, y + 36); ctx.fill(); ctx.fillText("median", X(md) - 50, y + 36); }
          }
          if (sc.zero) {
            ctx.strokeStyle = css("--mint-2"); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X(0), y - 60); ctx.lineTo(X(0), y + 8); ctx.stroke();
            ctx.strokeStyle = css("--coral"); ctx.beginPath(); ctx.moveTo(X(T(0)), y - 60); ctx.lineTo(X(T(0)), y + 8); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = css("--mint-2"); ctx.fillText("0 on the new scale", X(0) + 4, y - 64);
            if (Math.abs(T(0)) > 1e-9) { ctx.fillStyle = css("--coral"); ctx.fillText("old zero", X(T(0)) + 4, y - 50); }
          }
        });
        mb.update(sc.stats(R));
        status.set(key === "kelvin" && t > 0.99 ? "0 °C is a convention (the freezing point of water), not 'no temperature'. On the Kelvin scale, which has a true zero, 24 °C is only 1.04 times 12 °C. Ratios of Celsius values mean nothing." : key === "nominal" && t > 0.99 ? "The codes are labels. After the shuffle the mean code is 3.5 instead of 2.33, with the same students. Only the mode (CS) survives a relabeling, so a nominal attribute allows only =, ≠ and counts." : "", "edge");

      const scSel = select({ label: "Scenario", options: Object.entries(SC).map(([value, s]) => ({ value, label: s.label })), value: key, onchange: (v) => { key = v; t = 0; tCtl.set(0); draw(); } });
      draw();
      const play = async (k) => { scSel.apply(k); await sleep(600); await tCtl.animateTo(1, 2200); await sleep(300); };
      const ex = examples([
        { label: "Hours to minutes", kind: "example", note: "Every value is multiplied by 60 while you watch. <b>Ben ÷ Ana stays 2</b> the whole way and the zero does not move: ratios survive a pure scaling, so sleep_hours is a <b>ratio</b> attribute.", run: () => play("ratio") },
        { label: "°C to °F", kind: "example", note: "The map is 1.8 x + 32: it stretches <i>and</i> shifts, so the zero moves. The ratio 24 ÷ 12 drifts from 2 to 1.4, but the ratio of differences stays 1. On an <b>interval</b> scale only differences carry meaning.", run: () => play("fahr") },

        { label: "Is 24 °C twice 12 °C?", kind: "edge", note: "Shift to Kelvin, the scale with a true zero. The old zero slides far to the right of the new one, and the ratio collapses from 2 to 1.04.", run: () => play("kelvin") },
        { label: "Numbers that are labels", kind: "edge", note: "Majors stored as codes 1 to 5 look numeric, so software happily averages them. Shuffle the codes: the students fly to new positions, the mean code changes, the mode does not.", run: () => play("nominal") },
      ]);
      const T4 = ["Nominal", "Ordinal", "Interval", "Ratio"];
      const items = [
        { q: "id (student number)", options: T4, answer: "Nominal", why: "Only equality matters; the number is a label." },
        { q: "major", options: T4, answer: "Nominal", why: "No order between CS and Bio." },
        { q: "year (1st year ... PhD)", options: T4, answer: "Ordinal", why: "Ordered, but the gap 1st to 2nd is not comparable to MS to PhD." },

  steps.push({
    id: "datasets", title: "Discrete or continuous, and kinds of datasets", time: 10,
    theory: `<h3>More ways to describe data</h3>
      <ul><li><b>Discrete</b> attributes have a finite or countable set of values (counts, zip codes, words). <b>Continuous</b> attributes are real numbers (temperature, height), stored as floating point with finite precision.</li>
      <li><b>Asymmetric</b> attributes: only non-zero values matter. Student × course enrollment is 1 for a few courses and 0 for hundreds; two students sharing a 0 tells us nothing.</li>
      <li>Dataset characteristics: <b>dimensionality</b> (number of attributes; many leads to the curse of dimensionality), <b>sparsity</b> (most entries zero, which can be a blessing for storage), <b>resolution</b> (patterns depend on the scale: hourly vs daily).</li>
      <li>Types of datasets: <b>record data</b> (our table; transaction data; a data matrix; a sparse document-term matrix), <b>graph data</b> (social networks, molecules, road maps), <b>ordered data</b> (sequential transactions, sequences without time stamps, time series with temporal autocorrelation, spatial data with spatial autocorrelation).</li></ul>`,
    ask: `<div class='a'>Show the three views with the example buttons, then ask for examples from their own phones: contacts (record), WhatsApp groups (graph), step counter (time series), maps (spatial). Ask which attributes of the survey are discrete (id, major, year, satisfaction, coffee_cups) and which continuous. Before "Two students with no courses", ask how similar two students are who took nothing: simple matching says 100%, Jaccard is 0 ÷ 0. Before "Shuffle the days", ask what changes: mean and sd stay, the lag-1 autocorrelation collapses.</div>`,
    mount() {
      const NS = 12, NC = 40, rngM = RNG(31);
      const perms = Array.from({ length: NS }, () => rngM.shuffle([...Array(NC).keys()]));
      perms[1] = [perms[0][0], ...perms[1].filter((c) => c !== perms[0][0])];
      const NN = 14, rngG = RNG(32);
      const nodes = Array.from({ length: NN }, (_, i) => { const a = (i / NN) * 2 * Math.PI; return [380 + Math.cos(a) * 250 + rngG.normal(0, 16), 140 + Math.sin(a) * 92 + rngG.normal(0, 8)]; });
      const edges = [], seenE = new Set();
      while (edges.length < 24) { const i = rngG.int(NN); let j = (i + 1 + rngG.int(3)) % NN; if (rngG() < 0.3) j = rngG.int(NN); if (i === j) continue; const k = Math.min(i, j) + "-" + Math.max(i, j); if (seenE.has(k)) continue; seenE.add(k); edges.push([i, j]); }
      const rngS = RNG(33); let ar = 0; const STEPS = Array.from({ length: 60 }, () => { ar = 0.85 * ar + rngS.normal(0, 1500); return Math.round(8000 + ar); });
      const PERM = RNG(34).shuffle([...Array(60).keys()]);
      let view = "matrix", k = 3, ek = edges.length, shuffled = false, reveal = 60;
      const cv = canvas(760, 260), mb = metricsBox(), status = statusBox();
      const cellsFor = (kk) => { const c = new Array(NS * NC).fill(0); perms.forEach((p, s) => p.slice(0, kk).forEach((ci) => (c[s * NC + ci] = 1))); return c; };
      const target = () => ({ view, cells: cellsFor(k), ek, pos: STEPS.map((_, i) => (shuffled ? PERM[i] : i)), reveal });
      function drawState(st) {
        const ctx = cv.getContext("2d"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H); ctx.font = "12px Public Sans";
        if (st.view === "matrix") {
          const x0 = 60, y0 = 34, cw = (W - x0 - 10) / NC, ch = 17;
          ctx.fillStyle = css("--ink"); ctx.fillText(`${NS} students × ${NC} courses (filled = enrolled). Outlined: students S1 and S2.`, x0, 16);
          for (let s = 0; s < NS; s++) {
            ctx.fillStyle = s < 2 ? css("--coral") : css("--muted"); ctx.fillText("S" + (s + 1), 20, y0 + s * ch + 12);
            for (let c = 0; c < NC; c++) {
              const a = st.cells[s * NC + c]; ctx.strokeStyle = css("--line"); ctx.strokeRect(x0 + c * cw + 0.5, y0 + s * ch + 0.5, cw - 1, ch - 1);
              if (a > 0.01) { ctx.globalAlpha = a; ctx.fillStyle = css("--lagoon"); ctx.fillRect(x0 + c * cw + 2, y0 + s * ch + 2, cw - 4, ch - 4); ctx.globalAlpha = 1; }
            }
          }
          ctx.strokeStyle = css("--coral"); ctx.lineWidth = 2; ctx.strokeRect(x0 - 1, y0 - 1, NC * cw + 2, 2 * ch + 2); ctx.lineWidth = 1;
        } else if (st.view === "graph") {
          ctx.fillStyle = css("--ink"); ctx.fillText(`Friendships among ${NN} students: nodes and edges, no table rows.`, 10, 16);
          edges.forEach(([i, j], e) => { const a = clamp(st.ek - e, 0, 1); if (a <= 0) return; ctx.globalAlpha = a; ctx.strokeStyle = css("--lagoon"); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(...nodes[i]); ctx.lineTo(...nodes[j]); ctx.stroke(); ctx.globalAlpha = 1; });
          nodes.forEach(([x, y], i) => { ctx.fillStyle = css("--panel"); ctx.strokeStyle = css("--ink-2"); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = css("--ink"); ctx.textAlign = "center"; ctx.fillText("S" + (i + 1), x, y + 4); ctx.textAlign = "left"; });
        } else {
          const L = 56, R = W - 12, T = 26, B = H - 26, lo = Math.min(...STEPS) - 300, hi = Math.max(...STEPS) + 300;
          const X = (p) => L + (p / 59) * (R - L), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (B - T);
          ctx.fillStyle = css("--ink"); ctx.fillText("Daily step count, 60 days (color = the real day: blue early, red late)", L, 16);
          ctx.fillStyle = css("--muted"); for (let g = 0; g <= 4; g++) { const v = lo + (g / 4) * (hi - lo); ctx.fillText(fmt(v, 0), 4, Y(v) + 4); } ctx.fillText("position in the series", R - 140, H - 8);
          const shown = STEPS.map((v, i) => [st.pos[i], v, i]).filter((p) => p[0] <= st.reveal + 1e-9).sort((a, b) => a[0] - b[0]);
          ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.beginPath(); shown.forEach(([p, v], i) => (i ? ctx.lineTo(X(p), Y(v)) : ctx.moveTo(X(p), Y(v)))); ctx.stroke();
          shown.forEach(([p, v, i]) => { ctx.fillStyle = `hsl(${230 - (i / 59) * 230}, 70%, 60%)`; ctx.beginPath(); ctx.arc(X(p), Y(v), 4, 0, 7); ctx.fill(); });
        }
      }
      const morph = morpher(drawState, 700);
      function stats() {
        if (view === "matrix") {
          const c = cellsFor(k), zeros = c.filter((x) => !x).length, s1 = c.slice(0, NC), s2 = c.slice(NC, 2 * NC);
          let both1 = 0, either = 0, match = 0; for (let i = 0; i < NC; i++) { if (s1[i] && s2[i]) both1++; if (s1[i] || s2[i]) either++; if (s1[i] === s2[i]) match++; }
          const jac = either ? both1 / either : NaN;

        } else if (view === "graph") {
          const E = Math.round(ek), deg = new Array(NN).fill(0); edges.slice(0, E).forEach(([i, j]) => { deg[i]++; deg[j]++; });
          mb.update([{ k: "Nodes", v: NN, d: 0 }, { k: "Edges", v: E, d: 0 }, { k: "Average degree", v: (2 * E) / NN, d: 1 }, { k: "Most friends", v: Math.max(...deg), d: 0 }]);
          status.set("");
        } else {
          const seq = new Array(60); STEPS.forEach((v, i) => (seq[shuffled ? PERM[i] : i] = v)); const m = mean(seq);
          let num = 0, den = 0; seq.forEach((v, i) => { den += (v - m) ** 2; if (i < 59) num += (v - m) * (seq[i + 1] - m); });
          mb.update([{ k: "Mean steps", v: m, d: 0 }, { k: "Std dev", v: sd(seq), d: 0 }, { k: "Lag-1 autocorrelation", v: num / den, d: 2, cls: num / den > 0.5 ? "good" : "bad" }]);
          status.set(shuffled ? "Same 60 values, same mean, same sd: as a set of records nothing changed. But the order was information. Neighboring days are no longer alike, so the autocorrelation collapses." : "", "info");
        }
      }

  steps.push({
    id: "measurement", title: "Measurement error: precision, bias, accuracy", time: 10,
    theory: `<h3>Why collected data is never the truth</h3>
      <p>Errors come from the <b>measurement</b> process (a sensor, a questionnaire, a human typing) and from <b>data collection</b> (objects omitted, or included by mistake). Errors can be systematic or random. If we measure the same quantity repeatedly:</p>
      <ul><li><b>Precision</b>: how close repeated measurements are to each other (their standard deviation).</li>
      <li><b>Bias</b>: the systematic gap between the mean of the measurements and the true value.</li>
      <li><b>Accuracy</b>: closeness to the true value, measured by the mean squared error. MSE = bias² + variance.</li></ul>
      <p><b>Noise</b> is the random component of measurement error. Deterministic distortions (a streak in the same place on every photo) are <b>artifacts</b>. Signal processing fights noise; data mining mostly tries to use algorithms that are robust to it.</p>`,
    ask: `<div class='a'>Ask: "A bathroom scale that always reads 2 kg too much: precise or accurate?" (precise, biased; "Precise but biased"). "A scale that varies ±3 kg but averages right?" (unbiased, imprecise; "Unbiased but noisy"). Which is easier to fix? Bias: subtract it ("Calibrate"). Noise can only be averaged ("Average repeated readings": averaging 16 readings cuts the sd from 0.97 to 0.25 h and the MSE from 1.28 to 0.30, while the bias stays near 0.5 h). The zero-noise edge case shows perfect precision (sd 0) with an MSE of exactly bias² = 1.00.</div>`,
    mount() {
      let bias = 0.5, noise = 0.4, reps = 1, shown = 400; const TRUE = 7.0, N = 400, RMAX = 16;

      function redraw() {
        const k = clamp(Math.round(shown), 1, N), S = shots().slice(0, k), xs = S.map((p) => p[0]);
        const m = mean(xs), s = sd(xs), mse = mean(xs.map((x) => (x - TRUE) ** 2));
        const ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height); ctx.font = "12px Public Sans";
        const cx = 140, cy = 150, PX = 52;
        ctx.save(); ctx.beginPath(); ctx.rect(0, 22, 282, 258); ctx.clip();
        [2.5, 2, 1.5, 1, 0.5].forEach((r, i) => { ctx.fillStyle = i % 2 ? css("--paper") : css("--panel"); ctx.strokeStyle = css("--line"); ctx.beginPath(); ctx.arc(cx, cy, r * PX, 0, 7); ctx.fill(); ctx.stroke(); });
        ctx.globalAlpha = 0.55; ctx.fillStyle = css("--lagoon"); S.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(cx + (x - TRUE) * PX, cy + y * PX, 2.6, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
        ctx.strokeStyle = css("--mint-2"); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
        ctx.strokeStyle = css("--coral"); ctx.beginPath(); ctx.arc(cx + (m - TRUE) * PX, cy, 7, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
        ctx.restore(); ctx.fillStyle = css("--ink"); ctx.fillText("Target: rings every 0.5 h; + true value, ○ mean", 4, 14);
        drawHist(cv, histState(xs, { min: 4, max: 10, bins: 40, title: `${k} measurements of a student who really sleeps 7.0 h`, lines: [{ x: TRUE, color: css("--mint-2"), label: "true 7.0 h" }, { x: m, color: css("--coral"), label: `mean ${fmt(m, 2)}`, dy: 14, dash: [4, 3] }] }), { x: 290, y: 0, w: 470, h: 280 });
        mb.update([{ k: "Precision (sd)", v: s }, { k: "Bias (mean − true)", v: m - TRUE }, { k: "Accuracy (MSE)", v: mse, d: 3 }, { k: "bias² + variance", v: (m - TRUE) ** 2 + s * s, d: 3 }]);
        status.set(noise > 0 ? "" : Math.abs(bias) < 1e-9 ? "Noise 0 and bias 0: every reading is exactly 7.0 h, MSE 0. A perfect instrument; real ones never get here." : `Noise is 0: all ${k} readings are identical, so the spread is 0, perfect precision. The bias is still ${fmt(bias, 1)} h, so MSE = bias² = ${fmt(bias * bias, 2)}. Precision is not accuracy.`);
      }
      async function fire(ms = 1500) { await tween(ms, (t) => { shown = 1 + (N - 1) * t; redraw(); }); shown = N; redraw(); }
      const bCtl = range({ label: "Bias (systematic error, h)", min: -1.5, max: 1.5, step: 0.1, value: bias, fmt: (v) => v.toFixed(1), onchange: (v) => { bias = v; redraw(); } });
      const nCtl = range({ label: "Noise (random error, sd)", min: 0, max: 1.5, step: 0.05, value: noise, fmt: (v) => v.toFixed(2), onchange: (v) => { noise = v; redraw(); } });
      const rCtl = range({ label: "Readings averaged per measurement", min: 1, max: RMAX, step: 1, value: reps, onchange: (v) => { reps = v; redraw(); } });
      redraw();

    },
  });

  steps.push({
    id: "outliers", title: "Noise vs outliers", time: 15,

      <p><b>Outliers</b> are data objects or values considerably different from most of the others. They are not noise: a student who really sleeps 4 hours is a real, interesting record (anomaly detection lives on them). But "sleep = 70 hours" is a data-entry error that will wreck any average. Common detection rules:</p>
      <ul><li>z-score: flag |x − mean| &gt; k × sd (fragile: the outlier inflates the sd that is supposed to catch it).</li>
      <li>IQR rule: flag x outside [Q1 − 1.5 IQR, Q3 + 1.5 IQR] (robust: quartiles barely move).</li></ul>
      <p>Watch how the <b>mean</b> runs after the outliers while the <b>median</b> stays put. Robust statistics are the first line of defense.</p>`,
    ask: `<div class='a'>Before "Mean runs, median stays", ask where the mean will end up with 20 injected errors: 7 of them land in sleep_hours and drag the mean from 6.50 to 8.08 h, while the median stays at 6.50. "Masking: the z-rule": the |z| &gt; 3 upper fence runs from 9.45 h to 38.95 h because the errors inflate the sd. The errors (60 h or more) are still caught, but a 30 h error would now hide, and the one real student flagged at 0 errors is no longer flagged. "IQR fences stay put": the fences move from 3.85 to 9.05 h to 3.55 to 9.55 h. Then ask: "Should we delete the student who sleeps 4 h?" No, that is a real value. "An outlier that is a real value" shows |z| &gt; 2 flagging 14 real students with no errors at all. Deleting outliers blindly throws away the anomalies we might be looking for.</div>`,

        let lo = NaN, hi = NaN;
        if (rule === "z2" || rule === "z3") { const kk = rule === "z2" ? 2 : 3; if (s > 0) { lo = m - kk * s; hi = m + kk * s; } } else if (rule === "iqr") { lo = q1 - 1.5 * iqr; hi = q3 + 1.5 * iqr; }

        const st = histState(v, { min: 3, max: 90, bins: 60, title: constant ? "sleep_hours: every real answer is 7.0, plus the injected errors" : "sleep_hours with injected data-entry errors (red bars = flagged)", lines: [{ x: m, color: css("--coral"), label: `mean ${fmt(m, 2)}` }, { x: md, color: css("--mint-2"), label: `median ${fmt(md, 2)}`, dy: 14 }, { x: lo, color: css("--ink-2"), label: "lower fence", dash: [3, 3], dy: 28 }, { x: hi, color: css("--ink-2"), label: "upper fence", dash: [3, 3], dy: 42 }] });
        st.binColors = st.bins.map((_, i) => { const a = 3 + (i * 87) / 60, b = a + 87 / 60; return v.some((x) => x >= a && x < b && flag(x)) ? css("--coral") : css("--lagoon"); });

        mb.update([{ k: "Mean", v: m, cls: nOut ? "bad" : "" }, { k: "Median", v: md, cls: "good" }, { k: "Std dev", v: s }, { k: "Flagged by rule", v: flagged.length, d: 0 }, { k: "...of which real students", v: realOnes, d: 0, cls: realOnes ? "bad" : "" }, { k: "Errors missed", v: rule === "none" ? errors : errors - caught, d: 0, cls: errors - caught ? "bad" : "good" }]);

  steps.push({
    id: "missing", title: "Missing values", time: 15,
    theory: `<h3>Eliminate, estimate, or ignore</h3>
      <p>Values go missing because they were not collected or not applicable. The options from the lecture: <b>eliminate</b> the objects or attributes, <b>estimate</b> the missing values (mean, median, a model), or <b>ignore</b> them in the analysis (compute each statistic from the available values).</p>
      <p>The danger is <i>why</i> a value is missing. If students who sleep little skip the sleep question, every simple strategy is biased: dropping them, or filling in the class mean, both make the class look better rested than it is. Toggle "missing not at random" and compare the estimated mean with the truth. Also watch the correlation between study hours and GPA when we impute the mean: imputed points sit on a flat line and dilute the pattern.</p>`,
    ask: `<div class='a'>Ask: "What mean do you expect after mean imputation?" (unchanged, by construction; but the variance shrinks and the correlation drops: "Mean imputation" at 30% missing takes corr(study, gpa) from 0.76 to 0.65, and "More missing, flatter cloud" ends at 0.53 with 60% missing). Then run "Not at random" and ask which strategy recovers the true mean of 6.50 h. None: at 30% missing the estimates are 6.64 (eliminate), 6.70 (mean), 6.68 (median) and 6.70 (ignore). You need a model of the missingness. The edge case "A column entirely missing" shows that no strategy can recover an attribute that was never observed.</div>`,
    mount() {
      let rate = 0.2, biased = false, strategy = "drop", allMiss = false;
      const cv = canvas(760, 270), cv2 = canvas(760, 170), mb = metricsBox(), status = statusBox();
      const trueMean = avg(col(CLEAN, "sleep_hours")), trueCorr = corr(CLEAN, "study_hours", "gpa");
      const XR = [0, 46], YR = [1.4, 4.1], N = CLEAN.length;
      function compute() {
        const rows = messy(CLEAN, { missing: rate, missingBiased: biased, outliers: 0, typos: 0, duplicates: 0, noise: 0 }, 2);
        const rng = RNG(9); rows.forEach((r) => { if (rng() < rate) r.study_hours = null; });
        if (allMiss) rows.forEach((r) => (r.sleep_hours = null));
        const obsS = col(rows, "sleep_hours"), obsT = col(rows, "study_hours");
        const fillS = strategy === "mean" ? avg(obsS) : strategy === "median" ? median(obsS) : NaN, fillT = strategy === "mean" ? avg(obsT) : strategy === "median" ? median(obsT) : NaN;
        const kept = rows.map((r) => strategy !== "drop" || (r.sleep_hours != null && r.study_hours != null));
        const fixed = rows.map((r) => (strategy === "mean" || strategy === "median" ? { ...r, sleep_hours: r.sleep_hours ?? (isFinite(fillS) ? fillS : null), study_hours: r.study_hours ?? fillT } : r)).filter((_, i) => kept[i]);
        return { rows, kept, fixed, fillS, fillT };
      }
      function drawSc(st) {
        const ctx = cv.getContext("2d"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H); ctx.font = "12px Public Sans";
        const L = 44, R = W - 12, T = 22, B = H - 28, X = (x) => L + ((x - XR[0]) / (XR[1] - XR[0])) * (R - L), Y = (y) => T + (1 - (y - YR[0]) / (YR[1] - YR[0])) * (B - T);
        ctx.fillStyle = css("--muted"); [0, 10, 20, 30, 40].forEach((x) => ctx.fillText(x, X(x) - 6, H - 10)); [1.5, 2, 2.5, 3, 3.5, 4].forEach((y) => ctx.fillText(fmt(y, 1), 8, Y(y) + 4)); ctx.fillText("study_hours", R - 70, H - 10); ctx.fillText("gpa", 8, T - 6);
        CLEAN.forEach((r, i) => { if (st.ghost[i] < 0.02) return; ctx.globalAlpha = 0.35 * st.ghost[i]; ctx.strokeStyle = css("--coral"); ctx.beginPath(); ctx.arc(X(r.study_hours), Y(r.gpa), 3.5, 0, 7); ctx.stroke(); });
        ctx.globalAlpha = 1;
        if (isFinite(st.fx)) { ctx.strokeStyle = css("--coral"); ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(st.fx), T); ctx.lineTo(X(st.fx), B); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = css("--coral"); ctx.fillText(`imputed study_hours = ${fmt(st.fx, 1)}`, X(st.fx) + 6, T + 10); }
        let visible = 0;
        for (let i = 0; i < N; i++) { if (st.al[i] < 0.02) continue; visible++; ctx.globalAlpha = st.al[i] * (st.red[i] > 0.5 ? 0.9 : 0.5); ctx.fillStyle = st.red[i] > 0.5 ? css("--coral") : css("--lagoon"); ctx.beginPath(); ctx.arc(X(st.xs[i]), Y(st.ys[i]), 3.6, 0, 7); ctx.fill(); }
        ctx.globalAlpha = 1; ctx.fillStyle = css("--ink"); ctx.fillText(st.title, L, 14);
        if (!visible) { ctx.fillStyle = css("--coral"); ctx.textAlign = "center"; ctx.fillText("No rows left to plot.", (L + R) / 2, (T + B) / 2); ctx.textAlign = "left"; }
      }
      const morphSc = morpher(drawSc, 900), morphH = morpher((st) => drawHist(cv2, st), 700);
      function redraw(o = {}) {
        const { rows, kept, fixed, fillT } = compute();
        const xs = [], ys = [], al = [], red = [], ghost = [];
        rows.forEach((r, i) => {
          const miss = r.study_hours == null, imputed = miss && (strategy === "mean" || strategy === "median"), vis = kept[i] && (!miss || imputed);
          xs.push(vis ? (imputed ? fillT : r.study_hours) : CLEAN[i].study_hours); ys.push(r.gpa); al.push(vis ? 1 : 0); red.push(imputed ? 1 : 0); ghost.push(miss ? 1 : 0);
        });
        const names = { drop: "eliminate rows", mean: "estimate with the mean", median: "estimate with the median", ignore: "ignore (available values)" };

    return out;
  }
  function summary(rows) { const g = {}; MAJORS.forEach((m) => { const v = rows.filter((r) => r.major === m && r.sleep_hours != null).map((r) => r.sleep_hours); g[m] = v.length ? mean(v) : NaN; }); return { groups: g, n: rows.length, corr: corr(rows, "study_hours", "gpa"), commute: median(col(rows, "commute_min")), coffee: mean(col(rows, "coffee_cups")) }; }
  const TP = { missing: 0.15, missingBiased: true, outliers: 12, typos: 0.25, duplicates: 20, noise: 1.5 };
  function tourRun(p, seeds) {
    const pts = [], det = [];
    for (const s of seeds) {
      const truth = clean(s); const dirty = messy(truth, TP, s); const fixed = pipeline(dirty, p);
      const a = summary(truth), b = summary(fixed);
      let err = 0; MAJORS.forEach((m) => (err += isNaN(b.groups[m]) ? 1 : Math.min(1, Math.abs(a.groups[m] - b.groups[m]) / 0.5)));
      err = err / 5 * 0.4 + Math.min(1, Math.abs(a.n - b.n) / 40) * 0.2 + Math.min(1, Math.abs(a.corr - b.corr) / 0.3) * 0.2 + Math.min(1, Math.abs(a.commute - b.commute) / 10) * 0.1 + Math.min(1, Math.abs(a.coffee - b.coffee) / 2) * 0.1;
      pts.push(1000 * (1 - err)); det.push({ n: b.n, tn: a.n, corr: b.corr, tcorr: a.corr });
    }
    return { points: mean(pts), details: [{ k: "Rows after cleaning", v: fmt(mean(det.map((d) => d.n)), 0) }, { k: "True rows", v: fmt(mean(det.map((d) => d.tn)), 0) }, { k: "corr(study, gpa)", v: fmt(mean(det.map((d) => d.corr)), 2) }, { k: "true corr", v: fmt(mean(det.map((d) => d.tcorr)), 2) }], summary: "Score = how close your cleaned dataset's summary statistics are to the hidden clean truth: mean sleep per major (40%), number of students (20%), corr(study, gpa) (20%), median commute (10%), mean coffee (10%)." };
  }
  const TOUR = Lab.tournamentSpec({
    labId: "L3",
    intro: `<h3>Rules</h3><p>Each hidden survey has typos in <i>major</i>, duplicate submissions, data-entry errors in sleep, coffee and commute, and missing values that are <b>not</b> missing at random. Choose a cleaning pipeline (the steps run in the order listed). Your cleaned dataset is compared with the true clean dataset on the summary statistics listed under the result. Practice on 3 surveys, then one official run on 5 hidden surveys.</p>`,
    params: [
      { key: "labels", label: "1. Labels", type: "select", string: true, options: [{ value: "asis", label: "leave as they are" }, { value: "fix", label: "standardize major labels" }], default: "asis" },
      { key: "dedupe", label: "2. Duplicates", type: "select", string: true, options: [{ value: "no", label: "keep" }, { value: "yes", label: "remove by id" }], default: "no" },
      { key: "outlier", label: "3. Outlier rule", type: "select", string: true, options: [{ value: "none", label: "none" }, { value: "z2", label: "|z| > 2" }, { value: "z3", label: "|z| > 3" }, { value: "iqr", label: "IQR × 1.5" }], default: "none" },
      { key: "action", label: "3b. Outlier action", type: "select", string: true, options: [{ value: "remove", label: "remove the row" }, { value: "null", label: "set the value to missing" }, { value: "median", label: "replace with the median" }], default: "remove" },
      { key: "missing", label: "4. Missing values", type: "select", string: true, options: [{ value: "ignore", label: "ignore (use available values)" }, { value: "drop", label: "drop the row" }, { value: "mean", label: "estimate with the mean" }, { value: "median", label: "estimate with the median" }], default: "ignore" },
    ],
    practiceSeeds: [21, 22, 23],
    run: tourRun,
  });
  steps.push({
    id: "tournament", title: "Tournament: the cleaning challenge", tour: true, time: 20,
    mount: () => {
      const dirty = messy(clean(21), TP, 21), labels = new Set(dirty.map((r) => r.major)), ids = new Set(dirty.map((r) => r.id));
      return h("div", {}, tournament(TOUR),
        h("h3", {}, "What a practice survey looks like (survey 21, first rows)"),
        h("div", { class: "metrics" }, metric("Rows", dirty.length), metric("Distinct ids", ids.size), metric("Distinct major labels", labels.size), metric("Missing sleep_hours", dirty.filter((r) => r.sleep_hours == null).length), metric("Sleep values over 24 h", dirty.filter((r) => r.sleep_hours > 24).length)),
        table(dirty.map((r) => ({ ...r, major: vis(r.major) })), COLS, 10));
    },
  });

  window._lab3 = { clean, messy, pipeline, summary, tourRun, corr, TOUR };
  Lab.init({ title: "Lab 3: Data and data quality", steps, footer: "Sunday, week 1. Slides: Data Mining and Data." });
})();
