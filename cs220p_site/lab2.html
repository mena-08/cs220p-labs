<script>
window.LAB_TASKS = {
formulation: `Write the robot's problem as states, initial state, actions, transition model, goal test and path cost, and find the map whose graph is a tree.`,
report: `Fill in all 12 cards, write your name and team, and submit once; the verdicts appear after you submit.`,
frontier: `Before each Step, say which cell leaves the frontier next, for BFS and for DFS.`,
bfs: `Run BFS on three maps and explain in one sentence why the first path it finds has the fewest moves.`,
dfs: `Explain why DFS returns 98 moves on the campus where BFS needs 28, then watch iterative deepening restart and explain why it still finds the 28 moves.`,
code: `Write expand, BFS and DFS in Python until every test passes on the campus and on the campus with the gate closed.`,
byhand: `Press Start, play BFS and then DFS on the Mini-map, and answer the three questions.`,
applied: `Open each tab and say in one sentence why BFS or DFS fits that problem.`,
treesearch: `Switch Remember between the three options on the Campus and the Maze and explain why the Maze costs nothing extra.`,
blowup: `Guess the depth at which BFS with b = 10 no longer fits in 16 GB, then show the numbers and check your guess.`,
puzzle: `Write the 8-puzzle as a search problem, then solve Medium with BFS and with iterative deepening and compare the memory they need.`,
tournament: `Practice on the three warehouses, find the settings with the best profit, then make your single official run.`,
};

window.LAB_DEEPER = {
formulation: `<p>A search problem is the tuple (S, s<sub>0</sub>, A(s), result(s, a), goal(s), c(s, a, s')). The state space is a graph; the search tree is its unfolding from s<sub>0</sub>, which is infinite as soon as the graph has a cycle. Graph search with a reached table visits each state at most once per improvement of its path cost, so its work is bounded by |S|·b rather than by b<sup>d</sup>. The abstraction level matters: a state that records the robot's heading or battery multiplies |S| by the number of headings or charge levels; include only what the goal and the cost depend on. A grid map with no cycles (a perfect maze) is a tree: every pair of cells is joined by exactly one path, so every complete search returns the same path.</p>`,
frontier: `<p>Separation property: in a graph search, every path from a reached state to an unreached state passes through a frontier node, so the frontier is a cut of the graph. That is why the frontier is all an algorithm must keep to stay complete. The order in which the frontier is emptied defines the algorithm: a FIFO queue gives breadth-first search, a LIFO stack gives depth-first search. Uninformed strategies use nothing but the problem definition: no estimate of how far away the goal is.</p>`,
bfs: `<p>With branching factor b and solution depth d, BFS generates 1 + b + b² + … + b<sup>d</sup> = O(b<sup>d</sup>) nodes, and the frontier at depth d holds b<sup>d</sup> of them, so time and space are both exponential; memory is the binding constraint in practice (a frontier of 10<sup>9</sup> nodes is a few hundred gigabytes). Early goal testing saves the last layer, a factor of b. On a grid the number of cells within distance d grows only like d², so the frontier is a ring (a diamond in an open hall) of about 4d cells.</p>`,
dfs: `<p>Tree-like DFS has O(bm) space but is incomplete in infinite spaces and non-optimal everywhere; graph DFS with a reached table is complete on finite graphs but then costs O(|S|) memory, losing its advantage. Iterative deepening repeats layers; the total work is Σ<sub>ℓ=1</sub><sup>d</sup> O(b<sup>ℓ</sup>) = O(b<sup>d</sup>): the last layer dominates, the repetition costs a factor of about b/(b − 1), which is 1.5 for b = 3. Backtracking search goes further and generates one child at a time, O(m) memory, the workhorse of constraint solvers (Saturday).</p>`,
applied: `<p>Flood fill and the counting of objects (connected-component labeling) are graph search on the pixel grid; image libraries use scan-line fills and a two-pass labeling with union-find, which do the same work with less bookkeeping. With 4 neighbors (used here) and with 8 (diagonals too) the counts can differ: two pixels that touch only at a corner are one object with 8 neighbors. BFS on an implicit graph needs only the successor function, which is how chess engines, puzzle solvers and model checkers explore spaces far too large to store. Word ladders ("doublets") were invented by Lewis Carroll in 1877. Folder sizes are a post-order traversal, as in the Unix du command. The DFS finishing order on the "needs" arrows is a topological order, which is how make and package managers decide what to build first, and an arrow to a task still on the recursion stack (a back edge) proves a cycle.</p>`,
treesearch: `<p>Tree-like search pays for every redundant path. On a grid every move can be undone by the opposite move, so without checks the tree has up to 4<sup>d</sup> nodes at depth d although the map has only a few hundred states. Checking the current path removes loops but not redundant paths: a cell that can be reached by many different loop-free paths is expanded once per path, and the number of such paths still grows exponentially with the distance. In a graph without cycles (a tree, such as a perfect maze) there are no redundant paths, so the path check is all the memory a search needs. The reached table removes both, at the price of storing every reached state: graph search trades memory for time.</p>`,
blowup: `<p>Nodes generated up to depth d: N(BFS) = b + b² + … + b<sup>d</sup>, dominated by the last layer. Iterative deepening generates the layer at depth i once per iteration that reaches it: N(IDS) = d·b + (d − 1)·b² + … + 1·b<sup>d</sup>, only about b/(b − 1) times N(BFS), 11% more for b = 10. Its memory is one path with the siblings of each node on it, b·d nodes. The table uses the lecture's assumptions of 1 million nodes per second and 1 KB per node.</p>`,
puzzle: `<p>The 8-puzzle has 9! = 362,880 arrangements, split into two halves that cannot reach each other (each move preserves the parity of the permutation), so 181,440 states are reachable from any start; the hardest need 31 moves. The 15-puzzle has about 10<sup>13</sup> reachable states and the 24-puzzle about 10<sup>25</sup>: there even iterative deepening is hopeless, and the search needs knowledge about the problem that uninformed strategies do not use.</p>`,
report: `<p>The lecture's table assumes a finite branching factor b and, for optimality, that every action costs the same. d is the depth of the shallowest solution, m the maximum depth of the search tree (possibly infinite) and ℓ the depth limit.</p>`,
};

/* Lab 2: Solving problems by searching. Scenario: campus delivery robot, plus five other maps, a timed hand-run challenge and six applied problems (fills, knights, word ladders, objects, folders, build orders). Uninformed search only. */
(function () {
  const { h, RNG, fmt, range, select, check, metric, quiz, tournament, checkpoint, clamp, sleep, tween, pulse, examples, callout, esc } = Lab;
  const MOVES = [[-1, 0, "Up"], [1, 0, "Down"], [0, -1, "Left"], [0, 1, "Right"]];

  /* ---------- maps: every map is a list of strings; "#" is a wall, "." a free cell, a letter a named place ---------- */
  const CAMPUS = `
####################################
#D.................................#
#.#####.............######.....H...#
#.#####.............######.........#
#.#####.............######..######.#
#...........................######.#
#..L........................######.#
#..................................#
#.......#######################....#
#.......#.....................#....#
#.......#.....................#....#
#.......#...C.................#....#
#.......#.....................#....#
#.......########.....##########....#
#..................................#
#..##########......................#
#..##########...................S..#
#..................................#
####################################`.trim().split("\n");
  /* the same campus with the courtyard gate (row 13, columns 16 to 20) closed for roadworks: the Cafeteria cannot be reached */
  const GATE = [16, 17, 18, 19, 20].map((c) => [13, c]);
  const CAMPUS_CLOSED = CAMPUS.map((row, r) => (r === 13 ? row.slice(0, 16) + "#####" + row.slice(21) : row));
  const blankRows = (H, W) => Array.from({ length: H }, (_, r) => Array.from({ length: W }, (_, c) => (r === 0 || c === 0 || r === H - 1 || c === W - 1 ? "#" : ".")));
  const finish = (g, places) => { for (const [r, c, ch] of places) g[r][c] = ch; return g.map((row) => row.join("")); };
  /* warehouse: eight long shelves; every aisle is a dead end on the right and opens only onto the corridor on the left */
  function warehouseRows() {
    const g = blankRows(19, 36);
    for (let r = 2; r <= 16; r += 2) for (let c = 3; c <= 34; c++) g[r][c] = "#";
    return finish(g, [[1, 1, "D"], [17, 1, "P"], [9, 34, "R"], [17, 34, "O"]]);
  }
  /* maze: a perfect maze (one path between any two cells, many dead ends) carved by a seeded depth-first walk, so it is the same for everyone */
  const MAZE_SEED = 11;
  function mazeRows(seed) {
    const H = 19, W = 35, R = 9, C = 17, rng = RNG(seed);
    const g = Array.from({ length: H }, () => Array(W).fill("#"));
    const seen = new Set([0]), stack = [[0, 0]]; g[1][1] = ".";
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const next = MOVES.filter(([dr, dc]) => r + dr >= 0 && r + dr < R && c + dc >= 0 && c + dc < C && !seen.has((r + dr) * C + c + dc));
      if (!next.length) { stack.pop(); continue; }
      const [dr, dc] = rng.pick(next), nr = r + dr, nc = c + dc;
      seen.add(nr * C + nc); g[2 * r + 1 + dr][2 * c + 1 + dc] = "."; g[2 * nr + 1][2 * nc + 1] = "."; stack.push([nr, nc]);
    }
    return finish(g, [[1, 1, "E"], [17, 33, "X"], [1, 33, "T"], [17, 1, "B"]]);
  }
  /* open hall: six pillars and nothing else */
  function hallRows() {
    const g = blankRows(19, 36);
    for (const [r0, c0] of [[4, 8], [4, 17], [4, 26], [13, 8], [13, 17], [13, 26]]) for (let r = r0; r < r0 + 2; r++) for (let c = c0; c < c0 + 2; c++) g[r][c] = "#";
    return finish(g, [[9, 1, "E"], [9, 34, "T"], [1, 17, "B"], [17, 1, "C"], [17, 34, "K"]]);
  }
  /* office: a corridor between two rows of rooms with doors; one room has a partition; the server room (south-east) has no door */
  function officeRows() {
    const g = blankRows(19, 36);
    for (let c = 1; c <= 34; c++) { g[7][c] = "#"; g[11][c] = "#"; }
    for (const c of [9, 18, 27]) { for (let r = 1; r <= 6; r++) g[r][c] = "#"; for (let r = 12; r <= 17; r++) g[r][c] = "#"; }
    for (const c of [4, 13, 22, 31]) g[7][c] = ".";
    for (const c of [4, 13, 22]) g[11][c] = ".";
    for (let r = 1; r <= 4; r++) g[r][14] = "#";
    return finish(g, [[9, 1, "E"], [2, 16, "Y"], [2, 31, "K"], [15, 4, "M"], [14, 31, "V"]]);
  }
  const CAMPUS_POIS = { D: "Depot", L: "Library", C: "Cafeteria", H: "Housing", S: "Sports hall" };
  const MAPS = {
    campus: { name: "Campus", rows: CAMPUS, pois: CAMPUS_POIS, start: "Library", goal: "Cafeteria" },
    gate: { name: "Campus, courtyard gate closed", rows: CAMPUS_CLOSED, pois: CAMPUS_POIS, gate: GATE, start: "Library", goal: "Cafeteria" },
    warehouse: { name: "Warehouse (dead-end aisles)", rows: warehouseRows(), pois: { D: "Dock", P: "Packing", R: "Returns", O: "Office" }, start: "Dock", goal: "Packing" },
    maze: { name: "Maze (one path, dead ends)", rows: mazeRows(MAZE_SEED), pois: { E: "Entrance", X: "Exit", T: "Treasure", B: "Back door" }, start: "Entrance", goal: "Exit" },
    hall: { name: "Open hall (six pillars)", rows: hallRows(), pois: { E: "Entrance", T: "Stage", B: "Bar", C: "Cloakroom", K: "Kitchen" }, start: "Entrance", goal: "Stage" },
    office: { name: "Office (locked server room)", rows: officeRows(), pois: { E: "Entrance", Y: "Your desk", K: "Kitchen", M: "Meeting room", V: "Server room" }, start: "Entrance", goal: "Your desk" },
  };
  const MAP_IDS = Object.keys(MAPS);

  function makeGrid(rows, names) {
    const H = rows.length, W = rows[0].length;
    const wall = [], pois = {};
    for (let r = 0; r < H; r++) { wall.push([]); for (let c = 0; c < W; c++) { const ch = rows[r][c]; wall[r].push(ch === "#"); if (names[ch]) pois[names[ch]] = [r, c]; } }
    return { H, W, wall, pois };
  }
  const GRIDS = {};
  const grid = (id = "campus") => GRIDS[id] || (GRIDS[id] = Object.assign(makeGrid(MAPS[id].rows, MAPS[id].pois), { id, gate: MAPS[id].gate || null }));
  const key = (r, c) => r * 100 + c;
  const cellOf = (k) => [Math.floor(k / 100), k % 100];
  const passable = (g, r, c) => r >= 0 && c >= 0 && r < g.H && c < g.W && !g.wall[r][c];
  const neighbors = (g, k) => { const [r, c] = cellOf(k), out = []; for (const [dr, dc] of MOVES) if (passable(g, r + dr, c + dc)) out.push(key(r + dr, c + dc)); return out; };
  const chain = (parent, k) => { const p = []; while (k !== null && k !== undefined) { p.push(k); k = parent.get(k); } return p.reverse(); };
  /* the map as a graph: nodes = free cells, edges = pairs of free cells side by side (each legal move and its reverse) */
  function graphStats(g) {
    if (g.stats) return g.stats;
    let nodes = 0, edges = 0;
    for (let r = 0; r < g.H; r++) for (let c = 0; c < g.W; c++) if (!g.wall[r][c]) { nodes++; if (passable(g, r, c + 1)) edges++; if (passable(g, r + 1, c)) edges++; }
    return (g.stats = { nodes, edges });
  }

  /* search on a grid. algo: bfs | dfs (graph search, reached table) | dls | ids | bfs-path | dfs-path (tree search, no state repeated on the node's own path) | bfs-tree | dfs-tree (tree search, no checks)
     returns {path:[[r,c]...]|null, moves, expanded:[[r,c]...], maxFrontier, generated, iterations?, gaveUp?}
     bfs and dfs also return events (the keys added to the frontier by each expansion, to replay the exact queue or stack) and depth (moves from the start of every reached key);
     dls and ids return marks ([{at, L}]: where each iteration starts) and cutoff. Every variant terminates: the graph searches run out of frontier, the tree searches stop at cap */
  function search(g, start, goal, algo, opts = {}) {
    const limit = opts.limit ?? 30, cap = opts.cap ?? 30000;
    const expanded = []; let generated = 0, maxFrontier = 0;
    const sk = key(start[0], start[1]), goalK = key(goal[0], goal[1]);
    const done = (keys, extra = {}) => ({ path: keys ? keys.map(cellOf) : null, moves: keys ? keys.length - 1 : Infinity, expanded, maxFrontier, generated, ...extra });
    if (algo === "dls" || algo === "ids") {
      // depth-limited search, tree-like; a state is re-expanded only if reached at a smaller depth (keeps the search bounded on a grid), so bestDepth ends as the true distance of every cell within ℓ.
      // cutoff: some cell at depth ℓ has an unreached neighbor, i.e. the map goes on beyond the limit. Without a cutoff the search has covered everything reachable. ids repeats with growing limit
      const limits = algo === "ids" ? Array.from({ length: limit }, (_, i) => i + 1) : [limit];
      const marks = []; let cutoff = false;
      for (const L of limits) {
        marks.push({ at: expanded.length, L });
        const stack = [{ k: sk, depth: 0, parentK: null }];
        const bestDepth = new Map(), par = new Map();
        cutoff = false;
        while (stack.length) {
          maxFrontier = Math.max(maxFrontier, stack.length);
          const { k, depth, parentK } = stack.pop();
          if (bestDepth.has(k) && bestDepth.get(k) <= depth) continue;
          bestDepth.set(k, depth); par.set(k, parentK); expanded.push(cellOf(k));
          if (k === goalK) return done(chain(par, k), { iterations: L, marks, cutoff: false });
          if (depth >= L) continue;
          for (const nk of neighbors(g, k)) { if (bestDepth.has(nk) && bestDepth.get(nk) <= depth + 1) continue; generated++; stack.push({ k: nk, depth: depth + 1, parentK: k }); }
        }
        for (const [k, d] of bestDepth) if (d >= L && neighbors(g, k).some((nk) => !bestDepth.has(nk))) { cutoff = true; break; }
        if (!cutoff) break;
      }
      return done(null, { marks, cutoff, iterations: marks.length ? marks[marks.length - 1].L : 0 });
    }
    if (algo === "bfs" || algo === "dfs") {
      const depth = new Map([[sk, 0]]), events = [];
      if (sk === goalK) return done([sk], { events, depth });
      const parent = new Map([[sk, null]]), frontier = [sk]; let head = 0;
      while (head < frontier.length) {
        maxFrontier = Math.max(maxFrontier, frontier.length - head);
        const k = algo === "bfs" ? frontier[head++] : frontier.pop();   // FIFO queue or LIFO stack
        expanded.push(cellOf(k)); const added = []; events.push(added);
        if (algo === "dfs" && k === goalK) return done(chain(parent, k), { events, depth, parent });
        for (const nk of neighbors(g, k)) {
          if (parent.has(nk)) continue;
          parent.set(nk, k); depth.set(nk, depth.get(k) + 1); generated++; added.push(nk);
          if (algo === "bfs" && nk === goalK) return done(chain(parent, nk), { events, depth, parent });   // early goal test
          frontier.push(nk);
        }
      }
      return done(null, { events, depth, parent });
    }
    // tree-like search: no reached table. "-path" skips a child already on the node's own path; "-tree" checks nothing
    const [order, mode] = algo.split("-");
    const onPath = (node, k) => { for (let n = node; n; n = n.parent) if (n.k === k) return true; return false; };
    const frontier = [{ k: sk, parent: null }]; let head = 0;
    while (head < frontier.length) {
      if (expanded.length >= cap) return done(null, { gaveUp: true });
      maxFrontier = Math.max(maxFrontier, frontier.length - head);
      const node = order === "bfs" ? frontier[head++] : frontier.pop();
      expanded.push(cellOf(node.k));
      if (node.k === goalK) { const p = []; for (let n = node; n; n = n.parent) p.push(n.k); return done(p.reverse()); }
      for (const nk of neighbors(g, node.k)) { if (mode === "path" && onPath(node, nk)) continue; generated++; frontier.push({ k: nk, parent: node }); }
    }
    return done(null);
  }

  /* ---------- animation helpers ---------- */
  /* linear, cancelable animation: fn(t) for t from 0 to 1 on every frame; fn returning false stops it. Resolves true when it ran to the end */
  function frames(ms, fn) {
    return new Promise((resolve) => {
      const t0 = performance.now();
      const f = (now) => { const t = clamp((now - t0) / Math.max(1, ms), 0, 1); if (fn(t) === false) return resolve(false); if (t < 1) requestAnimationFrame(f); else resolve(true); };
      requestAnimationFrame(f);
    });
  }
  /* count a number up in an element (strings are shown as they are) */
  function countUp(el, to, ms = 600, from = 0) {
    if (typeof to !== "number" || !isFinite(to)) { el.textContent = to; return Promise.resolve(); }
    return tween(ms, (t) => (el.textContent = fmt(from + (to - from) * t, 0)));
  }
  const isDark = () => { const a = document.documentElement.getAttribute("data-theme"); return a === "dark" || (a !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); };
  const onTheme = (fn) => new MutationObserver(fn).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  /* lay a row of controls out horizontally, so the map below can use the full width */
  const ctlRow = (...ctls) => { ctls.filter(Boolean).forEach((c) => { if (!c.style.flex) c.style.flex = "1 1 165px"; }); return h("div", { class: "controls", style: "flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:.6rem 1rem" }, ...ctls); };
  /* fill a select control with new options (maps have different named places) */
  function setOptions(ctl, names, value) { const sel = ctl.querySelector("select"); sel.innerHTML = ""; names.forEach((n) => sel.append(h("option", { value: n }, n))); sel.value = value; }

  /* ---------- colors: every map, tree, queue and legend uses the same CSS variables, so both themes match ---------- */
  const C = { exp: "var(--lagoon)", exp2: "var(--lagoon-2)", fr: "var(--sand-2)", cur: "var(--coral)", path: "var(--mint-2)", nb: "var(--mint-2)", cut: "var(--muted)" };
  const legendOf = (items) => h("div", { class: "legend" }, ...items.map(([col, txt, round]) => h("span", {}, h("i", { style: `background:${col}` + (round ? ";border-radius:50%" : "") }), txt)));

  /* ---------- views: window.Lab3D (lab3d.js) draws every map and every search tree; cssColor resolves "var(--x)" for the lab's own 2-D canvases ---------- */
  const cssColor = (col) => (col && col.startsWith("var(") ? getComputedStyle(document.documentElement).getPropertyValue(col.slice(4, -1)).trim() : col);

  steps.push({

  /* iterative deepening on a mini map as in the textbook: depth-limited DFS that skips cells already on its own branch, restarted with ℓ = 0, 1, 2, …
     Tree nodes are tree nodes, not states: the same cell can appear in several branches and again in every iteration */
  const IDS_CODE = [
    "for limit in 0, 1, 2, ...:",
    "    result = depth_limited(start, limit)",
    "    if result is not cutoff: return result",
    "def depth_limited(node, limit):",
    "    if node == goal: return path(node)",
    "    if limit == 0: return cutoff",
    "    for child in expand(node):",
    "        if child not on the path to node:",
    "            result = depth_limited(child, limit - 1)",
    "            if result is a path: return result",
  ];
  function idsScene(mapId) {
    return () => {
      const m = miniMap(mapId), nm = (k) => m.label.get(k), mv = miniView(m, 360), tv = Lab3D.tree({ height: 400 }), frames = [];
      for (let L = 0; L <= 20; L++) {
        const nodes = [{ id: 0, parent: null, k: m.s, kind: "start" }], cut = new Set(), seen = new Set([m.s]);
        let nid = 1;
        const snap = (line, msg, cur, branch, extra = {}) => frames.push({ line, msg, L, nodes: nodes.map((x) => ({ ...x })), cur, branch: branch.slice(), cut: new Set(cut), seen: new Set(seen), ...extra });
        snap([0, 1], `Iteration ℓ = ${L}: start again from S with an empty tree.`, 0, [m.s], { ms: 1300 });
        const dls = (node, depth, branch) => {
          snap(4, `Visit <b>${nm(node.k)}</b> at depth ${depth}.`, node.id, branch, { ms: 600 });
          if (node.k === m.t) return branch;
          if (depth === L) { node.kind = "cutoff"; cut.add(node.k); snap(5, `Depth ${depth} = ℓ: cut off.`, node.id, branch, { ms: 450 }); return null; }
          for (const k of neighbors(m.g, node.k)) {
            if (branch.includes(k)) continue;
            const child = { id: nid++, parent: node.id, k, kind: "frontier" }; nodes.push(child); seen.add(k);
            const r = dls(child, depth + 1, [...branch, k]); if (r) return r;
            if (child.kind !== "cutoff") child.kind = "expanded";
          }
          return null;
        };
        const path = dls(nodes[0], 0, [m.s]);
        if (path) { snap([2, 4], `G found at depth ${L}: the shortest path, ${L} moves, keeping only one branch in memory.`, null, path, { path, ms: 3500 }); break; }
      }
      return {
        vis: [mv.el, tv.el], frames,
        render(f) {

            lift: (r, c) => (br.has(key(r, c)) && !done ? 0.4 : 0),
            path: f.branch.map(cellOf), pathColor: done ? C.path : C.cur,
            start: { r: cellOf(m.s)[0], c: cellOf(m.s)[1], label: "S" }, goal: { r: cellOf(m.t)[0], c: cellOf(m.t)[1], label: "G" },
            labels: [...m.label].filter(([k]) => k !== m.s && k !== m.t).map(([k, text]) => ({ r: cellOf(k)[0], c: cellOf(k)[1], text })),
          });
          const onPath = done ? new Set(f.nodes.filter((x) => done.has(x.k)).map((x) => x.id)) : null;
          tv.update({ nodes: f.nodes.map((x) => ({ id: x.id, parent: x.parent, label: nm(x.k), kind: onPath && onPath.has(x.id) && f.branch.includes(x.k) ? (x.k === m.t ? "goal" : "path") : x.id === f.cur ? "current" : x.kind })), focus: f.cur });
        },
        destroy() { mv.destroy(); tv.destroy(); },
      };
    };
  }
  steps.push({
    id: "dfs", title: "Depth-first search and iterative deepening", time: 14,
    theory: `<h3>Newest first: dive, then back up</h3>
      <p>DFS takes the cell added last, so it dives down one branch (coral) to a dead end, then backs up to the newest cell still on the stack. It keeps the <b>first</b> path it finds, not the shortest. <b>Iterative deepening</b> runs DFS with a depth limit ℓ = 0, 1, 2, … and finds the shortest path with DFS's small memory, at the price of repeating the shallow levels.</p>`,
    ask: `<div class='a'>Opening animation, "Long way round": DFS takes Right first, runs round the long corridor into a dead end, backs up and returns a 14-move path after 19 expansions where BFS needs 4 moves. The Iterative deepening tab on the same map finds the 4 moves at ℓ = 4.</div>
      <div class='a'>The campus numbers are correct for graph-search DFS (a cell is reached when generated, neighbors pushed Up, Down, Left, Right, so Right is popped first): Library to Cafeteria 98 moves, 341 expansions, the stack peaks at 131 cells and 117 are still on it when the Cafeteria is popped; BFS 28 moves, 283 expansions. An independent implementation gives the same numbers. Why 98 against 28: DFS keeps the first branch that happens to reach the Cafeteria; the 117 cells on the stack are side branches it passed and never needed. Marking cells reached only when popped gives a different DFS (108 moves, 402 expansions): same lesson.</div>
      <div class='a'>Maze, Entrance to Exit: DFS 109 expansions against BFS 156, same 108 moves (one path); Entrance to Back door DFS 269 against 52. Iterative deepening, Library to Cafeteria: 18,873 expansions against BFS's 283. Gate closed: iterative deepening up to ℓ = 30 is cut off; up to ℓ = 80 it stops at ℓ = 42 without a cut-off, which proves there is no path (59,249 expansions).</div>`,

            { label: "DFS wins in the maze", note: "One path only: DFS follows one corridor at a time and expands fewer cells.", run: async () => { await S.show({ map: "maze", start: "Entrance", goal: "Exit", algo: "bfs" }, 3000); await sleep(1200); await S.show({ algo: "dfs" }, 3000); } },

  /* ---------- "You are the search": the student plays BFS and then DFS on the Mini-map. A round is the list of correct clicks, taken from trace():
     take a cell out of the frontier, then add its new neighbors in the order Up, Down, Left, Right ---------- */
  const HAND_QS = [
    { id: "Q1 shorter path", q: "Which search returned the shorter path from S to G?", options: ["BFS", "DFS", "Both the same"], answer: "BFS", why: "BFS went down the left side in 6 moves; DFS went round the right side in 10." },
    { id: "Q2 more cells taken out", q: "Which search took more cells out of the frontier before it stopped?", options: ["BFS", "DFS", "Both the same"], answer: "DFS", why: "BFS stopped after 10 steps (when it added G), DFS after 14 (when it took G out)." },
    { id: "Q3 E in the stack", q: "In the DFS round, E entered the stack in the first step and was still there at the end. Why?", options: ["E was added first, and DFS takes the cell added last", "E is a dead end", "E had already been reached", "The stack was full"], answer: "E was added first, and DFS takes the cell added last", why: "A stack is last in, first out: E sat at the bottom while DFS kept following the newest cell." },
  ];
  const HAND_MAX = 9;   // 3 points per round (in proportion to the correct clicks), 1 per question
  function handRound(m, algo) {
    const tr = trace(m, algo), acts = [];
    tr.rows.forEach((r, row) => { acts.push({ type: "take", k: r.pop, row }); r.added.forEach((k) => acts.push({ type: "add", k, row, from: r.pop })); });
    return { algo, tr, acts };
  }
  /* the board after the first p correct clicks of a round */
  function handView(m, R, p) {
    const fr = [m.s], reached = new Set([m.s]), taken = new Set(); let cur = null, fresh = [], row = -1;
    for (let j = 0; j < p; j++) {
      const a = R.acts[j];
      if (a.type === "take") { if (R.algo === "bfs") fr.shift(); else fr.pop(); taken.add(a.k); cur = a.k; fresh = []; row = a.row; }
      else { fr.push(a.k); reached.add(a.k); fresh.push(a.k); }
    }
    const log = R.tr.rows.slice(0, row + 1).map((x, i) => (i < row ? x : { pop: x.pop, added: fresh.slice(), frontier: fr.slice() }));
    const done = p >= R.acts.length;
    return { algo: R.algo, fr, reached, taken, cur, fresh: new Set(fresh), log, done, path: done && R.tr.path ? R.tr.path : null };
  }
  /* score of a game state {pos: [clicks done in BFS, in DFS], mistakes: [..], answers: {question id: option}} */
  function handScore(s, rounds) {
    const tot = rounds.map((R) => R.acts.length), frac = [0, 1].map((i) => Math.min(1, s.pos[i] / tot[i]));
    const right = HAND_QS.filter((q) => s.answers[q.id] === q.answer).length, miss = s.mistakes[0] + s.mistakes[1];
    const score = Math.max(0, Math.min(HAND_MAX, Math.round((3 * frac[0] + 3 * frac[1] + right - 0.25 * miss) * 100) / 100));
    const answers = { "BFS finished": frac[0] === 1, "BFS correct clicks": s.pos[0], "BFS mistakes": s.mistakes[0], "DFS finished": frac[1] === 1, "DFS correct clicks": s.pos[1], "DFS mistakes": s.mistakes[1] };
    for (const q of HAND_QS) answers[q.id] = s.answers[q.id] || "no answer";
    answers["Questions right"] = right;
    const part = (i, n) => (frac[i] === 1 ? `${n} finished` : `${n} ${s.pos[i]} of ${tot[i]} clicks`) + ` (${s.mistakes[i]} mistake${s.mistakes[i] === 1 ? "" : "s"})`;
    return { score, max: HAND_MAX, answers, summary: `${part(0, "BFS")}, ${part(1, "DFS")}, ${right} of ${HAND_QS.length} questions right.` };
  }
  /* the clickable mini-map, the queue or stack and the step log, shared by the game and the opening animation.
     show(v): v = {algo, fr: keys in frontier order, taken: Set, cur, fresh: Set, log: rows, done, path?, pathN?, hint?} */

      const setCtl = (ctl, v) => { if (ctl.get() !== String(v)) { ctl.set(v); pulse(ctl); } };
      const text = (s, x, y, o = {}) => { ctx.font = `${o.w || 700} ${o.size || 15}px Public Sans, sans-serif`; ctx.textAlign = o.align || "center"; ctx.textBaseline = "middle"; if (o.stroke) { ctx.lineWidth = 4; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = o.color || "#fff"; ctx.fillText(s, x, y); };
      const PS = Math.floor(Math.min(CW / PIX.W, CH / PIX.H)), PX0 = (CW - PS * PIX.W) / 2, PY0 = (CH - PS * PIX.H) / 2;
      const pix = (p, inset = 0) => ctx.fillRect(PX0 + (p % PIX.W) * PS + inset, PY0 + Math.floor(p / PIX.W) * PS + inset, PS - 2 * inset, PS - 2 * inset);
      const pixAt = (x, y) => { const c = Math.floor((x - PX0) / PS), r = Math.floor((y - PY0) / PS); return r >= 0 && c >= 0 && r < PIX.H && c < PIX.W ? r * PIX.W + c : null; };
      const pixRing = (p, col) => { ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(PX0 + (p % PIX.W) * PS + 1.5, PY0 + Math.floor(p / PIX.W) * PS + 1.5, PS - 3, PS - 3); };

      /* each tab: label, algo, story, ctls, compute(), E(), draw(i, dark), status(i) -> [kind, html], strip(i), metrics(i), click?(x, y), sync?(), ms, per? */
      const flood = {
        label: "Paint bucket", algo: "BFS", ms: 170, seed: 12 * PIX.W + 21, ctls: [],
        story: "<b>Oil spill area:</b> fill every connected oil pixel in rings from the click (1 pixel = 50 m × 50 m). <b>Click any pixel.</b>",
        compute() { this.R = floodFill(FLOOD_IMG, this.seed); },
        E() { return this.R.layers.length; },
        draw(i) {
          const R = this.R, COLS = ["#2a6496", "#7a9a52", "#211c1a", "#f4f4f4"];
          ctx.fillStyle = "#16324a"; ctx.fillRect(0, 0, CW, CH);
          for (let p = 0; p < FLOOD_IMG.length; p++) { ctx.fillStyle = COLS[FLOOD_IMG[p]]; pix(p); }
          ctx.fillStyle = "#ff7a59"; for (let d = 0; d < Math.min(i, R.layers.length); d++) for (const p of R.layers[d]) pix(p, 1);
          if (i < R.layers.length) { ctx.fillStyle = "#ffd43b"; for (const p of R.layers[i]) pix(p, 1); }

          text("1 pixel = 50 m × 50 m · click a pixel to fill from it", CW - PX0 - 8, CH - PY0 - 14, { align: "right", size: 13, w: 600, stroke: "rgba(0,0,0,.6)" });
        },
        name() { return FLOOD_NAMES[this.R.col]; },
        status(i) {
          const R = this.R, E = this.E(), nm = this.name();
          if (i < E) return ["note", i ? `Ring ${i}: the queue holds the ${R.layers[i].length} ${nm} pixels that are ${i} steps from the click. They leave from the front, and each adds its unfilled ${nm} neighbors to the back.` : `Ring 0: the queue holds the clicked ${nm} pixel.`];
          if (R.total === 1) return ["edge", `<b>A region of one pixel.</b> The ${nm} has no neighbor of its own color: BFS takes out the clicked pixel, adds nothing, and the queue is empty. Area: 0.0025 km².`];
          return ["info", `Filled <b>${fmt(R.total, 0)} ${nm} pixels = ${fmt(R.total * 0.0025, 2)} km²</b> in ${E} rings.` + (nm === "oil" ? " The two slicks do not touch, so the fill never crosses from one to the other: each has to be measured from its own pixel." : "")];
        },
        strip(i) { const R = this.R, sum = R.layers.slice(0, i).reduce((a, l) => a + l.length, 0); return row(i < this.E() ? `<b>Queue</b> (FIFO): ring ${i}, ${R.layers[i].length} pixels. Filled so far: ${fmt(sum, 0)}.` : `<b>Queue</b>: empty. Filled: ${fmt(R.total, 0)} pixels.`, []); },
        metrics(i) { const R = this.R, sum = R.layers.slice(0, i).reduce((a, l) => a + l.length, 0); return [metric("Pixels filled", fmt(sum, 0)), metric("Area", fmt(sum * 0.0025, 2) + " km²"), metric("Rings", Math.min(i, this.E())), metric("Largest queue", R.maxQueue)]; },
        click(x, y) { const p = pixAt(x, y); if (p === null) return false; this.seed = p; return "run"; },
      };

      const knight = {
        label: "Knight moves", algo: "BFS", ms: 110, from: sqOf("a1"), to: sqOf("h8"),
        story: "<b>Fewest knight moves:</b> the move rule generates the neighbors, so the board graph is never stored. <b>Click a square</b> to make it the target.",
        compute() { this.R = gBFS(this.from, this.to, knightMoves); },
        E() { return this.R.events.length; },
        draw(i, dark) {
          const R = this.R, s = 64, x0 = 70, y0 = 24, end = i >= this.E();
          const q = new Set(end ? [] : queueAt(R, i, this.from)), popped = new Set(R.events.slice(0, i).map((e) => e.pop)), dist = new Map([[this.from, 0]]);
          for (let j = 0; j < i; j++) for (const v of R.events[j].added) dist.set(v, R.dist.get(v));
          const path = end && R.path ? R.path : [], cur = !end && i > 0 ? R.events[i - 1].pop : null;
          ctx.fillStyle = dark ? "#1f2633" : "#ffffff"; ctx.fillRect(0, 0, CW, CH);
          for (let k = 0; k < 64; k++) {
            const r = Math.floor(k / 8), c = k % 8, x = x0 + c * s, y = y0 + r * s;
            ctx.fillStyle = (r + c) % 2 ? "#b58863" : "#f0d9b5"; ctx.fillRect(x, y, s, s);
            if (path.includes(k)) { ctx.fillStyle = "rgba(63,174,138,.85)"; ctx.fillRect(x, y, s, s); }
            else if (q.has(k)) { ctx.fillStyle = "rgba(245,185,66,.85)"; ctx.fillRect(x, y, s, s); }
            else if (popped.has(k)) { ctx.fillStyle = "rgba(91,124,250,.55)"; ctx.fillRect(x, y, s, s); }
            if (dist.has(k) && k !== this.from) text(String(dist.get(k)), x + s / 2, y + s / 2, { size: 22, color: "#1d2733" });
            if (k === cur) { ctx.strokeStyle = "#d9534f"; ctx.lineWidth = 4; ctx.strokeRect(x + 2, y + 2, s - 4, s - 4); }
          }
          for (let c = 0; c < 8; c++) { text("abcdefgh"[c], x0 + c * s + s / 2, y0 + 8 * s + 14, { size: 13, color: dark ? "#c9d2e3" : "#3d4a5f" }); text(String(8 - c), x0 - 16, y0 + c * s + s / 2, { size: 13, color: dark ? "#c9d2e3" : "#3d4a5f" }); }
          const mid = (k) => [x0 + (k % 8) * s + s / 2, y0 + Math.floor(k / 8) * s + s / 2];
          if (path.length > 1) { ctx.strokeStyle = "#1d6b54"; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.beginPath(); path.forEach((k, j) => { const [x, y] = mid(k); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); }
          const [tx, ty] = mid(this.to); ctx.strokeStyle = "#3fae8a"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(tx, ty, s * 0.4, 0, 7); ctx.stroke();
          const [kx, ky] = mid(this.from); text("♞", kx, ky + 2, { size: 44, color: "#1d2733", stroke: "#ffffff" });
          // squares by number of moves found so far: the BFS layers
          const hist = []; for (const d of dist.values()) hist[d] = (hist[d] || 0) + 1;
          const hx = 690, hw = 460, top = 70;
          text("Squares reached, by number of moves from the start", hx, 36, { align: "left", size: 16, color: dark ? "#e8ecf4" : "#243041" });
          for (let d = 0; d < 7; d++) {
            const n = hist[d] || 0, y = top + d * 62;
            text(`${d} move${d === 1 ? "" : "s"}`, hx, y + 18, { align: "left", size: 14, w: 600, color: dark ? "#c9d2e3" : "#3d4a5f" });
            ctx.fillStyle = dark ? "#2f3847" : "#e4e9f1"; ctx.fillRect(hx + 80, y + 6, hw - 120, 24);
            ctx.fillStyle = "#5b7cfa"; ctx.fillRect(hx + 80, y + 6, (hw - 120) * n / 21, 24);
            if (n) text(String(n), hx + 88 + (hw - 120) * n / 21, y + 18, { align: "left", size: 14, color: dark ? "#e8ecf4" : "#243041" });
          }
        },
        status(i) {
          const R = this.R, E = this.E(), nm = sqName;
          if (i < E && i > 0) { const e = R.events[i - 1]; return ["note", `Step ${i}: took out ${nm(e.pop)} (${R.dist.get(e.pop)} moves from ${nm(this.from)}) and added ${e.added.map(nm).join(", ") || "no new square"}.`]; }
          if (i < E) return ["note", `Step 0: the queue holds ${nm(this.from)}.`];
          if (this.from === this.to) return ["edge", `<b>Already there.</b> Start and target are the same square: the goal test succeeds before anything is taken out. 0 moves.`];
          const d = R.path.length - 1;
          return ["info", `Fewest moves: <b>${d}</b>, ${R.path.map(nm).join(" → ")}. BFS added ${nm(this.to)} while taking out a square ${d - 1} moves away, so no shorter route exists.`];
        },
        strip(i) { const end = i >= this.E(), q = end ? [] : queueAt(this.R, i, this.from), fresh = new Set(i > 0 ? this.R.events[i - 1].added : []); return row(`<b>Queue</b> (FIFO), front → back, ${q.length} squares, each with its number of moves.`, q.slice(0, 40).map((k, j) => chip(`${sqName(k)} · ${this.R.dist.get(k)}`, fresh.has(k), j === 0))); },
        metrics(i) { const R = this.R, end = i >= this.E(); return [metric("Moves", end ? (R.path ? R.path.length - 1 : "–") : "…", end ? "good" : ""), metric("Squares taken out", Math.min(i, this.E())), metric("Largest queue", Math.max(1, ...Array.from({ length: this.E() + 1 }, (_, k) => queueAt(R, k, this.from).length)))]; },
        click(x, y) { const c = Math.floor((x - 70) / 64), r = Math.floor((y - 24) / 64); if (r < 0 || c < 0 || r > 7 || c > 7) return false; this.to = r * 8 + c; this.sync(); return "run"; },
        sync() { setCtl(this.fromSel, sqName(this.from)); setCtl(this.toSel, sqName(this.to)); },
      };
      knight.fromSel = sel("Knight starts on", SQUARES, "a1", (v) => { knight.from = sqOf(v); });
      knight.toSel = sel("Target square", SQUARES, "h8", (v) => { knight.to = sqOf(v); });
      knight.ctls = [knight.fromSel, knight.toSel];

      const ladder = {
        label: "Word ladder", algo: "BFS", ms: 180, from: "COLD", to: "WARM",
        story: "<b>Word ladder:</b> change one letter at a time, every step a real word (51 words); BFS gives the fewest changes.",
        compute() {
          const next = (w) => LADDER.get(w);
          this.R = gBFS(this.from, this.to, next);
          const full = gBFS(this.from, null, next).dist, maxD = Math.max(...full.values()), cols = Array.from({ length: maxD + 2 }, () => []);
          for (const w of WORDS) cols[full.has(w) ? full.get(w) : maxD + 1].push(w);
          const cw = (CW - 40) / cols.length; this.pos = new Map(); this.cols = cols; this.cw = cw;
          cols.forEach((list, d) => list.forEach((w, j) => this.pos.set(w, [20 + cw * (d + 0.5), 70 + (j + 0.5) * (470 / Math.max(list.length, 1))])));
        },
        E() { return this.R.events.length; },
        draw(i, dark) {
          const R = this.R, end = i >= this.E(), q = new Set(end ? [] : queueAt(R, i, this.from)), popped = new Set(R.events.slice(0, i).map((e) => e.pop));
          const reached = new Set([this.from]); for (let j = 0; j < i; j++) R.events[j].added.forEach((w) => reached.add(w));
          const path = end && R.path ? R.path : [], cur = !end && i > 0 ? R.events[i - 1].pop : null, P = (w) => this.pos.get(w);
          ctx.fillStyle = dark ? "#1f2633" : "#ffffff"; ctx.fillRect(0, 0, CW, CH);
          this.cols.forEach((list, d) => text(d === this.cols.length - 1 ? "not reachable" : d === 0 ? "start" : `${d} change${d === 1 ? "" : "s"}`, 20 + this.cw * (d + 0.5), 30, { size: 13, w: 600, color: dark ? "#93a0b8" : "#6f7c90" }));
          ctx.lineWidth = 1; ctx.strokeStyle = dark ? "rgba(214,222,238,.13)" : "rgba(52,62,82,.12)"; ctx.beginPath();
          for (const w of WORDS) for (const x of LADDER.get(w)) if (w < x) { const [a, b] = P(w), [c, d] = P(x); ctx.moveTo(a, b); ctx.lineTo(c, d); }
          ctx.stroke();
          ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(91,124,250,.7)"; ctx.beginPath();
          for (const w of reached) { const p = R.parent.get(w); if (p) { const [a, b] = P(p), [c, d] = P(w); ctx.moveTo(a, b); ctx.lineTo(c, d); } }
          ctx.stroke();
          if (path.length > 1) { ctx.lineWidth = 6; ctx.strokeStyle = "#3fae8a"; ctx.beginPath(); path.forEach((w, j) => { const [a, b] = P(w); j ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.stroke(); }
          const bw = Math.min(70, this.cw - 8), bh = 26;
          for (const w of WORDS) {
            const [x, y] = P(w), on = path.includes(w);
            ctx.fillStyle = on ? "#3fae8a" : q.has(w) ? "#f5b942" : popped.has(w) ? "rgba(91,124,250,.85)" : dark ? "#2a3343" : "#f7f9fc";
            ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x - bw / 2, y - bh / 2, bw, bh, 6); else ctx.rect(x - bw / 2, y - bh / 2, bw, bh); ctx.fill();
            const ring = w === cur ? "#d9534f" : w === this.from ? "#ee8a84" : w === this.to ? "#3fae8a" : null;
            ctx.lineWidth = ring ? 3.5 : 1; ctx.strokeStyle = ring || (dark ? "#4a5568" : "#c3cad6"); ctx.stroke();
            text(w, x, y + 1, { size: 14, color: on || popped.has(w) ? "#fff" : q.has(w) ? "#1d2733" : dark ? (reached.has(w) ? "#e8ecf4" : "#7d879a") : reached.has(w) ? "#243041" : "#9aa3b2" });
          }
        },
        status(i) {
          const R = this.R, E = this.E();
          if (i < E && i > 0) { const e = R.events[i - 1], d = R.dist.get(e.pop); return ["note", `Step ${i}: took out ${e.pop} (${d} change${d === 1 ? "" : "s"} from ${this.from}) and added ${e.added.join(", ") || "no new word"}.`]; }
          if (i < E) return ["note", `Step 0: the queue holds ${this.from}.`];
          if (this.from === this.to) return ["edge", "<b>Same word.</b> The goal test succeeds at once: 0 changes."];
          if (!R.path) return ["edge", `<b>No ladder.</b> The queue ran empty after ${E} steps: BFS reached all ${R.dist.size} words connected to ${this.from}, and ${this.to} is not among them.` + (LADDER.get(this.to).length ? "" : ` ${this.to} differs from every other word in two letters or more.`)];
          return ["info", `Shortest ladder: <b>${R.path.join(" → ")}</b>, ${R.path.length - 1} change${R.path.length === 2 ? "" : "s"}, after ${E} words taken out.`];
        },
        strip(i) { const end = i >= this.E(), q = end ? [] : queueAt(this.R, i, this.from), fresh = new Set(i > 0 ? this.R.events[i - 1].added : []); return row(`<b>Queue</b> (FIFO), front → back, ${q.length} words, each with its number of changes.`, q.map((w, j) => chip(`${w} · ${this.R.dist.get(w)}`, fresh.has(w), j === 0))); },
        metrics(i) { const R = this.R, end = i >= this.E(); return [metric("Changes", end ? (R.path ? R.path.length - 1 : "no ladder") : "…", end ? (R.path ? "good" : "bad") : ""), metric("Words taken out", Math.min(i, this.E())), metric("Words reached", end ? R.dist.size : "…")]; },
        click(x, y) { for (const [w, [a, b]] of this.pos) if (Math.abs(x - a) < 36 && Math.abs(y - b) < 14) { this.to = w; this.sync(); return "run"; } return false; },
        sync() { setCtl(this.fromSel, this.from); setCtl(this.toSel, this.to); },
      };
      const sortedWords = WORDS.slice().sort();
      ladder.fromSel = sel("Start word", sortedWords, "COLD", (v) => { ladder.from = v; });
      ladder.toSel = sel("Target word", sortedWords, "WARM", (v) => { ladder.to = v; });
      ladder.ctls = [ladder.fromSel, ladder.toSel];

      const PALETTE = ["#ff7a59", "#5b7cfa", "#3fae8a", "#f06292", "#9c6ade", "#ffb74d", "#26c6da", "#d4e157"];
      const objects = {
        label: "Count objects", algo: "DFS", ms: 28, per: 3, preset: "islands", edited: false,
        story: "<b>Count objects:</b> pixels that touch belong to one object; a scan starts DFS at each unclaimed pixel. <b>Click pixels</b> to draw or erase.",
        load(id) { this.preset = id; this.px = objImage(id); this.edited = false; this.presetCount = countObjects(this.px).count; },
        compute() { this.R = countObjects(this.px); },
        E() { return this.R.events.length; },
        replay(i) {
          const lab = new Int16Array(this.px.length), stack = [], starts = []; let last = null;
          for (let j = 0; j < i; j++) { const e = this.R.events[j]; last = e; if (e.t === "new") { lab[e.p] = e.n; stack.push(e.p); starts.push(e); } else { stack.pop(); for (const q of e.added) { lab[q] = e.n; stack.push(q); } } }
          return { lab, stack, starts, last };
        },
        draw(i) {
          const bg = this.preset === "panels" ? ["#8d6e63", "#1f2a44"] : ["#2a6496", "#d9c48c"], { lab, stack, starts, last } = this.replay(i);
          ctx.fillStyle = "#16324a"; ctx.fillRect(0, 0, CW, CH);
          for (let p = 0; p < this.px.length; p++) { ctx.fillStyle = lab[p] ? PALETTE[(lab[p] - 1) % PALETTE.length] : bg[this.px[p]]; pix(p, lab[p] ? 1 : 0); }
          ctx.fillStyle = "#ffd43b"; for (const p of stack) pix(p, 3);
          if (last && i < this.E()) pixRing(last.p, "#d9534f");
          for (const e of starts) text(String(e.n), PX0 + (e.p % PIX.W) * PS + PS / 2, PY0 + Math.floor(e.p / PIX.W) * PS + PS / 2 + 1, { size: 15, stroke: "rgba(0,0,0,.75)" });
          text("click a pixel to draw or erase", CW - PX0 - 8, CH - PY0 - 14, { align: "right", size: 13, w: 600, stroke: "rgba(0,0,0,.6)" });
        },
        status(i) {
          const R = this.R, E = this.E(), { last, stack } = this.replay(i), rc = (p) => `row ${Math.floor(p / PIX.W)}, column ${p % PIX.W}`;
          if (i < E && last) return ["note", last.t === "new" ? `Object ${last.n} starts at ${rc(last.p)}: the scan found an object pixel that no object has claimed yet.` : `Object ${last.n}: took ${rc(last.p)} off the top of the stack and pushed ${last.added.length} new neighbor${last.added.length === 1 ? "" : "s"}. Stack: ${stack.length}.`];
          if (i < E) return ["note", "Step 0: the scan starts at the top-left pixel."];
          if (!R.count) return ["edge", `<b>No objects.</b> The scan looked at all ${fmt(PIX.W * PIX.H, 0)} pixels and never found an object pixel, so DFS never started: the count is 0.`];
          return ["info", `<b>${R.count} object${R.count === 1 ? "" : "s"}</b> (${fmt(R.pixels, 0)} pixels). Every object pixel was pushed and popped once; the stack never held more than ${R.maxStack} pixels.` + (this.preset === "panels" && !this.edited ? " The roof has 18 panels, but three pairs touch, so DFS counts 15 objects." : "")];
        },
        strip(i) { const { stack, starts } = this.replay(i); return row(`<b>Stack</b> (LIFO), top on the right: ${stack.length} pixels. Objects found so far: ${starts.length}.`, []); },
        metrics(i) { const R = this.R, end = i >= this.E(); return [metric("Objects", end ? R.count : this.replay(i).starts.length, end ? "good" : ""), metric("Object pixels", fmt(R.pixels, 0)), metric("Largest stack", R.maxStack)]; },
        click(x, y) { const p = pixAt(x, y); if (p === null) return false; this.px[p] = this.px[p] ? 0 : 1; this.edited = true; return "edit"; },
        sync() { setCtl(this.presetSel, this.preset); },
      };
      objects.load("islands");
      objects.presetSel = sel("Image", Object.entries(OBJ_PRESETS).map(([value, label]) => ({ value, label })), "islands", (v) => objects.load(v));
      objects.ctls = [objects.presetSel];

      const folders = {
        label: "Folder sizes", algo: "DFS", ms: 260, root: "Home",
        story: "<b>Folder sizes:</b> a folder's total is known only when all its subfolders are done, the order in which DFS finishes them.",
        compute() { this.R = folderDFS(findFolder(FOLDERS, this.root)); },
        E() { return this.R.events.length; },
        draw(i, dark) {
          const R = this.R, open = new Set(), done = new Map(), cur = i > 0 && i <= this.E() ? R.events[i - 1] : null;
          for (let j = 0; j < i; j++) { const e = R.events[j]; if (e.t === "enter") open.add(e.f[0]); else { open.delete(e.f[0]); done.set(e.f[0], e.total); } }
          ctx.fillStyle = dark ? "#1f2633" : "#ffffff"; ctx.fillRect(0, 0, CW, CH);
          const rh = Math.min(32, 500 / R.rows.length), ink = dark ? "#e8ecf4" : "#243041", muted = dark ? "#93a0b8" : "#6f7c90";
          text("Folder", 40, 22, { align: "left", size: 13, w: 700, color: muted }); text("Own files", 520, 22, { align: "right", size: 13, w: 700, color: muted }); text("Total (known when all subfolders are done)", 620, 22, { align: "left", size: 13, w: 700, color: muted });
          R.rows.forEach(({ f, depth }, j) => {
            const y = 40 + j * rh, name = f[0], x = 40 + depth * 30;
            if (open.has(name)) { ctx.fillStyle = "rgba(245,185,66,.55)"; ctx.fillRect(20, y, CW - 40, rh - 3); }
            else if (done.has(name)) { ctx.fillStyle = dark ? "rgba(91,124,250,.22)" : "rgba(91,124,250,.12)"; ctx.fillRect(20, y, CW - 40, rh - 3); }
            if (cur && cur.f[0] === name) { ctx.strokeStyle = "#d9534f"; ctx.lineWidth = 3; ctx.strokeRect(21.5, y + 1.5, CW - 43, rh - 6); }
            ctx.fillStyle = "#f5b942"; ctx.fillRect(x, y + rh / 2 - 7, 20, 13); ctx.fillRect(x, y + rh / 2 - 10, 9, 4);
            text(name, x + 28, y + rh / 2, { align: "left", size: 15, w: 600, color: ink });
            text(fmtMB(f[1]), 520, y + rh / 2, { align: "right", size: 14, w: 500, color: muted });

    let ep = episode(0), epN = 0, epT0 = null, t0 = null, raf = 0, sizeKey = "", over = null;

    function draw(t, tau) {
      const Wp = canvas.width, Hp = canvas.height, dpr = Wp / Math.max(1, canvas.clientWidth || Wp);
      const yaw = -0.18 + 0.48 * Math.sin(t * 0.07), pitch = 0.68 + 0.05 * Math.sin(t * 0.11 + 1);
      camX = D * Math.cos(pitch) * Math.sin(yaw); camY = D * Math.sin(pitch); camZ = D * Math.cos(pitch) * Math.cos(yaw);
      fx = -camX / D; fy = -camY / D; fz = -camZ / D;
      const rl = Math.hypot(fx, fz); rx = -fz / rl; rz = fx / rl;
      ux = -rz * fy; uy = rz * fx - rx * fz; uz = rx * fy;
      F = Math.min(Wp * 0.61, Hp * 1.45); cx = Wp * 0.67; cy = Hp * 0.56;
      const fade = 1 - clamp((tau - ep.fadeAt) / 1.2, 0, 1), found = tau >= ep.tS;
      const dim = 1 - 0.45 * clamp((tau - ep.tS) / 0.8, 0, 1), rgb = ep.rgb.join(), spr = sprite(ep.rgb), px = 1 / F * D;

      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
      ctx.fillStyle = "#0b1220"; ctx.fillRect(0, 0, Wp, Hp);
      /* ground: a slab with a fine grid */
      for (let r = 0, i = 0; r <= H; r++) for (let c = 0; c <= W; c++, i++) { P(X(c), 0, Z(r)); GX[i] = sx; GY[i] = sy; }
      const V = (r, c) => r * (W + 1) + c;
      P(0, 0, 0);
      const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, F * 0.75);
      halo.addColorStop(0, "rgba(40,70,140,0.35)"); halo.addColorStop(1, "rgba(40,70,140,0)");
      ctx.fillStyle = halo; ctx.fillRect(0, 0, Wp, Hp);
      ctx.beginPath(); for (const i of [V(0, 0), V(0, W), V(H, W), V(H, 0)]) ctx.lineTo(GX[i], GY[i]); ctx.closePath();
      ctx.fillStyle = "#111d35"; ctx.fill();
      ctx.beginPath();
      for (let r = 0; r <= H; r++) { ctx.moveTo(GX[V(r, 0)], GY[V(r, 0)]); ctx.lineTo(GX[V(r, W)], GY[V(r, W)]); }
      for (let c = 0; c <= W; c++) { ctx.moveTo(GX[V(0, c)], GY[V(0, c)]); ctx.lineTo(GX[V(H, c)], GY[V(H, c)]); }
      ctx.lineWidth = dpr; ctx.strokeStyle = "rgba(120,160,240,0.14)"; ctx.stroke();

      /* the search as light on the ground: reached area, frontier, freshly reached cells */
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath(); for (const q of ep.cells) if (q.t <= tau && q.te <= tau) cellQuad(q.r, q.c);
      ctx.fillStyle = `rgba(${rgb},${0.24 * fade * dim})`; ctx.fill();
      ctx.beginPath(); for (const q of ep.cells) if (q.t <= tau && q.te > tau) cellQuad(q.r, q.c);
      ctx.fillStyle = `rgba(${rgb},${0.5 * fade * dim})`; ctx.fill();
      ctx.beginPath(); for (const q of ep.cells) if (q.t <= tau && tau - q.t < 0.35) cellQuad(q.r, q.c);
      ctx.fillStyle = `rgba(255,255,255,${0.25 * fade})`; ctx.fill();
      /* the path, revealed from the start once the goal is found */
      if (found) {
        const rev = clamp((tau - ep.tS) / ep.tR, 0, 1) * ep.L;
        ctx.beginPath();
        for (let i = 0; i <= Math.floor(rev); i++) { P(ep.path[i][0], 0.05, ep.path[i][1]); ctx.lineTo(sx, sy); }
        const head = along(ep, rev); P(head[0], 0.05, head[1]); ctx.lineTo(sx, sy);
        ctx.lineJoin = "round"; ctx.lineCap = "round";
        ctx.lineWidth = 0.55 / px; ctx.strokeStyle = `rgba(${rgb},${0.35 * fade})`; ctx.stroke();
        ctx.lineWidth = 0.14 / px; ctx.strokeStyle = `rgba(${ep.core.join()},${0.9 * fade})`; ctx.stroke();
        if (rev < ep.L) glow(spr, head[0], 0.1, head[1], 1.1, fade);
        else {
          const speed = Math.max(14, ep.L / 1.4), p = ((tau - ep.tS - ep.tR) * speed) % (ep.L + 14);
          for (let k = 0; k < 6; k++) { const s = p - k * 0.7; if (s >= 0 && s <= ep.L) { const q = along(ep, s); glow(spr, q[0], 0.12, q[1], 0.95 - k * 0.12, (1 - k / 6) * fade); } }
        }
      }

      /* buildings and the robot, far to near */
      const rp = along(ep, smooth(clamp((tau - ep.t0D) / ep.tD, 0, 1)) * ep.L);
      robot.x = rp[0]; robot.z = rp[1];
      for (const it of items) it.d = (it.x - camX) * (it.x - camX) + (it.z - camZ) * (it.z - camZ);
      items.sort((a, b) => b.d - a.d);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.lineWidth = dpr;
      for (const it of items) {
        const fog = clamp((Math.sqrt(it.d + camY * camY) - D + 4) / 34, 0, 0.6);
        if (it.robot) { ctx.globalAlpha = fade; box(it.x, it.z, 0.24, 0.06, 0.48, NONE, mix(ep.core, [255, 255, 255], 0.3).map((v) => v * 0.8), 0, `rgba(255,255,255,0.9)`); ctx.globalAlpha = 1; }
        else box(it.x, it.z, 0.5, 0, it.h, it.n, it.h > 1 ? BUILDING : LOWWALL, fog, `rgba(150,185,255,${((it.h > 1 ? 0.5 : 0.28) * (1 - fog)).toFixed(3)})`, it.h > 1 ? it.seed : 0);
      }

      /* light: frontier glow, rising sparks, landmarks, the robot, drifting dust */
      ctx.globalCompositeOperation = "lighter";
      for (const q of ep.cells) {
        if (q.t > tau) continue;
        if (q.te > tau) glow(spr, q.x, 0.12, q.z, 0.9, 0.42 * fade * dim);
        const a = tau - q.t;
        if (a < 2.6) {
          const k = 1 - a / 2.6, w = Math.sin(a * 2.4 + q.h1 * 6.3) * 0.18;
          glow(spr, q.x + (q.h1 - 0.5) * 0.5 + w, 0.15 + a * (1.1 + q.h1 * 1.0), q.z + (q.h2 - 0.5) * 0.5, 0.3 + 0.2 * q.h2, k * k * fade);
          glow(spr, q.x - (q.h2 - 0.5) * 0.4, 0.1 + a * (1.8 + q.h2 * 1.4), q.z - (q.h1 - 0.5) * 0.4 - w, 0.16 + 0.1 * q.h1, k * 0.8 * fade);
        }
      }
      if (found && tau - ep.tS < 0.9) { const g2 = g.pois[ep.to], k = (tau - ep.tS) / 0.9; glow(sprite(GOAL), X(g2[1]) + 0.5, 0.3, Z(g2[0]) + 0.5, 1 + 3 * k, (1 - k) * fade); }
      for (const p of pois) {
        const isS = p.name === ep.from, isG = p.name === ep.to, col = isS ? ep.rgb : isG ? GOAL : POI, a = isS || isG ? 1 : 0.45;
        P(p.x, 0.02, p.z); const bx = sx, by = sy; P(p.x, 1.5, p.z);
        const beam = ctx.createLinearGradient(bx, by, sx, sy);
        beam.addColorStop(0, `rgba(${col.join()},${0.7 * a})`); beam.addColorStop(1, `rgba(${col.join()},0)`);
        ctx.globalAlpha = 1; ctx.lineWidth = 2 * dpr; ctx.strokeStyle = beam; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(sx, sy); ctx.stroke();
        glow(sprite(col), p.x, 0.05, p.z, 0.9, 0.55 * a);
        if (isG) {
          const rr = 0.45 + 0.3 * ((t * 0.9) % 1);
          ctx.beginPath(); for (let k = 0; k <= 24; k++) { P(p.x + rr * Math.cos(k * Math.PI / 12), 0.03, p.z + rr * Math.sin(k * Math.PI / 12)); ctx.lineTo(sx, sy); }
          ctx.globalAlpha = 1; ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = `rgba(255,236,200,${0.8 * (1 - ((t * 0.9) % 1))})`; ctx.stroke();
        }
      }
      glow(spr, rp[0], 0.3, rp[1], 1.8, 0.75 * fade);
      glow(sprite([255, 255, 255]), rp[0], 0.55, rp[1], 0.35, fade);
      const nd = clamp(Math.round(Wp * Hp / 15000), 30, 170);
      const dust = sprite(DUST);
      for (let i = 0; i < nd; i++) {
        const h1 = hash(3 * i + 7), h2 = hash(3 * i + 8), h3 = hash(3 * i + 9), f = (t * (0.03 + 0.05 * h3) + h1) % 1;
        glow(dust, (h2 - 0.5) * 46 + Math.sin(t * 0.2 + i) * 0.6, f * 7, (h3 - 0.5) * 28, 0.1 + 0.12 * h1, Math.sin(Math.PI * f) * 0.45);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

      /* landmark labels */
      ctx.font = `600 ${12 * dpr}px "Public Sans", system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.lineJoin = "round";
      for (const p of pois) {
        const isS = p.name === ep.from, isG = p.name === ep.to;
        P(p.x, 1.6, p.z);
        ctx.globalAlpha = smooth(clamp((sx / Wp - 0.4) / 0.08, 0, 1));   // labels under the title text would clash with it
        if (ctx.globalAlpha < 0.01) continue;
        ctx.lineWidth = 4 * dpr; ctx.strokeStyle = "rgba(8,13,26,0.85)"; ctx.strokeText(p.name, sx, sy - 4 * dpr);
        ctx.fillStyle = isS ? `rgb(${ep.core.join()})` : isG ? "rgb(255,240,214)" : "rgba(200,214,245,0.75)"; ctx.fillText(p.name, sx, sy - 4 * dpr);
      }
      ctx.globalAlpha = 1;

      /* keep the left side (under the title) dark, and darken the edges */
      const sk = `${Wp}x${Hp}`;
      if (sk !== sizeKey) {
        sizeKey = sk;
        const left = ctx.createLinearGradient(0, 0, Wp * 0.6, 0);
        left.addColorStop(0, "rgba(11,18,32,0.94)"); left.addColorStop(0.45, "rgba(11,18,32,0.72)"); left.addColorStop(1, "rgba(11,18,32,0)");
        const vig = ctx.createRadialGradient(Wp * 0.62, Hp * 0.5, Math.min(Wp, Hp) * 0.35, Wp * 0.62, Hp * 0.5, Math.max(Wp, Hp) * 0.75);
        vig.addColorStop(0, "rgba(6,10,20,0)"); vig.addColorStop(1, "rgba(6,10,20,0.75)");
        over = [left, vig];
      }
      for (const o of over) { ctx.fillStyle = o; ctx.fillRect(0, 0, Wp, Hp); }

      /* corner label: the algorithm and how many cells it has expanded */
      const done = found ? ep.n : Math.min(ep.n, Math.floor(tau / ep.dt));
      const l1 = ep.algo.toUpperCase(), l1b = "  " + NAME[ep.algo], l2 = `${done} cells expanded`, l3 = `${ep.from} → ${ep.to}${found ? ` · ${ep.moves} moves` : ""}`;
      const big = `700 ${22 * dpr}px "Bricolage Grotesque", "Public Sans", system-ui, sans-serif`, small = `500 ${12.5 * dpr}px "Public Sans", system-ui, sans-serif`;
      ctx.font = big; const w1 = ctx.measureText(l1).width; ctx.font = small;
      const pw = Math.max(w1 + ctx.measureText(l1b).width, ctx.measureText(l2).width, ctx.measureText(l3).width) + 28 * dpr, ph = 82 * dpr;
      const bxp = Wp - pw - 18 * dpr, byp = Hp - ph - 18 * dpr;
      ctx.globalAlpha = 0.3 + 0.7 * fade;
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(bxp, byp, pw, ph, 12 * dpr); else ctx.rect(bxp, byp, pw, ph);
      ctx.fillStyle = "rgba(10,16,30,0.72)"; ctx.fill(); ctx.lineWidth = dpr; ctx.strokeStyle = `rgba(${rgb},0.45)`; ctx.stroke();
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
      ctx.font = big; ctx.fillStyle = `rgb(${rgb})`; ctx.fillText(l1, bxp + 14 * dpr, byp + 30 * dpr);
      ctx.font = small; ctx.fillStyle = "rgba(215,225,245,0.8)"; ctx.fillText(l1b, bxp + 14 * dpr + w1, byp + 30 * dpr);
      ctx.fillStyle = "#eef2fb"; ctx.fillText(l2, bxp + 14 * dpr, byp + 52 * dpr);
      ctx.fillStyle = "rgba(215,225,245,0.75)"; ctx.fillText(l3, bxp + 14 * dpr, byp + 71 * dpr);
      ctx.globalAlpha = 1;
    }

    let ro = null;
    if (still) {
      /* reduced motion: one still frame (BFS done, robot halfway), drawn again whenever the canvas is resized (setting its size clears it) */
      const tau = ep.t0D + ep.tD * 0.55, paint = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => draw(0, tau)); };
      ro = new ResizeObserver(paint); ro.observe(canvas);
      paint();
    } else {
      const frame = (now) => {
        raf = requestAnimationFrame(frame);
        if (t0 === null) t0 = epT0 = now;
        let tau = (now - epT0) / 1000;
        if (tau > ep.T) { epT0 = now; tau = 0; ep = episode(++epN); }
        draw((now - t0) / 1000, tau);
      };
      raf = requestAnimationFrame(frame);
    }
    return () => { cancelAnimationFrame(raf); if (ro) ro.disconnect(); };
  }

  window._lab2 = { search, grid, MAPS, graphStats, whLayout, whPlan, whSolve, whRun, trace, miniMap, handRound, handScore, pSolve, scramble, solvable, gBFS, gDFS, floodFill, countObjects, folderDFS, searchFrames, TOUR, WH_CASES };
  Lab.init({
    title: "Lab 2: Solving problems by searching", steps, footer: "Thursday, week 1. Slides: Solving Problems by Searching.",
    welcome: {
      kicker: "Lab 2 · Solving problems by searching",
      title: "The campus delivery robot",
      lead: "A delivery robot has to find its way across campus. Watch how different search strategies explore the map, cell by cell, then build your own searches and race them.",
      scene: campusScene,
    },
  });
})();
