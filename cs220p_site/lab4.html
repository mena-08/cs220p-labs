<script>
window.LAB_TASKS = {

window.LAB_DEEPER = {
minkowski: `<p>d<sub>r</sub>(x, y) = ‖x − y‖<sub>r</sub> is induced by the ℓ<sub>r</sub> norm, and the unit balls are nested: the ℓ<sub>1</sub> diamond ⊂ ℓ<sub>2</sub> disc ⊂ ℓ<sub>∞</sub> square, so d<sub>∞</sub> ≤ d<sub>2</sub> ≤ d<sub>1</sub> ≤ √p·d<sub>2</sub>. For r < 1 the triangle inequality fails and ‖·‖<sub>r</sub> is not a norm, although fractional "distances" are sometimes used in high dimensions because they concentrate less. Neighbor rankings can change with r: when attributes are many and differences are spread out, ℓ<sub>1</sub> is often preferable to ℓ<sub>2</sub>.</p>`,
metric: `<p>Why metrics matter algorithmically: with the triangle inequality, |d(q, p) − d(p, x)| ≤ d(q, x) gives lower bounds that let kd-trees, ball trees and metric trees prune candidates without computing distances. Proofs worth knowing: the angle arccos(cos(x, y)) is a metric on the sphere; 1 − J(A, B) (Jaccard distance) is a metric (Marczewski-Steinhaus); 1 − cos is not (it fails the triangle inequality), though √(2(1 − cos)) is, being the chord length between unit vectors.</p>`,
scaling: `<p>A weighted Euclidean distance √Σ w<sub>i</sub>(x<sub>i</sub> − y<sub>i</sub>)² is the Euclidean distance after the linear map diag(√w); standardization is the special case w<sub>i</sub> = 1/σ<sub>i</sub>². Mahalanobis (step 8) generalizes this to any positive-definite matrix: it is Euclidean distance after whitening by Σ<sup>−1/2</sup>. Metric learning methods (NCA, LMNN) learn the matrix from labeled pairs; your weight sliders are a one-dimensional version of that.</p>`,
binary: `<p>SMC is 1 − Hamming/p and treats both states symmetrically; Jaccard is the ratio |A ∩ B| / |A ∪ B| on the supports and is the right measure when 1 is rare and informative (asymmetric attributes, sparse transaction data). As the catalog grows, SMC → 1 for everyone because f<sub>00</sub> dominates; Jaccard is invariant to shared zeros. MinHash estimates Jaccard from short signatures, which is how near-duplicate detection scales to the web.</p>`,
cosine: `<p>With non-negative counts cos ∈ [0, 1]; it equals the dot product of the ℓ<sub>2</sub>-normalized vectors, so ‖x̂ − ŷ‖² = 2(1 − cos): cosine is Euclidean distance after projecting onto the unit sphere. Term weighting matters more than the measure: TF-IDF multiplies counts by log(N/df) so that words appearing in every document stop contributing, a smooth version of stop-word removal. For long documents sublinear tf (1 + log tf) prevents a single repeated term from dominating. In dense embedding spaces (word2vec, sentence transformers) cosine remains the default for the same scale-invariance reason.</p>`,
correlation: `<p>Pearson's correlation is the cosine of the mean-centered vectors: corr(x, y) = cos(x − x̄, y − ȳ). It is invariant to affine transformations of either variable, which is why offset and gain do not change it, and it measures linear association only (Anscombe's quartet). Spearman's rank correlation applies Pearson to ranks and is the permissible choice for ordinal data. As a dissimilarity for time series, 1 − corr ignores level and amplitude; dynamic time warping additionally tolerates temporal misalignment.</p>`,
mahalanobis: `<p>D<sub>M</sub>²(x, μ) = (x − μ)ᵀΣ<sup>−1</sup>(x − μ) is the exponent of the multivariate Gaussian density, so contours of constant D<sub>M</sub> are equiprobability ellipsoids; under Gaussianity D<sub>M</sub>² follows a χ² distribution with p degrees of freedom, which gives a principled outlier threshold. It is Euclidean distance in the whitened coordinates Σ<sup>−1/2</sup>(x − μ) and reduces to standardized Euclidean when Σ is diagonal. Its weakness is Σ itself: estimated from data containing outliers it is distorted, hence robust covariance estimators (MCD).</p>`,
};

/* Lab 4: Measures of similarity and distance. Scenario: a pump trips at a gas plant; diagnose it from the most similar past failure */
(function () {
  const { h, RNG, fmt, mean, sd, range, select, check, metric, canvas, css, quiz, tournament, clamp, examples, callout, tween, sleep, pulse } = Lab;
  /* small helpers: approximate equality (ties), an animation-frame loop, replacing a box's content */
  const near = (a, b) => Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
  function frames(step) { let on = false, last = 0; const f = (now) => { const dt = Math.min(64, now - last); last = now; on = step(dt); if (on) requestAnimationFrame(f); }; return () => { if (!on) { on = true; last = performance.now(); requestAnimationFrame(f); } }; }
  const showIn = (box, ...kids) => { box.innerHTML = ""; kids.flat().filter(Boolean).forEach((k) => box.append(k)); };

  /* ---- distance toolkit ---- */
  const minkowski = (a, b, r) => r === Infinity ? Math.max(...a.map((x, i) => Math.abs(x - b[i]))) : Math.pow(a.reduce((s, x, i) => s + Math.pow(Math.abs(x - b[i]), r), 0), 1 / r);
  const euclid = (a, b) => minkowski(a, b, 2), manhattan = (a, b) => minkowski(a, b, 1), supremum = (a, b) => minkowski(a, b, Infinity);
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0), norm = (a) => Math.sqrt(dot(a, a));
  const cosine = (a, b) => (norm(a) && norm(b) ? dot(a, b) / (norm(a) * norm(b)) : 0);
  const extJaccard = (a, b) => dot(a, b) / (dot(a, a) + dot(b, b) - dot(a, b) || 1);
  function binCounts(a, b) { let f00 = 0, f01 = 0, f10 = 0, f11 = 0; a.forEach((x, i) => { const y = b[i]; if (x && y) f11++; else if (x) f10++; else if (y) f01++; else f00++; }); return { f00, f01, f10, f11 }; }
  const smc = (a, b) => { const f = binCounts(a, b); return (f.f00 + f.f11) / a.length; };
  const jaccard = (a, b) => { const f = binCounts(a, b); return f.f11 + f.f01 + f.f10 ? f.f11 / (f.f11 + f.f01 + f.f10) : 1; };
  const pearson = (a, b) => { const ma = mean(a), mb = mean(b); let sab = 0, saa = 0, sbb = 0; a.forEach((x, i) => { sab += (x - ma) * (b[i] - mb); saa += (x - ma) ** 2; sbb += (b[i] - mb) ** 2; }); return saa && sbb ? sab / Math.sqrt(saa * sbb) : 0; };
  const zscore = (cols) => cols.map((c) => { const m = mean(c), s = sd(c) || 1; return c.map((x) => (x - m) / s); });
  const STOP = new Set("a an the and or of to in for with on at by from as is are was were be been this that these those it its i my we our you your they their have has had do does did will would can could should may might not no but if then than so such very also into over under about up out more most less".split(" "));
  const tokens = (text, stop) => text.toLowerCase().replace(/[^a-z0-9+#\s]/g, " ").split(/\s+/).filter((w) => w && (!stop || !STOP.has(w)));
  function bow(docs, stop) { const vocab = new Map(); docs.forEach((d) => tokens(d, stop).forEach((w) => vocab.has(w) || vocab.set(w, vocab.size))); const vecs = docs.map((d) => { const v = new Array(vocab.size).fill(0); tokens(d, stop).forEach((w) => v[vocab.get(w)]++); return v; }); return { vocab: [...vocab.keys()], vecs }; }

  /* ---- synthetic maintenance history: centrifugal pump trips with a known root cause ---- */
  const NUM = ["vibration_mm_s", "bearing_temp_C", "pressure_bar", "flow_m3h"];
  const NUM_LABEL = { vibration_mm_s: "vibration (mm/s)", bearing_temp_C: "bearing temp (°C)", pressure_bar: "pressure (bar)", flow_m3h: "flow (m³/h)" };
  const CODES = ["High vibration", "High bearing temperature", "Low suction pressure", "Cavitation noise", "Seal leak", "Seal pot level low", "High coupling temperature", "Motor overcurrent", "Power dip", "Low discharge pressure", "High discharge temperature", "Filter ΔP high"];
  const CODE_SHORT = ["Vib", "BrgT", "SucP", "Cav", "Leak", "Pot", "CplT", "OvrC", "Dip", "DisP", "DisT", "Filt"];
  const CAUSES = {
    bearing: { label: "Bearing wear", color: "#5b7cfa", num: [[7, 1.5], [95, 6], [45, 4], [380, 110]], codes: [0, 1],
      words: ["grinding noise at the drive end bearing", "bearing housing too hot to touch", "grease looks dark and discolored", "rumbling that gets worse with speed", "bearing temperature alarm kept coming back"] },
    cavitation: { label: "Cavitation", color: "#ee8a84", num: [[5.5, 1.5], [70, 6], [32, 5], [470, 90]], codes: [2, 3],
      words: ["crackling noise like gravel inside the casing", "suction pressure gauge fluctuating", "suction strainer partly blocked", "impeller shows pitting", "discharge flow unstable and surging"] },
    seal: { label: "Seal failure", color: "#3fae8a", num: [[3, 1], [78, 6], [41, 4], [380, 110]], codes: [4, 5],
      words: ["liquid dripping from the mechanical seal", "puddle under the seal gland", "seal flush line blocked", "seal pot level dropping fast", "product smell near the seal"] },
    misalignment: { label: "Misalignment", color: "#e0a83a", num: [[6.5, 1.5], [86, 6], [45, 4], [380, 110]], codes: [0, 6],
      words: ["coupling guard hot after a few hours", "high axial vibration at the coupling", "motor was replaced last week and alignment was not checked", "loose foundation bolts on the baseplate", "coupling rubber elements worn"] },
    electrical: { label: "Motor electrical fault", color: "#8f7fe8", num: [[3.5, 1], [72, 6], [37, 5], [270, 90]], codes: [7, 8],
      words: ["motor tripped on overcurrent", "breaker tripped twice during start", "burned smell from the motor terminal box", "insulation test low on one winding", "voltage dip recorded on the feeder"] },
  };
  const CAUSE_KEYS = Object.keys(CAUSES);
  const FILLER = ["Operator reported the problem on the night shift and the pump was stopped.", "The area was checked by the shift supervisor and a work order was raised.", "The spare pump was started and the unit was isolated for the maintenance team.", "This is the second time this month that the pump has been reported."];
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  function makeTrip(rng, id, cause) {
    const c = CAUSES[cause], x = {};
    NUM.forEach((k, j) => { const [m, s] = c.num[j]; x[k] = +Math.max(0, rng.normal(m, s * NOISE.numScale)).toFixed(k === "flow_m3h" ? 0 : 1); });
    const falseRate = rng() < NOISE.flood ? NOISE.floodFalse : NOISE.codeFalse;   // some trips set off an alarm flood: many unrelated alarms at once
    const codes = CODES.map((_, k) => (rng() < (c.codes.includes(k) ? NOISE.codeHit : falseRate) ? 1 : 0));
    const alarms = codes.concat(Array.from({ length: NOISE.otherTags }, () => (rng() < falseRate / 3 ? 1 : 0)));   // all alarm tags of the unit: the 12 above plus others that rarely fire
    const own = rng.shuffle(c.words).slice(0, NOISE.own), other = rng() < NOISE.other ? [rng.pick(CAUSES[rng.pick(CAUSE_KEYS.filter((k) => k !== cause))].words)] : [];
    const note = rng.shuffle(own.concat(other)).map(cap).join(". ") + ". " + rng.shuffle(FILLER).slice(0, NOISE.filler[0] + rng.int(NOISE.filler[1] - NOISE.filler[0] + 1)).join(" ");
    return { id, tag: "P-" + (101 + rng.int(40)) + "ABC"[rng.int(3)], cause, ...x, codes, alarms, note };
  }
  function history(seed, n) { const rng = RNG(seed); return rng.shuffle(Array.from({ length: n }, (_, i) => CAUSE_KEYS[i % CAUSE_KEYS.length])).map((cause, i) => makeTrip(rng, i, cause)); }
  /* how noisy a trip record is: symptom phrases from its own cause, chance of one misleading phrase, alarm hit rate, false-alarm rate (normal and during an alarm flood), filler sentences, sensor spread */
  const NOISE = { own: 1, other: 0.5, codeHit: 0.6, codeFalse: 0.03, flood: 0.3, floodFalse: 0.35, otherTags: 48, filler: [2, 3], numScale: 1.3 };
  const HIST = history(4, 60);
  const tripName = (c) => `Trip ${c.id + 1} (${c.tag})`;
  const codeList = (codes) => codes.map((v, k) => (v ? CODES[k] : null)).filter(Boolean).join(", ") || "none";

  /* ---- drawing ---- */
  function plane(cv, pts, opts = {}) {
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    const pad = 36; const lo = opts.min ?? 0, hi = opts.max ?? 10;
    const X = (x) => pad + ((x - lo) / (hi - lo)) * (W - 2 * pad), Y = (y) => H - pad - ((y - lo) / (hi - lo)) * (H - 2 * pad);
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 1; for (let g = lo; g <= hi; g += (hi - lo) / 10) { ctx.beginPath(); ctx.moveTo(X(g), Y(lo)); ctx.lineTo(X(g), Y(hi)); ctx.stroke(); ctx.beginPath(); ctx.moveTo(X(lo), Y(g)); ctx.lineTo(X(hi), Y(g)); ctx.stroke(); }
    ctx.font = "12px Public Sans"; ctx.fillStyle = css("--muted"); ctx.fillText(opts.xlabel || "x", W - pad - 10, H - 8); ctx.fillText(opts.ylabel || "y", 6, pad - 8);
    (opts.shapes || []).forEach((s) => { ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2; ctx.setLineDash(s.dash || []); ctx.beginPath(); s.pts.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); if (s.close) ctx.closePath(); ctx.stroke(); ctx.setLineDash([]); });
    pts.forEach((p) => { ctx.fillStyle = p.color || css("--lagoon"); ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), p.r || 6, 0, 7); ctx.fill(); if (p.label) { ctx.fillStyle = css("--ink"); ctx.font = "bold 12px Public Sans"; ctx.fillText(p.label, X(p.x) + 9, Y(p.y) - 6); } });
    return { X, Y };
  }
  function matrixTable(labels, M, f = (v) => fmt(v, 2), hi = null) {
    const t = h("table", {}, h("tr", {}, h("th", {}, ""), ...labels.map((l) => h("th", {}, l))));
    labels.forEach((l, i) => t.append(h("tr", {}, h("th", {}, l), ...labels.map((_, j) => h("td", { style: hi && hi(i, j) ? "background:var(--sand);font-weight:600" : "" }, i === j ? "–" : f(M[i][j]))))));
    return h("div", { class: "wide" }, t);
  }
  const causeLegend = () => h("div", { class: "legend" }, ...CAUSE_KEYS.map((k) => h("span", {}, h("i", { style: `background:${CAUSES[k].color}` }), CAUSES[k].label)));

  const steps = [];
  steps.push({
    id: "why", title: "Why similarity? A pump trips", time: 10,
    theory: `<h3>Have we seen this failure before?</h3>
      <p>A gas plant runs dozens of centrifugal pumps. When one trips, the reliability engineer's first question is: <b>which past failure looks most like this one?</b> If the most similar past trip was a worn bearing, check the bearing first. This is <b>case-based diagnosis</b>, and the same question drives recommendations, duplicate detection, clustering and anomaly alarms: each needs a number that says how alike two objects are. A <b>similarity</b> is a numerical measure of how alike two objects are, usually in [0, 1] with 1 for identical. A <b>dissimilarity</b> or <b>distance</b> measures how different they are, 0 for identical, with no fixed upper bound. The two are interchangeable with a transformation such as s = 1 / (1 + d) or s = 1 − d / d<sub>max</sub>.</p>
      <p>Each trip in our maintenance history has sensor readings at the trip (vibration, bearing temperature, discharge pressure, flow), the set of alarm codes that fired (binary), the technician's free-text note, and the root cause found after the repair. The right measure depends on the attribute type: differences for interval and ratio attributes, ranks for ordinal, matching for nominal and binary, angles for sparse count vectors such as text. We will find the most similar past trip three different ways, then combine them.</p>`,
    ask: `<div class='a'>Ask: "A pump trips. What would you compare with past failures?" Collect answers on the board: the sensor readings (numeric), which alarms fired (binary), what the technician wrote (text), the vibration trend before the trip (a time series). Each needs a different measure; the lab goes through them in that order.</div>
      <div class='a'>Point at the root-cause column: the history is labeled, so we can check whether "most similar" actually gives the right diagnosis. That is exactly what the tournament scores.</div>
      <div class='a'>Use the examples: two bearing-wear trips, then bearing wear against a seal failure. The four numbers under the bars preview the measures of the next steps. The edge case compares a trip with itself (distance 0, similarity 1): a retrieval system must leave the query out of the history.</div>`,
    mount() {
      let ia = 0, ib = 1;
      const ZS = zscore(NUM.map((k) => HIST.map((c) => c[k]))), MAX = NUM.map((k) => Math.max(...HIST.map((c) => c[k])));
      const cv = canvas(760, 226), info = h("div"), msg = h("div"), stats = h("div", { class: "metrics" });
      const frac = (i) => NUM.map((k, j) => HIST[i][k] / MAX[j]);
      let cur = null, tok = 0;
      function drawBars(v) {
        const ctx = cv.getContext("2d"), W = cv.width, L = 150, bw = W - L - 110; ctx.clearRect(0, 0, W, cv.height); ctx.font = "12px Public Sans";
        NUM.forEach((k, j) => {
          const y0 = 12 + j * 54; ctx.fillStyle = css("--ink-2"); ctx.fillText(NUM_LABEL[k], 6, y0 + 18);
          [[v[0][j], css("--lagoon"), HIST[ia][k], "A"], [v[1][j], css("--coral"), HIST[ib][k], "B"]].forEach(([f, col, val, nm], s) => {
            ctx.fillStyle = css("--line"); ctx.fillRect(L, y0 + s * 18, bw, 14);
            ctx.fillStyle = col; ctx.fillRect(L, y0 + s * 18, clamp(f, 0, 1) * bw, 14);
            ctx.fillStyle = css("--ink"); ctx.fillText(`${nm}: ${val}`, L + bw + 8, y0 + 11 + s * 18);
          });
        });
      }
      function update() {
        const to = [frac(ia), frac(ib)], from = cur || to, my = ++tok;
        tween(550, (t) => { if (my !== tok) return; cur = from.map((r, s) => r.map((x, j) => x + (to[s][j] - x) * t)); drawBars(cur); });
        const A = HIST[ia], B = HIST[ib];
        const dz = euclid(NUM.map((_, j) => ZS[j][ia]), NUM.map((_, j) => ZS[j][ib]));
        const f = binCounts(A.codes, B.codes), uni = f.f11 + f.f10 + f.f01;
        const { vocab, vecs } = bow([A.note, B.note], true), shared = vocab.filter((w, k) => vecs[0][k] && vecs[1][k]);
        showIn(stats, metric("Sensors: standardized Euclidean", fmt(dz, 2)), metric("Alarm codes: Jaccard", uni ? fmt(f.f11 / uni, 2) : "0/0"), metric("Notes: cosine", fmt(cosine(vecs[0], vecs[1]), 2)), metric("Root cause", A.cause === B.cause ? "same" : "different", A.cause === B.cause ? "good" : "bad"));
        const chips = CODES.map((c, k) => (A.codes[k] || B.codes[k] ? h("span", { class: "badge" + (A.codes[k] && B.codes[k] ? "" : " warn"), style: "margin:0 .3rem .3rem 0" }, `${c}: ${A.codes[k] && B.codes[k] ? "both" : A.codes[k] ? "A only" : "B only"}`) : null)).filter(Boolean);
        showIn(info, h("p", {}, h("b", {}, "A: "), `${tripName(A)}, ${CAUSES[A.cause].label}. `, h("span", { class: "note" }, A.note)), h("p", {}, h("b", {}, "B: "), `${tripName(B)}, ${CAUSES[B.cause].label}. `, h("span", { class: "note" }, B.note)),
          h("div", {}, h("b", {}, "Alarm codes: "), chips.length ? chips : "neither trip raised any of the 12 codes"), h("p", {}, h("b", {}, "Shared words (stop words removed): "), shared.join(", ") || "none"));
        showIn(msg, ia === ib ? callout("A and B are the same trip. Every sensor difference is 0, every alarm and every word is shared: distance 0, similarity 1. When we search the history for the most similar trip, we must leave the trip itself out, or every trip is its own best match.", "edge")
          : !uni ? callout("Neither trip raised an alarm code, so the Jaccard similarity is 0/0: undefined. Step 5 looks at this case.", "edge") : null);
      }
      const opts = HIST.map((c) => ({ value: c.id, label: `${tripName(c)}: ${CAUSES[c.cause].label}` }));
      const aCtl = select({ label: "Trip A", options: opts, value: ia, onchange: (v) => { ia = +v; update(); } });
      const bCtl = select({ label: "Trip B", options: opts, value: ib, onchange: (v) => { ib = +v; update(); } });
      const firstOf = (cause, not = -1) => HIST.find((c) => c.cause === cause && c.id !== not && c.codes.some(Boolean)).id;
      const b0 = firstOf("bearing"), b1 = firstOf("bearing", b0), s0 = firstOf("seal");
      const ex = examples([
        { label: "Two bearing-wear trips", note: "A and B both had a worn bearing. Watch the bars slide to the new trips and the four numbers update. Some evidence agrees and some does not, so we need one number per kind of data.", run: async () => { aCtl.apply(b0); await sleep(900); bCtl.apply(b1); await sleep(900); } },
        { label: "Bearing wear vs seal failure", note: "A stays a bearing-wear trip; B becomes a seal failure. Watch which bars move, which alarm chips change and which shared words remain.", run: async () => { aCtl.apply(b0); await sleep(700); bCtl.apply(s0); await sleep(900); } },
        { label: "A trip compared with itself", kind: "edge", note: "B becomes A. The bars meet exactly: distance 0, Jaccard 1, cosine 1.", run: async () => { aCtl.apply(s0); await sleep(700); bCtl.apply(s0); await sleep(900); } },
      ]);
      update();
      const t = h("table", {}, h("tr", {}, h("th", {}, "Trip"), ...NUM.map((k) => h("th", {}, NUM_LABEL[k])), h("th", {}, "alarm codes"), h("th", {}, "technician note"), h("th", {}, "root cause")));
      HIST.slice(0, 8).forEach((c) => t.append(h("tr", {}, h("td", {}, tripName(c)), ...NUM.map((k) => h("td", {}, c[k])), h("td", { class: "note" }, codeList(c.codes)), h("td", { class: "note" }, c.note), h("td", {}, CAUSES[c.cause].label))));
      return h("div", {}, ex,
        h("div", { class: "lab" }, h("div", { class: "controls" }, aCtl, bCtl, h("div", { class: "legend" }, h("span", {}, h("i", { style: "background:var(--lagoon)" }), "Trip A"), h("span", {}, h("i", { style: "background:var(--coral)" }), "Trip B")), h("p", { class: "note" }, "Bars are scaled to the largest value in the history.")), h("div", { class: "stage" }, cv, stats, msg, info)),
        h("h3", {}, "The first 8 trips of the history"),
        h("div", { class: "wide" }, t, h("p", { class: "note" }, `52 more trips. The table shows the 12 alarm codes that matter for these faults: ${CODES.join(", ")}. The unit has 48 more alarm tags that rarely fire; the tournament compares all 60.`)));
    },

  steps.push({

      <p>Pick a trip and compare its nearest past trip before and after standardization, and check whether that trip had the same root cause. The last line scores the whole history: for every trip, does its nearest other trip have the same root cause? Then change the weights: weighting is how you say which sensors matter for diagnosis.</p>`,

  /* tournament: diagnose new trips by the root cause of the most similar past trip */
  function diagnose(hist, queries, p) {
    const st = NUM.map((k) => { const v = hist.map((c) => c[k]); return [mean(v), sd(v) || 1]; });
    const f = (c) => NUM.map((k, j) => (p.std === "yes" ? (c[k] - st[j][0]) / st[j][1] : c[k]));
    const H = hist.map(f), Q = queries.map(f);
    const dnum = p.num === "euclid" ? euclid : p.num === "manhattan" ? manhattan : supremum;
    const { vecs } = bow(hist.map((c) => c.note).concat(queries.map((c) => c.note)), p.stop === "yes");
    return queries.map((q, i) => {
      let best = -1, bs = -Infinity;
      hist.forEach((c, j) => {
        const sNum = 1 / (1 + dnum(Q[i], H[j]));
        const sBin = p.bin === "jaccard" ? jaccard(q.alarms, c.alarms) : smc(q.alarms, c.alarms);
        const sTxt = p.txt === "cosine" ? cosine(vecs[hist.length + i], vecs[j]) : extJaccard(vecs[hist.length + i], vecs[j]);
        const s = p.wnum * sNum + p.wbin * sBin + p.wtxt * sTxt;
        if (s > bs) { bs = s; best = j; }
      });
      return hist[best].cause;
    });
  }
  function tourRun(p, seeds) {
    const accs = [];
    for (const s of seeds) { const hist = history(s, 60), qs = history(s + 5000, 30), pred = diagnose(hist, qs, p); accs.push(mean(qs.map((q, i) => (pred[i] === q.cause ? 1 : 0)))); }
    const acc = mean(accs);
    return { points: 1000 * acc, details: [{ k: "Trips diagnosed correctly", v: fmt(100 * acc, 0) + "%" }], summary: "For each new trip, your similarity picks the most similar past trip and its root cause is your diagnosis. Points = 1000 × the share of new trips diagnosed correctly, averaged over the rounds." };
  }
  const TOUR = Lab.tournamentSpec({
    labId: "L4",
    intro: `<h3>Rules</h3><p>Each round has a maintenance history of 60 past trips with known root causes and 30 new trips to diagnose. Your system diagnoses a new trip as the root cause of its <b>most similar past trip</b>. Build the similarity: pick the numeric distance for the sensors, whether to standardize them, the measure for alarm codes (compared over all 60 alarm tags of the unit, most of them silent), the measure for technician notes, whether to remove stop words, and how to weight the three parts. Practice on 3 rounds; one official run on 5 hidden rounds. Points = 1000 × the share of new trips diagnosed correctly.</p>`,
    params: [
      { key: "num", label: "Sensors: distance", type: "select", string: true, options: [{ value: "euclid", label: "Euclidean" }, { value: "manhattan", label: "Manhattan" }, { value: "supremum", label: "Supremum" }], default: "euclid" },
      { key: "std", label: "Standardize sensors", type: "select", string: true, options: [{ value: "no", label: "no" }, { value: "yes", label: "yes (z-scores)" }], default: "no" },
      { key: "bin", label: "Alarm codes (binary)", type: "select", string: true, options: [{ value: "smc", label: "simple matching" }, { value: "jaccard", label: "Jaccard" }], default: "smc" },
      { key: "txt", label: "Technician notes (text)", type: "select", string: true, options: [{ value: "cosine", label: "cosine" }, { value: "ej", label: "extended Jaccard" }], default: "cosine" },
      { key: "stop", label: "Remove stop words", type: "select", string: true, options: [{ value: "no", label: "no" }, { value: "yes", label: "yes" }], default: "no" },
