window.LAB_TASKS = {
scenario: `Play with the hall diagram to see what cooling costs, guess the four PEAS rows of the cooling controller in your own words, reveal the answer and compare, play one day of the finished agent, and read its cost receipt.`,
environment: `Classify four industrial agents on six properties and get at least 20 of 24 right before showing the answers; then read the reasons for the cards you got wrong.`,
beat: `Plan the cooling level for each 2-hour block of day 131: find the lowest flat plan with zero minutes above 27 °C, then lower blocks one by one until the day stays within its budget of 3,480 SAR, and then 200 SAR under it. Note what information you were missing while planning.`,
reflex: `Tune T_set, HIGH and LOW: zero minutes above 27 °C on day 101, then within the day's budget, then lose less than 2,000 SAR over the 10 practice days; finally break your own safe rule with a heat wave and explain in one sentence why the same rule fails.`,

utility: `Tune w_viol and the horizon: at least 270 SAR under budget on day 101, at least 1,450 SAR left over the 10 practice days, and zero minutes in a 5 °C heat wave. Decide which w_viol a rational operator should use when the performance measure is money.`,

window.LAB_DEEPER = {
scenario: `<p>Formally, an agent is a function f: P* → A from percept sequences to actions. Rationality: for every percept sequence, pick the action that maximizes the <i>expected</i> value of the performance measure given the sequence and the agent's prior knowledge. Our controller is a partially observable Markov decision process (POMDP): hidden state s = (T<sub>true</sub>, cooling state), observation o = T<sub>true</sub> + ε with ε ~ N(0, 0.3²), action u ∈ {0,…,10}, reward r = −(energy cost + penalty). The utility-based agent of step 7 is a receding-horizon controller, which the control community calls model predictive control (MPC); it is the standard way HVAC and chemical plants are run, and the baseline DeepMind had to beat.</p>`,
environment: `<p>Observability decides the state representation: in a fully observable MDP the policy is a function of the current state, π(s); in a POMDP the optimal policy is a function of the belief state b(s) = P(s | percept history), which is why the model-based agent needs memory. Sequential vs episodic decides whether the problem needs dynamic programming or plain classification. "Known" is about the transition model P(s' | s, a): step 8 estimates it, which is the system-identification half of reinforcement learning.</p>`,
model: `<p>The transition model is a first-order linear ODE: C·dT/dt = L(t) + k·(T<sub>out</sub> − T) − Q(t), discretized with Δt = 1/6 h. Its open-loop time constant is τ = C/k = 8 h, so the hall is slow to equilibrate; the actuator is another first-order lag, Q<sub>eff</sub> ← Q<sub>eff</sub> + 0.15·(Q<sub>cmd</sub> − Q<sub>eff</sub>) per step, time constant ≈ 1/0.15 ≈ 6.7 steps ≈ 67 min. Two lags in series are what make a thermostat oscillate: the loop gain at the oscillation frequency exceeds one. The exponential moving average T<sub>f</sub> ← 0.5 T<sub>f</sub> + 0.5 T<sub>m</sub> is a one-parameter Kalman filter; the slope extrapolation is a first-order Taylor prediction. The incremental law u ← u + K(T<sub>pred</sub> − target) is integral control: it has no steady-state error but adds phase lag, which is why large K destabilizes it.</p>`,
goal: `<p>The feed-forward term is the inverse of the steady-state model: setting dT/dt = 0 gives Q* = L + k(T<sub>out</sub> − T<sub>target</sub>), so u* = Q*/gain. Feed-forward from a known disturbance (the schedule) plus a small feedback correction is a classic two-degree-of-freedom controller. In AI terms the schedule turns an unobserved future into a known one, and the goal test "T ≤ 27 for all future t" is a safety constraint; checking it requires simulating forward, i.e. search in the space of action sequences (next lecture).</p>`,
utility: `<p>Expected utility is justified by the von Neumann-Morgenstern axioms: a rational preference order over lotteries is representable by a utility whose expectation is maximized. Our agent evaluates only constant action sequences over the horizon, 11 candidates instead of 11<sup>H</sup> sequences; full dynamic programming over the belief state is intractable here, and MPC is the practical compromise. The soft penalty 1000·σ((T − 26.5)/0.3) is a smooth surrogate for the indicator of a violation, i.e. an approximate expectation under the prediction error. The need for H to exceed the actuator time constant is the receding-horizon stability condition: a horizon shorter than the plant's response makes the controller myopic.</p>`,
learning: `<p>Fitting (C, k, gain) from logged transitions is linear least squares after the substitution a = Δt/C, b = k·Δt/C, c = gain·Δt/C: ΔT = a·L + b·(T<sub>out</sub> − T) − c·u<sub>eff</sub>. Identifiability requires persistent excitation: if the controller holds T constant, the regressors are collinear and the normal equations are singular, which is why the logged days come from a crude thermostat. This is the exploration-exploitation trade-off in its original control-theoretic form (dual control). The four-component learning agent of the lecture maps onto model-based reinforcement learning: performance element = policy, critic = value or error signal, learning element = model update, problem generator = exploration policy.</p>`,
measure: `<p>Optimizing a proxy is Goodhart's law; in the RL literature it is reward hacking or specification gaming. The lecture's advice (reward the state of the world, not the agent's behavior) is the design principle behind constrained optimization: minimize energy subject to T ≤ 27, which the penalty term turns into a Lagrangian with multiplier 1000 SAR per step. Changing the multiplier changes the optimal policy, which is exactly what the w_viol slider shows.</p>`,
};

/* Lab 1: Intelligent agents. Scenario: cooling controller for a data center hall */
(function () {
  const { h, RNG, fmt, mean, range, select, metric, canvas, css, quiz, tournament, clamp, sleep, tween, pulse, examples, callout, mission } = Lab;
  const { exp, pow, abs } = Math;                 // local names: the hot loops below avoid global lookups
  const STEPS = 144, DT = 1 / 6;                 // 10-minute steps, one day
  const LIMIT = 27, PENALTY = 1000;               // °C inlet limit (ASHRAE A1), SAR per 10 min above it
  const TRUE = { cth: 0.4, kenv: 0.05, gain: 0.5, lag: 0.15 };   // MWh/°C, MW/°C, MW per cooling level, actuator response per step
  const GUESS = { cth: 0.7, kenv: 0.03, gain: 0.62, lag: 0.15 };  // what the designer believed before measuring
  const price = (t) => { const hr = (t * DT) % 24; return hr >= 13 && hr < 17 ? 0.48 : hr >= 22 || hr < 8 ? 0.18 : 0.32; };   // SAR per kWh
  const PRICE = Array.from({ length: STEPS }, (_, t) => price(t));
  const cop = (to) => 5.5 - 0.1 * (to - 25);
  const coolPower = (ueff, to) => 0.25 * Math.pow(ueff / 10, 3) + (TRUE.gain * ueff) / cop(to);   // MW electrical: fans (cube law) + the cooling units' compressors
  const UDEF = { wviol: 1, horizon: 6, wwear: 0 };

  function day(seed, p = {}) {
    const rng = RNG(seed); const heat = p.heat ?? 0;
    const toBase = 29 + rng() * 6 + heat, amp = 5 + rng() * 3;
    const jobs = []; const nJobs = 1 + rng.int(2);
    for (let j = 0; j < nJobs; j++) { const start = 48 + rng.int(72); const dur = 6 + rng.int(13); jobs.push({ start, end: start + dur, mw: +(0.8 + rng() * 1.4).toFixed(1) }); }
    const to = [], load = [];
    for (let t = 0; t < STEPS; t++) {
      const hr = t * DT; to.push(toBase + amp * Math.sin(((hr - 9) / 24) * 2 * Math.PI));
      let L = 1.2 + 0.8 * Math.max(0, Math.sin(((hr - 8) / 20) * Math.PI)) + rng.normal(0, 0.05);
      jobs.forEach((j) => { if (t >= j.start && t < j.end) L += j.mw; });
      load.push(Math.max(0.5, L));
    }
    return { seed, heat, to, load, jobs, noise: Array.from({ length: STEPS }, () => rng.normal(0, 0.3)), t0: 22 + rng() * 2 };
  }
  /* run one agent over one day. agent(percept) -> cooling level 0..10. The log keeps running totals so a replay can show the bill growing */
  function run(agent, d) {
    if (agent.reset) agent.reset();
    let T = d.t0, ueff = 2, uprev = 2; const log = { T: [], Tm: [], u: [], ueff: [], cum: [], nv: [], cost: 0, energy: 0, viol: 0, peak: -Infinity };
    for (let t = 0; t < STEPS; t++) {
      const Tm = T + d.noise[t];
      const per = { t, T: Tm, load: d.load[t], to: d.to[t], price: price(t), jobs: d.jobs, uprev,
        schedule: (hz) => { let m = d.load[t]; for (let s = t; s < Math.min(STEPS, t + hz); s++) { let L = d.load[t]; d.jobs.forEach((j) => { if (s >= j.start && s < j.end && !(t >= j.start && t < j.end)) L += j.mw; if (t >= j.start && t < j.end && s >= j.end) L -= j.mw; }); m = Math.max(m, L); } return m; } };
      const u = clamp(Math.round(agent(per)), 0, 10);
      ueff += TRUE.lag * (u - ueff);                                   // the cooling units ramp, they do not jump
      T += (DT / TRUE.cth) * (d.load[t] + TRUE.kenv * (d.to[t] - T) - TRUE.gain * ueff);
      const e = coolPower(ueff, d.to[t]) * DT * 1000;                 // kWh in this step
      log.energy += e; log.cost += e * price(t); if (T > LIMIT) { log.viol++; log.cost += PENALTY; }
      log.T.push(T); log.Tm.push(Tm); log.u.push(u); log.ueff.push(ueff); log.cum.push(log.cost); log.nv.push(log.viol); log.peak = Math.max(log.peak, T); uprev = u;
    }
    return log;
  }

  const agents = {
    reflex: (tset, uhigh, ulow) => (per) => (per.T > tset ? uhigh : ulow),
    model: (target, K, horizon) => {
      let Tf = null, Tprev = null, u = 2;
      const f = (per) => {
        Tf = Tf === null ? per.T : 0.5 * Tf + 0.5 * per.T;                          // sensor model: filter the noisy reading
        const slope = Tprev === null ? 0 : Tf - Tprev; Tprev = Tf;
        const Tpred = Tf + slope * horizon;                                         // where we will be if nothing changes
        u = clamp(Math.round(u + K * (Tpred - target)), 0, 10);
        f.state = { Tf, Tpred }; return u;
      };
      f.reset = () => { Tf = null; Tprev = null; u = 2; }; return f;
    },
    goal: (target, lookahead, K, model = TRUE) => {
      let Tf = null;
      const f = (per) => {
        Tf = Tf === null ? per.T : 0.5 * Tf + 0.5 * per.T;
        const Lmax = per.schedule(lookahead);                                       // the goal: never exceed the limit, even when the batch job starts
        const Qneeded = Lmax + model.kenv * (per.to - target);                      // steady-state cooling that holds the target under that load
        const uff = Qneeded / model.gain;                                           // feed-forward from the model
        const u = clamp(Math.round(uff + K * (Tf - target)), 0, 10); f.state = { Lmax, uff }; return u;
      };
      f.reset = () => { Tf = null; }; return f;
    },
    utility: (w, model = TRUE) => {
      let Tf = null, ueff = 2, uprev = 2;
      const H = w.horizon, lag = model.lag, gk = DT / model.cth, kenv = model.kenv, gain = model.gain, wv = w.wviol * PENALTY, pr = new Array(H);
      const f = (per) => {
        Tf = Tf === null ? per.T : 0.5 * Tf + 0.5 * per.T;
        ueff += lag * (uprev - ueff);
        const Lh = per.schedule(H), to = per.to, cp = cop(to); let best = 0, bestU = -Infinity;
        for (let i = 0; i < H; i++) pr[i] = price(per.t + i);
        for (let u = 0; u <= 10; u++) {
          let TT = Tf, ue = ueff, cost = 0;
          for (let i = 0; i < H; i++) {
            ue += lag * (u - ue); TT += gk * (Lh + kenv * (to - TT) - gain * ue);
            cost += (0.25 * pow(ue / 10, 3) + (TRUE.gain * ue) / cp) * DT * 1000 * pr[i];   // electricity at the price of that step
            cost += wv / (1 + exp(-(TT - LIMIT + 0.5) / 0.3));                               // expected penalty: soft probability of a violation
          }
          cost += w.wwear * 20 * abs(u - uprev);
          const U = -cost; if (U > bestU) { bestU = U; best = u; }
        }
        uprev = best; f.state = { Tf }; return best;
      };
      f.reset = () => { Tf = null; ueff = 2; uprev = 2; }; return f;
    },
    /* the omniscient reference. It is given the day itself: the true temperature, the exact future load and weather. It plans level a for
       `split` steps then level b up to H steps ahead, scores each plan with the real bill and the real penalty, and keeps an exact copy of the hall */
    omniscient: (d, H, split) => {
      const g = DT / TRUE.cth, kw = DT * 1000, lag = TRUE.lag, kenv = TRUE.kenv, gain = TRUE.gain, load = d.load, out = d.to;
      const fan = PRICE.map((pr) => 0.25 * kw * pr), chill = out.map((to, s) => (gain / cop(to)) * kw * PRICE[s]);   // SAR per unit of x³ and of level, per step
      const near = (c) => { const o = [c]; for (let k = 1; k <= 10; k++) { if (c - k >= 0) o.push(c - k); if (c + k <= 10) o.push(c + k); } return o; };   // try the last choice first: tighter bound, more pruning
      const ORDER = Array.from({ length: 11 }, (_, c) => near(c));
      let T = d.t0, ueff = 2, prev = 2;
      const f = (per) => {
        const t = per.t, end = t + H < STEPS ? t + H : STEPS, mid = t + split < end ? t + split : end, oa = ORDER[prev]; let best = prev, bestC = Infinity;
        for (let ia = 0; ia < 11; ia++) {
          const a = oa[ia]; let TT = T, ue = ueff, c = 0;
          for (let s = t; s < mid && c < bestC; s++) { ue += lag * (a - ue); TT += g * (load[s] + kenv * (out[s] - TT) - gain * ue); const x = ue / 10; c += fan[s] * x * x * x + chill[s] * ue; if (TT > LIMIT) c += PENALTY; }
          if (c >= bestC) continue;
          const ob = ORDER[a];
          for (let ib = 0; ib < 11; ib++) {
            const b = ob[ib]; let T2 = TT, u2 = ue, c2 = c;
            for (let s = mid; s < end && c2 < bestC; s++) { u2 += lag * (b - u2); T2 += g * (load[s] + kenv * (out[s] - T2) - gain * u2); const x = u2 / 10; c2 += fan[s] * x * x * x + chill[s] * u2; if (T2 > LIMIT) c2 += PENALTY; }
            if (c2 < bestC) { bestC = c2; best = a; }
          }
        }
        prev = best;
        ueff += lag * (best - ueff); T += g * (load[t] + kenv * (out[t] - T) - gain * ueff);   // same update as the hall
        return best;
      };
      f.reset = () => { T = d.t0; ueff = 2; prev = 2; }; return f;
    },
    constant: (u) => () => u,
    replay: (us) => (per) => us[per.t],
  };

  /* reference cost of a day: the better of two omniscient planners. Nobody without perfect foresight can expect to match it */
  const PLANNERS = [[12, 3], [18, 6]];   // [horizon, steps before the plan may switch level]
  const refCache = {};
  function refLog(d) {
    const k = d.seed + ":" + d.heat;
    if (!refCache[k]) refCache[k] = PLANNERS.map(([H, s]) => run(agents.omniscient(d, H, s), d)).reduce((a, b) => (b.cost < a.cost ? b : a));
    return refCache[k];
  }
  const refCost = (d) => refLog(d).cost;
  /* the plant manager's budget for a day: the best possible cost of that day (the omniscient agent) + 10%, rounded up to the next 10 SAR */
  const budgetOf = (d) => Math.ceil((refCost(d) * 1.1) / 10) * 10;
  const signed = (v) => (v < 0 ? "−" : "+") + fmt(Math.abs(v), 0);
  const vsBudget = (left) => (left >= 0 ? `under budget by ${fmt(left, 0)} SAR` : `over budget by ${fmt(-left, 0)} SAR`);
  /* money left over several days = Σ (budget − cost); it can be negative. A day is within budget when cost ≤ budget */
  function scoreDays(make, days) {
    const rs = days.map((d) => { const r = run(make(d), d), budget = budgetOf(d); return { ...r, budget, left: budget - r.cost }; });
    const avg = (k) => mean(rs.map((r) => r[k]));
    return { cost: avg("cost"), energy: avg("energy"), viol: avg("viol"), budget: avg("budget"), left: rs.reduce((s, r) => s + r.left, 0), within: rs.filter((r) => r.left >= 0).length, peak: Math.max(...rs.map((r) => r.peak)), worst: Math.min(...rs.map((r) => r.left)), runs: rs };
  }
  const evalMany = (make, seeds, p = {}) => scoreDays(make, seeds.map((s) => day(s, p)));
  const PRACTICE = Array.from({ length: 10 }, (_, i) => 101 + i);

  /* learning: estimate the thermal constants from logged days by least squares on the transition equation */
  const learnCache = {};
  function learnModel(nDays) {
    if (nDays === 0) return { ...GUESS };
    if (learnCache[nDays]) return learnCache[nDays];
    const rows = [];
    for (let i = 0; i < nDays; i++) { const d = day(500 + i); const log = run(agents.reflex(24, 8, 2), d); for (let t = 1; t < STEPS; t += 3) { const T = log.T[t - 1]; rows.push({ dT: log.T[t] - T, load: d.load[t], to: d.to[t], T, ue: log.ueff[t] }); } }
    const n = rows.length, col = (k) => Float64Array.from(rows, (r) => r[k]), dT = col("dT"), L = col("load"), dTo = Float64Array.from(rows, (r) => r.to - r.T), ue = col("ue");
    let best = null, bestErr = Infinity;
    for (let cth = 0.2; cth <= 1.2; cth += 0.05) { const a = DT / cth; for (let kenv = 0.02; kenv <= 0.12; kenv += 0.01) for (let gain = 0.3; gain <= 0.7; gain += 0.02) {
      let err = 0; for (let i = 0; i < n; i++) { const pred = a * (L[i] + kenv * dTo[i] - gain * ue[i]); err += (pred - dT[i]) ** 2; if (err > bestErr) break; }
      if (err < bestErr) { bestErr = err; best = { cth: +cth.toFixed(2), kenv: +kenv.toFixed(2), gain: +gain.toFixed(2), lag: TRUE.lag }; }
    } }
    // noisy readings in few days blur the fit: shrink toward the guess when data is scarce
    const wgt = Math.min(1, nDays / 4);
    best = { cth: +(wgt * best.cth + (1 - wgt) * GUESS.cth).toFixed(2), kenv: +(wgt * best.kenv + (1 - wgt) * GUESS.kenv).toFixed(2), gain: +(wgt * best.gain + (1 - wgt) * GUESS.gain).toFixed(2), lag: TRUE.lag };
    learnCache[nDays] = best; return best;
  }

  /* tournament: the official days live on the server; the last two days of any seed list are heat waves (+5 °C) */
  const tourAgent = (p) => p.agent === "reflex" ? agents.reflex(p.tset, p.uhigh, p.ulow) : p.agent === "model" ? agents.model(p.target, p.K, p.horizon) : p.agent === "goal" ? agents.goal(p.target, p.lookahead, p.K) : p.agent === "utility" ? agents.utility({ wviol: p.wviol, horizon: p.H, wwear: p.wwear }) : agents.utility({ wviol: p.wviol, horizon: p.H, wwear: p.wwear }, learnModel(p.days));
  const TOUR = Lab.tournamentSpec({
    labId: "L1",
    intro: `<h3>The cooling league</h3><p>You run the hall for <b>10 days you have not seen</b>. Each morning the plant manager sets the day's cooling budget: the best possible cost of that day plus 10%. Your score is the <b>money left in the budget</b> over the 10 days (budget − your cost, added up). Above zero: you beat the manager's budget overall. Every 10 minutes above 27 °C adds 1,000 SAR to your cost, so one bad afternoon can wipe out a week of savings. The last two days are heat waves (+5 °C).</p>`,
    howTo: [
      "<b>Pick an agent</b> on the left. Only that agent's settings appear under it, each with a one-line reminder of what it does (you met them in steps 4 to 8).",
      "<b>Tune</b> its settings and press <b>Practice run</b>. You get your money left on 10 practice days, with a bar per day: green under budget, red over. The two heat-wave days are marked.",
      "<b>Compare</b>: every practice run is added to the table under the result. Look for a run with no big red day, not just the highest total: the hidden days are different.",
      "Press <b>Use</b> on your best run to put it back on the controls, enter your name and team, and press <b>Official run</b>. You get one; the server scores it on the hidden days.",
    ],
    unit: "SAR left in the budget",
    grade: (v) => (v >= 0 ? "good" : "bad"),
    barsTitle: "Money left on each practice day (budget − cost)",
    barsUnit: "SAR",
    compare: ["Days within budget", "Worst day"],
    params: [
      { key: "agent", label: "Agent", type: "select", string: true, cards: true, default: "utility", options: [
        { value: "reflex", label: "Simple reflex (step 4)", desc: "A thermostat: above T_set it cools at HIGH, otherwise at LOW. No memory, no planning." },
        { value: "model", label: "Model-based (step 5)", desc: "Predicts where the temperature is heading and corrects toward a target." },
        { value: "goal", label: "Goal-based (step 6)", desc: "Reads the job schedule ahead and cools in advance for the next batch job." },
        { value: "utility", label: "Utility-based (step 7)", desc: "Tries every cooling level on its model and picks the cheapest one that is still safe." },
        { value: "learning", label: "Learning (step 8)", desc: "The utility agent, but it first learns the hall's physics from logged days." },
      ] },
      { key: "tset", label: "T_set (°C)", min: 20, max: 28, step: 0.5, default: 24, fmt: (v) => v.toFixed(1), help: "Above this reading it cools at HIGH. Lower is safer and costs more.", showIf: (p) => p.agent === "reflex" },
      { key: "uhigh", label: "HIGH level", min: 0, max: 10, step: 1, default: 8, help: "Cooling level when the reading is above T_set.", showIf: (p) => p.agent === "reflex" },
      { key: "ulow", label: "LOW level", min: 0, max: 10, step: 1, default: 2, help: "Cooling level the rest of the time.", showIf: (p) => p.agent === "reflex" },
      { key: "target", label: "Target (°C)", min: 20, max: 26.5, step: 0.5, default: 24.5, fmt: (v) => v.toFixed(1), help: "The temperature it aims for. Leave a margin under 27 °C.", showIf: (p) => p.agent === "model" || p.agent === "goal" },
      { key: "K", label: "Gain K", min: 0.2, max: 4, step: 0.1, default: 1.5, fmt: (v) => v.toFixed(1), help: "How hard it corrects per degree of error. Too high and it swings.", showIf: (p) => p.agent === "model" || p.agent === "goal" },
      { key: "horizon", label: "Prediction horizon (steps of 10 min)", min: 0, max: 12, step: 1, default: 3, help: "How far ahead it extrapolates the temperature trend.", showIf: (p) => p.agent === "model" },
      { key: "lookahead", label: "Lookahead (steps of 10 min)", min: 0, max: 12, step: 1, default: 4, help: "How far ahead it reads the job schedule. The cooling needs about an hour (6 steps).", showIf: (p) => p.agent === "goal" },

      <p>A data center hall with <b>2 to 4 MW</b> of servers (1 MW = a million watts, about what 750 homes use). Almost all of it becomes heat. The job: keep the air at the server inlets <b>below 27 °C</b> while paying as little as possible for cooling.</p>
      <p><b>Why it is hard:</b> the cooling units <b>ramp slowly</b> (62% of a change after one hour) and the hall stores heat. What you do now shows up later, so the agent has to <b>anticipate</b>, not just react.</p>
      <h3>The vocabulary, applied to our hall</h3>
      <div class="wide"><table>
        <tr><th>Term</th><th>Meaning</th><th>In our hall</th></tr>
        <tr><td><b>Environment</b></td><td>The world the agent acts in</td><td>The hall: servers, outside air, cooling units, electricity tariff</td></tr>
        <tr><td><b>Agent</b></td><td>Perceives through sensors, acts through actuators</td><td>The cooling controller</td></tr>
        <tr><td><b>Percepts</b></td><td>What it reads at each step</td><td>Inlet temperature (one noisy sensor), IT load, outside temperature, price, batch-job schedule</td></tr>
        <tr><td><b>Action</b></td><td>What it can change</td><td>The cooling level, 0 to 10, every 10 minutes: 144 decisions a day</td></tr>
        <tr><td><b>Agent function</b></td><td>The rule, on paper: percept history → action</td><td>"Given everything seen so far, which level now?"</td></tr>
        <tr><td><b>Agent program</b></td><td>The code that implements the function</td><td>Steps 4 to 8: five programs, each smarter than the last</td></tr>
        <tr><td><b>Performance measure</b></td><td>How we judge the agent, from outside</td><td>The day's cost: electricity bill + 1,000 SAR per 10 minutes above 27 °C</td></tr>
        <tr><td><b>Rational</b></td><td>Best <i>expected</i> performance, given what it perceives and knows</td><td>Not omniscient: it cannot know the load in 10 minutes</td></tr>
      </table></div>
      <h3>How we score a day</h3>
      <ul>
        <li><b>Cost</b> = cooling electricity + penalties (1,000 SAR per 10 minutes above 27 °C).</li>
        <li><b>Electricity</b>: power (MW) × time = energy (MWh; 1 MW for 10 minutes = 167 kWh). Energy × tariff = SAR. Tariff per kWh: 0.18 at night (22:00 to 08:00), 0.32 by day, 0.48 at the peak (13:00 to 17:00).</li>
        <li><b>Power grows fast with the level</b>: fan power grows with the cube of the level, so level 10 costs about 2.3 times level 5. Hot outside air makes cooling less efficient.</li>
        <li><b>Budget</b> = the best possible cost of the day (the omniscient agent, which knows the future) + 10%, rounded up to the next 10 SAR. A day ends under budget (good) or over budget (bad).</li>
        <li><b>Money left over 10 days</b> = the sum of (budget − cost). Every later step and the tournament use it.</li>
      </ul>
      <p>Below: the hall diagram (move the sliders), PEAS, and one day with its <b>cost receipt</b> adding up the bill.</p>`,
    ask: `<div class='q'>Ask the class first, then reveal</div>
      <div class='a'>Start with the hall diagram: "How much does cooling cost?" Drag the cooling level and read the panel next to it. At 35 °C outside, level 5 draws 0.59 MW: 587 kWh per hour, 106 SAR per hour at night and 282 at the peak, 4,062 SAR if held all day, close to the 4,150 SAR budget of day 101. "Level 5 vs level 10" shows that doubling the level multiplies the power by 2.3, because the fan power grows with the cube of the level. The edge case "Level 0" shows the meter stop and the inlet temperature run away.</div>
      <div class='a'>"What does the controller see?" (percepts) "What can it do?" (one knob) "How do we judge it?" (bill plus violations, against a budget). Students type a guess in each PEAS row, then press Reveal PEAS: the rows appear one by one, with their guess under the answer.</div>
      <div class='a'>Then press "Play the day" and narrate while the cursor moves: the batch job band, the price ribbon, the cooling rising early. "Slow motion through the batch job" pauses an hour before the job so the class can predict what the agent will do. "The sensor lies a little" shows that the agent never sees the true line; the measure is scored on it anyway.</div>
      <div class='a'>Details if asked (removed from the student text): fans take 0.25 MW × (level ÷ 10)³; the cooling units remove 0.5 MW of heat per level and need about 1 MW of electricity per 5.5 MW of heat, less in hot weather. 27 °C is the ASHRAE A1 recommended inlet limit. Only cooling is billed: the servers' own electricity does not depend on the controller. Real-world hook: in 2016 DeepMind reported cutting Google's data-center cooling energy by about 40% with a learning controller doing this job. Agent function vs program: the function is the abstract mapping (an infinite table over percept histories); the program is the finite code that runs on the controller.</div>
      <div class='a'>Mission targets: a guess in all four PEAS rows, Reveal PEAS, the ▶ Play button under the chart (the example buttons do not count), hovering over the chart during the batch job on day 101 (15:00 to 18:00) and at the peak tariff. Spend a minute on the budget in the theory: every later step reports money left in the budget. Day 101 here costs 3,905 SAR against a budget of 4,150 SAR: 245 SAR under budget.</div>`,
    mount() {
      const peas = [["Performance measure", "Electricity cost of cooling (SAR) + 1000 SAR per 10 minutes with inlet air above 27 °C, compared with the day's budget."], ["Environment", "The hall: servers producing heat (load changes, batch jobs), heat leaking in from outside, cooling units that ramp slowly, a tariff that changes by hour."], ["Actuators", "The cooling level, 0 to 10, set every 10 minutes."], ["Sensors", "One noisy inlet temperature sensor, the IT load meter, the outside temperature, the electricity price, the job schedule."]];
      const state = { guesses: 0, revealed: false, played: false, hoveredJob: false, peakCost: false };
      const m = mission({
        goal: "Describe the cooling agent with PEAS in your own words, check it against the answer, then watch one day of the finished agent and see how its cost adds up.",
        how: [
          "Type your guess in each of the four PEAS rows below: what is the agent judged on, where does it act, what can it change, what can it read?",
          "Press <b>Reveal PEAS</b>. Each row shows the answer with your guess under it; compare them.",
          "Press <b>▶ Play the day</b> under the chart and follow the red time cursor through the 144 decisions. The <b>cost receipt</b> under the chart adds up the bill step by step.",
          "Move the mouse over the chart inside the purple batch-job band (in the afternoon) and read the IT load in the line under the chart.",
          "Move the mouse to a moment between 13:00 and 17:00: the receipt shows what those 10 minutes cost at the peak tariff. Compare with a moment at night.",

        targets: [
          { text: "A guess in all four PEAS rows", test: (s) => s.guesses === 4 },
          { text: "Reveal PEAS and compare", test: (s) => s.revealed },
          { text: "Play the day with the ▶ button under the chart", test: (s) => s.played },
          { text: "Read the load during the batch job (hover over the purple band)", test: (s) => s.hoveredJob },
          { text: "Read the cost of 10 minutes at the peak tariff (hover between 13:00 and 17:00)", test: (s) => s.peakCost },

      });
      const rows = peas.map(([k, v]) => { const inp = h("input", { type: "text", placeholder: "your guess", style: "width:100%" }), td = h("td", {}, inp); inp.addEventListener("input", () => { state.guesses = rows.filter((r) => r.inp.value.trim().length >= 3).length; if (!state.revealed) { btn.disabled = state.guesses < 4; btn.textContent = state.guesses < 4 ? `Reveal PEAS (${state.guesses} of 4 written)` : "Reveal PEAS"; } m.update(state); }); return { tr: h("tr", {}, h("th", {}, k), td), td, inp, v }; });
      const btn = h("button", { class: "ghost", disabled: "" }, "Reveal PEAS (0 of 4 written)");   // unlocks once every row has a guess (3+ characters)
      btn.addEventListener("click", async () => { btn.disabled = true; for (const r of rows) { const g = r.inp.value.trim(); r.td.innerHTML = ""; r.td.append(h("div", {}, r.v), h("div", { class: "note" }, g ? `Your guess: ${g}` : "No guess written.")); pulse(r.tr); await sleep(380); } btn.textContent = "PEAS revealed"; state.revealed = true; m.update(state); });

      /* the hall diagram and its cost panel, driven by two sliders */
      const hs = { level: 5, out: 35 }, hall = hallDiagram(hs), d = day(101), costPanel = coolingCostPanel(hs, budgetOf(d)), hbox = sayBox();
      const lvl = range({ label: "Cooling level (0 to 10)", min: 0, max: 10, step: 1, value: hs.level, onchange: (v) => { hs.level = v; costPanel.update(); } });
      const outT = range({ label: "Outside temperature (°C)", min: 20, max: 48, step: 1, value: hs.out, fmt: (v) => v + " °C", onchange: (v) => { hs.out = v; costPanel.update(); } });
      const hallEx = exampleBox([
        { label: "Level 5 vs level 10", note: "Double the cooling level and watch the meter's needle and the panel. Is the power doubled too?",
          run: async () => { await outT.animateTo(35, 500); await lvl.animateTo(5, 700); const a = coolPower(5, 35); await sleep(800); await lvl.animateTo(10, 1500); const b = coolPower(10, 35); hbox.say(`At 35 °C outside: level 5 draws ${fmt(a, 2)} MW, level 10 draws ${fmt(b, 2)} MW, ${fmt(b / a, 1)} times as much for twice the cooling. The fans grow with the cube of the level, so the last steps are the dearest.`); } },
        { label: "A hot afternoon: 30 to 46 °C", note: "Same cooling level 5, but the outside air heats up. Watch the orange heat leaking in through the wall and the meter.",
          run: async () => { await lvl.animateTo(5, 600); await outT.animateTo(30, 700); const a = coolPower(5, 30); await sleep(600); await outT.animateTo(46, 2200); const b = coolPower(5, 46); hbox.say(`Level 5 draws ${fmt(a, 3)} MW at 30 °C and ${fmt(b, 3)} MW at 46 °C: the cooling units work less efficiently in the heat, and more heat leaks in, so the same level holds a warmer hall.`); } },
        { label: "Level 0: cooling off", kind: "edge", note: "Turn the cooling off. The meter stops, but the servers keep heating. Watch the inlet sensor.",
          run: async () => { await outT.animateTo(35, 500); await lvl.animateTo(0, 1200); const t0 = hall.sim.T; await sleep(5000); hbox.say(`Power ${fmt(coolPower(0, hs.out), 2)} MW and 0 SAR on the meter, but the inlet went from ${fmt(t0, 1)} °C to ${fmt(hall.sim.T, 1)} °C in 5 seconds (about 25 minutes of hall time). Cheap electricity, expensive penalties.`, "edge"); } },
      ], hbox);

      const box = sayBox(), log0 = run(agents.utility(UDEF), d);
      const rc = costReceipt((t, dd) => {
        if (dd === d && d.jobs.some((j) => t >= j.start && t < j.end)) state.hoveredJob = true;
        if (price(t) === 0.48) state.peakCost = true;
        m.update(state);
      });
      const view = rc.attach(dayView("▶ Play the day", { ...rc.hooks, onPlay: () => { state.played = true; m.update(state); } }));
      view.set(d, log0);
      const j0 = Math.min(...d.jobs.map((j) => j.start)), j1 = Math.max(...d.jobs.map((j) => j.end));
      let gap = -Infinity, tg = 0; log0.T.forEach((v, t) => { if (log0.Tm[t] - v > gap) { gap = log0.Tm[t] - v; tg = t; } });
      const ex = exampleBox([
        { label: "Play the day", note: "144 decisions, one every 10 minutes. Follow the red cursor: the cooling level (blue, bottom panel) rises before the purple batch-job band, and the bold inlet line stays under the dashed 27 °C limit. The cost receipt under the chart adds up the bill step by step and compares it with the day's budget.",
          run: async () => { view.set(d, log0); await view.play(9000, 0); box.say(`End of the day: ${res(log0)}.`); } },
        { label: "Slow motion through the batch job", note: "The replay runs fast until an hour before the first job, stops, then crawls through the jobs. Watch the command go up while the temperature is still low: the agent acts on the schedule, not on the thermometer.",
          run: async () => { view.set(d, log0); await view.play(5000, 0, Math.max(0, j0 - 6)); await sleep(1200); await view.play(40000, null, Math.min(STEPS - 1, j1 + 6)); box.say(`During the jobs (${hhmm(j0)} to ${hhmm(j1)}) the inlet peaked at ${fmt(Math.max(...log0.T.slice(j0, j1)), 1)} °C.`); await view.play(5000); } },
        { label: "The sensor lies a little", kind: "edge", note: "The cursor stops at the moment when the reading is furthest above the truth. The performance measure counts the true temperature, which the agent never sees directly.",
          run: async () => { view.set(d, log0); await view.play(6000, 0, tg); box.say(`At ${hhmm(tg)} the sensor reads ${fmt(log0.Tm[tg], 2)} °C but the true inlet is ${fmt(log0.T[tg], 2)} °C, a gap of ${fmt(gap, 2)} °C. A violation is counted only when the true temperature is above 27 °C.`, "edge"); } },
        { label: "A heat wave of 8 °C", kind: "edge", note: "The same agent on the same day, with the outside air 8 °C hotter. Watch the outside-temperature panel lift and the cooling work harder, then compare the bill.",
          run: async () => { const d8 = day(101, { heat: 8 }), l8 = run(agents.utility(UDEF), d8); view.set(d8, l8); await sleep(700); await view.play(7000, 0); box.say(`Normal day: ${res(log0)}, energy ${fmt(log0.energy / 1000, 2)} MWh. Heat wave: ${res(l8)}, energy ${fmt(l8.energy / 1000, 2)} MWh.`, "edge"); await sleep(1800); view.set(d, log0); } },
      ], box);
      return h("div", {}, m,
        h("h3", {}, "The hall, and what cooling costs"),
        h("div", { class: "lab" }, h("div", { class: "controls" }, h("h3", { style: "margin:0" }, "Your controls"), lvl, outT, h("p", { class: "note" }, "The diagram runs a small copy of the simulator: one 10-minute step every 2 seconds, with 2 MW of servers."), hallEx, hbox), h("div", { class: "stage" }, hall.el, costPanel.el)),
        h("h3", {}, "PEAS for the cooling controller"), h("table", {}, ...rows.map((r) => r.tr)), btn,
        h("h3", {}, "One day, controlled by the agent we will have built by step 7"), h("div", { class: "lab" }, h("div", { class: "controls" }, ex, box), h("div", { class: "stage" }, view.el, rc.el, h("p", { class: "note" }, "Notice how it raises the cooling before the batch job starts, not after."))));
    },
  });

  steps.push({
    id: "environment", title: "Properties of the task environment", time: 15,
    mission: true,
    theory: `<h3>Classify before you design</h3>
      <table><tr><th>Property</th><th>Question</th><th>Our hall</th></tr>
      <tr><td>Fully vs partially observable</td><td>Do the sensors give the complete state?</td><td>Partial: one noisy sensor, no view of each rack, no exact future load.</td></tr>
      <tr><td>Single vs multiagent</td><td>Do other agents' choices affect my performance?</td><td>Single (the job scheduler is part of the environment; it could become a second agent).</td></tr>
      <tr><td>Deterministic vs stochastic</td><td>Is the next state fixed by state and action?</td><td>Stochastic: load noise, weather.</td></tr>
      <tr><td>Episodic vs sequential</td><td>Does this action affect later decisions?</td><td>Sequential: heat stored now is heat later.</td></tr>
      <tr><td>Static vs dynamic</td><td>Does the world change while the agent deliberates?</td><td>Dynamic: the hall heats up while we think.</td></tr>
      <tr><td>Discrete vs continuous</td><td>States, time, percepts, actions?</td><td>Continuous temperature and load; we discretized time (10 min) and actions (0 to 10).</td></tr>
      <tr><td>Known vs unknown</td><td>Does the agent know the rules?</td><td>Partly: the physics is known in form, the constants are not (step 8).</td></tr></table>
      <p>Classify four other industrial agents below.</p>`,
    ask: `<div class='a'>Debates worth having: a chess engine is fully observable and deterministic yet still hard (the state space, not the uncertainty). A warehouse robot is multiagent because other robots block its path. Semidynamic: the world is static but the clock runs.</div>
      <div class='a'>Before the quiz, run the four demos on our own hall: the sensor dots (partially observable), the forced hour of cooling whose effect lasts past 08:00 (sequential), five noise draws (stochastic) and the slow decider (dynamic). The "Zero sensor noise" edge case is the good question: with a perfect thermometer, is the hall fully observable? No: the future load and weather are still hidden.</div>
      <div class='a'>The quiz is submitted: students write their name and team at the top, answer the 24 cards without feedback, then press Submit (once per device). Only then do the cards show right or wrong with the reason, and their score. The results are private: open the leaderboard, unlock Admin (TA) with the token, and see "Class activities: Lab 1 step 2 quiz" (names, scores, and how the class answered each card). All 24 answers with reasons are in the cheat sheet (Lab 1, step 2) for the discussion.</div>`,
    mount() {
      const d = day(101), U = () => agents.utility(UDEF), base = run(U(), d);
      const override = () => { const a = U(); const f = (per) => { const u = a(per); return per.t >= 36 && per.t < 42 ? 10 : u; }; f.reset = a.reset; return f; };
      const slow = () => { const a = U(); let held = 2; const f = (per) => { const u = a(per); if (per.t % 3 === 0) held = u; return held; }; f.reset = () => { held = 2; a.reset(); }; return f; };
      const cv = canvas(760, 300), legend = h("div", { class: "legend" }), box = sayBox();
      const truth = { T: base.T, color: "--ink", width: 2.2 };
      let st = { lines: [truth] };
      const draw = () => drawTemps(cv, st);
      const leg = (...items) => { legend.innerHTML = ""; items.forEach(([c, t]) => legend.append(h("span", {}, h("i", { style: `background:${c}` }), t))); };
      leg(["var(--ink)", "true inlet temperature (utility agent, day 101)"], ["rgba(238,138,132,.6)", "above the 27 °C limit"]); draw(); onTheme(draw);
      const ex = exampleBox([
        { label: "Partially observable: what the sensor shows", note: "The bold line is the true inlet temperature. The gray dots appear one by one: they are all the agent gets.",
          run: async () => { st = { lines: [truth], dots: base.Tm, dotsUpto: 0 }; leg(["var(--ink)", "true inlet temperature"], ["rgba(140,152,172,.8)", "sensor readings"]); await tween(3200, (k) => { st.dotsUpto = Math.round(k * (STEPS - 1)); draw(); }); let g = 0, tg = 0; base.T.forEach((v, t) => { const e = Math.abs(base.Tm[t] - v); if (e > g) { g = e; tg = t; } }); box.say(`The largest gap between reading and truth today is ${fmt(g, 2)} °C, at ${hhmm(tg)}. The agent never sees the bold line, and it never sees the load of the next hour unless the schedule tells it.`); } },
        { label: "Sequential: one hour of full cooling", note: "Someone forces the cooling to level 10 from 06:00 to 07:00, then hands control back to the agent. Watch the blue line split from the bold one and stay apart after 07:00.",
          run: async () => { const pert = run(override(), d), alt = { T: base.T.slice(), color: "--lagoon", width: 2.2 }; st = { lines: [truth, alt], cursorLabel: (t) => `${hhmm(t)}  gap ${fmt(pert.T[t] - base.T[t], 2)} °C` }; leg(["var(--ink)", "normal day"], ["var(--lagoon)", "full cooling forced from 06:00 to 07:00"]); await tween(1400, (k) => { alt.T = base.T.map((v, t) => v + (pert.T[t] - v) * k); draw(); }); await tween(4500, (k) => { st.cursor = Math.round(k * (STEPS - 1)); draw(); }); st.cursor = null; draw(); box.say(`At 07:00 the forced hall is ${fmt(base.T[42] - pert.T[42], 1)} °C colder. At 08:00, an hour after the override ended, the gap is ${fmt(base.T[48] - pert.T[48], 1)} °C, because the cooling units ramp down slowly. One action changed the state for hours, so decisions cannot be judged one at a time.`); } },
        { label: "Stochastic: five noise draws", note: "Same day, same agent; only the random sensor noise changes. Each blue line is one possible day.",
          run: async () => { st = { lines: [truth] }; leg(["var(--ink)", "the day above"], ["var(--lagoon)", "same day, different sensor noise"]); const out = []; for (let k = 1; k <= 5; k++) { const r = RNG(9000 + k), lg = run(U(), { ...d, noise: d.noise.map(() => r.normal(0, 0.3)) }), L = { T: lg.T, color: "--lagoon", alpha: 0.6, upto: 0 }; out.push(lg); st.lines.push(L); await tween(700, (q) => { L.upto = Math.round(q * (STEPS - 1)); draw(); }); } const pk = out.map((l) => l.peak); box.say(`Peaks over the five runs: from ${fmt(Math.min(...pk), 2)} to ${fmt(Math.max(...pk), 2)} °C. Costs: ${out.map((l) => fmt(l.cost, 0)).join(", ")} SAR. The next state is not fixed by the state and the action alone.`); } },
        { label: "Zero sensor noise", kind: "edge", note: "Shrink the sensor noise to nothing. The dots fall onto the bold line. Is the hall now fully observable?",
          run: async () => { const zero = run(U(), { ...d, noise: new Array(STEPS).fill(0) }), line2 = { T: base.T, color: "--ink", width: 2.2 }; st = { lines: [line2], dots: base.Tm.slice() }; leg(["var(--ink)", "true inlet temperature"], ["rgba(111,124,144,.7)", "sensor readings"]); await tween(1800, (k) => { st.dots = base.T.map((v, t) => v + (base.Tm[t] - v) * (1 - k)); draw(); }); await tween(900, (k) => { line2.T = base.T.map((v, t) => v + (zero.T[t] - v) * k); st.dots = line2.T; draw(); }); box.say(`With a perfect sensor: ${res(zero)}. With the noisy one: ${res(base)}. The readings are now exact, but the agent still cannot see the load or the weather an hour ahead, so the hall stays partially observable.`, "edge"); } },
        { label: "Deliberating for 30 minutes", kind: "edge", note: "The same agent, but each decision takes 30 minutes, so the level can change only every third step. The hall keeps changing while it thinks: watch the purple line.",
          run: async () => { const sl = run(slow(), d), alt = { T: base.T.slice(), color: "#8f7fe8", width: 2.2 }; st = { lines: [truth, alt] }; leg(["var(--ink)", "decides every 10 minutes"], ["#8f7fe8", "decides every 30 minutes"]); await tween(1500, (k) => { alt.T = base.T.map((v, t) => v + (sl.T[t] - v) * k); draw(); }); box.say(`Deciding every 10 minutes: ${res(base)}. Deciding every 30 minutes: ${res(sl)}. The environment is dynamic: thinking time has a price.`, "edge"); } },
      ], box);
      const O = { obs: ["Fully observable", "Partially observable"], ag: ["Single agent", "Multiagent"], det: ["Deterministic", "Stochastic"], ep: ["Episodic", "Sequential"], st: ["Static", "Semidynamic", "Dynamic"], dc: ["Discrete", "Continuous"] };
      /* one card per property; every card has its own answer and its own reason. key: the short label stored with a submission */
      const PROP = { obs: "Observable", ag: "Agents", det: "Deterministic", ep: "Episodic", st: "Static", dc: "Discrete" };
      const mk = (name, props) => Object.entries(O).map(([k, opts]) => ({ q: `${name}: ${opts.join(" / ")}`, key: `${name.split(" (")[0]} · ${PROP[k]}`, options: opts, answer: props[k][0], why: props[k][1] }));
      const qz = quiz([
        ...mk("Warehouse picking robot (fulfillment center)", {
          obs: ["Partially observable", "Its cameras see only the aisle in front of it. Shelves hide other robots and people around the corner, and it cannot see inside closed bins."],
          ag: ["Multiagent", "Other robots and human pickers share the aisles. Their routes block or free its path, so their choices change how well it does."],
          det: ["Stochastic", "A person can step into the aisle, an item can slip from the gripper, a wheel can slip: the same action does not always lead to the same next state."],
          ep: ["Sequential", "The route it takes now decides where it is for the next pick. One detour delays every order after it."],
          st: ["Dynamic", "Robots and people keep moving while it plans its path, so a slow plan is already out of date when it starts driving."],
          dc: ["Continuous", "Position, speed and arm angles are real numbers that change smoothly over time."],
        }),
        ...mk("Defect-detection camera on a bottling line", {
          obs: ["Fully observable", "The photo of the bottle in front of the lens holds everything needed to judge that bottle: cracks, fill level and cap are all visible."],
          ag: ["Single agent", "It inspects alone. Nothing else on the line chooses actions that change how well it classifies."],
          det: ["Deterministic", "The bottle does not change because the camera looked at it, and the image fully decides the verdict. What comes next (the next bottle) does not depend on the verdict."],
          ep: ["Episodic", "Each bottle is a separate episode: rejecting this one does not change the next bottle or the next decision."],
          st: [["Static", "Semidynamic"], "Static: nothing in the photo changes while it decides. Semidynamic is also accepted: the line keeps moving, so a slow decision misses the reject gate. Time is penalized, but the image itself does not change."],
          dc: ["Continuous", "Pixel brightness and the size and position of a defect are measurements on a continuous scale, even if the camera stores them with many discrete levels."],
        }),
        ...mk("Cloud autoscaler (adds or removes servers)", {
          obs: ["Partially observable", "It sees the current CPU load and request rate, but not the traffic of the next hour or why a spike started."],
          ag: [["Single agent", "Multiagent"], "Single agent is the usual answer: the users are part of the environment. Multiagent is also accepted: other customers' autoscalers compete for the same machines, and attackers may try to trigger useless scaling."],
          det: ["Stochastic", "Traffic comes from users it cannot predict exactly, so the same scaling action can meet very different load."],
          ep: ["Sequential", "A server started now takes minutes to boot and is paid for afterwards, so each decision limits and shapes the next ones."],
          st: ["Dynamic", "Requests keep arriving while it decides. Waiting is itself a choice, and it drops traffic."],
          dc: [["Discrete", "Continuous"], "Discrete: the action is a whole number of servers. Continuous is also accepted: load, latency and time are continuous, and many designs treat capacity as a real number."],

  steps.push({

    mount() {

        goal: "Write a cooling plan for day 131 that stays within the day's budget of <b>3,480 SAR</b>, and then ends at least <b>200 SAR under budget</b>.",

          "Drag all twelve sliders to the same level and find the lowest level that gives 0 minutes above 27 °C. It is safe, but over budget.",
          "From there, lower one slider by one step at a time. If red appears, put it back and try the next block. Night blocks (00:00 to 06:00) are the cheapest to lower; the blocks around the job and the afternoon need more.",

      function evaluate() {

        view.set(d, log);
        setMetrics(out, [["Budget today (SAR)", fmt(budget, 0)], ["Your cost (SAR)", fmt(log.cost, 0), log.cost <= budget ? "good" : "bad"], [log.cost <= budget ? "Under budget by (SAR)" : "Over budget by (SAR)", fmt(Math.abs(budget - log.cost), 0), log.cost <= budget ? "good" : "bad"], ["Minutes above 27 °C", log.viol * 10, log.viol ? "bad" : "good"], ["Energy (MWh)", fmt(log.energy / 1000, 2)], ["Your best so far (SAR)", fmt(bestCost, 0)]]);

      const omni = refLog(d).u, omniPlan = Array.from({ length: 12 }, (_, b) => Math.ceil(mean(omni.slice(b * 12, b * 12 + 12))));   // block averages, rounded up as a safety margin
      const ex = exampleBox([
        { label: "A flat plan: level 4 all day", note: "The sliders move to 4, then the day replays. Watch the afternoon: the load and the outside heat rise, the plan does not.",

        { label: "The omniscient plan squeezed into 2-hour blocks", note: "The omniscient agent changes the level every 10 minutes. The sliders allow one level per 2 hours, so they move to its average level in each block, rounded up (rounding down overheats the hall). Watch the level rise ahead of the batch job and the afternoon heat.",

      return h("div", {}, m, h("div", { class: "lab" },
        h("div", { class: "controls" }, h("h3", { style: "margin:0" }, "Your controls"), h("p", { class: "note", style: "margin:0" }, "Cooling level for each 2-hour block of day 131 (0 = off, 10 = full)."), ...sliders, h("div", { class: "btns" }, runBtn), ex, box),

  steps.push({

      <p>A simple reflex agent has no memory and no model: it maps the current percept straight to an action. It is correct only when the current percept contains everything that matters. Here it does not. The cooling units take about an hour to ramp and the hall stores heat, so by the time the sensor says "hot" it is too late, and by the time it says "cold" the cooling is still running hard. On the chart, the thin steps in the bottom panel are the level the rule commands (they jump between LOW and HIGH), and the blue area is the level the cooling units have actually reached. Watch the sawtooth in the top panel: it overshoots the limit, then overcools, and the noisy sensor makes the command flicker.</p>
      <p>Before agent programs the lecture mentions the <b>table-driven agent</b>: a lookup table from percept sequences to actions. With a few hundred possible readings, loads and prices, and 144 steps a day, the table would be astronomically large. Rules replace tables; models replace rules.</p>`,
    ask: `<div class='a'>Ask: "What T_set would you pick?" Low enough to avoid violations wastes energy all day. Then switch on a heat wave: the same rule now violates. Ask why: the rule cannot know that today the outside heat load is bigger. A reflex agent cannot adapt to what it does not perceive.</div>
      <div class='a'>Measured on day 101: with HIGH 8 no T_set from 20 to 28 reaches zero violations (best 60 minutes, at T_set 20 or 20.5). With HIGH 10, T_set 22.5 is the highest with zero violations. The edge case "HIGH equals LOW" turns the rule into open-loop control; "T_set at the limit" shows why reacting at 27 °C is already too late.</div>

  steps.push({
    id: "model", title: "Agent 2: model-based reflex", time: 15,
    mission: true,
    theory: `<h3>Keep an internal state, use a model</h3>
      <p>A model-based reflex agent maintains an <b>internal state</b> from the percept history and updates it with two pieces of knowledge: a <b>sensor model</b> (how percepts relate to the true state) and a <b>transition model</b> (how the world evolves and how actions change it). Ours keeps a filtered temperature, its slope, and its own last command:</p>
      <pre>T_filtered  = 0.5 × T_filtered + 0.5 × sensor        # sensor model: average out the noise
slope       = T_filtered − previous T_filtered       # how fast the hall is heating
T_predicted = T_filtered + slope × horizon           # transition model: where we are heading
command     = command + K × (T_predicted − target)   # adjust the level, do not jump</pre>
      <p>The dashed line is the agent's belief: its predicted temperature. It acts on that instead of the raw reading, so it starts cooling before the limit is hit and stops before it overcools. Try horizon 0 (pure feedback) against 3 and 6; try a gain K that is too high.</p>`,

      <div class='a'>Use "Look further ahead" to show the dashed belief running ahead of the bold line, and "Play: belief against truth" to narrate one hour at a time. The edge case "Gain too high" counts how often the command changes direction: the count rises with K, which is the oscillation the deeper box explains. "Target just under the limit" gives 360 minutes above 27 °C on day 101.</div>
      <div class='a'>Mission, measured on day 101 (examples never tick targets): zero minutes with target 23, K 1.5, horizon 5 (3,979 SAR) or target 22, K 4, horizon 4. A loss under 1,500 SAR over the 10 practice days: 22.5/4/4 (−628 SAR), 22/4/4 (−1,114), 21.5/1.5/8 (−1,306); no setting stays within budget on all 10 days. 40 or more direction changes: target 24, K 1.5, horizon 7 (46) or horizon 8 (52), K 1.4, horizon 6 (42); 105 settings at target 24 reach it. The examples end at 34 (horizon 6), 32 (K 4), 16 (defaults) and 14 (target 26.5) direction changes, lose at least 35,000 SAR over 10 days, and none of them has zero minutes on day 101.</div>`,

      mission: {
        goal: "Make the model-based agent keep day 101 at <b>zero minutes above 27 °C</b>, lose less than <b>1,500 SAR</b> of budget over the 10 practice days, and find settings where its command oscillates.",

          "Drag <b>Target</b> down to 23: the agent aims lower and keeps a margin for the batch jobs it cannot see coming. Watch <b>Minutes above 27 °C</b> reach 0.",
          "For the 10 days, drag <b>Target</b> to 22 or 22.5 and try <b>Gain K</b> between 2 and 4 with a horizon of 4 to 8; watch <b>Money left over 10 days</b> climb toward zero.",
          "For the oscillation, set the target back to 24 and drag the horizon to 7 or 8: the extrapolated noise makes the command (thin steps, bottom panel) slam up and down. The count is in the line under the chart.",
        ],
        targets: [
          { text: "Zero minutes above 27 °C on day 101", test: (s) => s.log.viol === 0 },
          { text: "Lose less than 1,500 SAR of budget over the 10 practice days", test: (s) => s.ev.left > -1500 },
          { text: "Make it oscillate: the command changes direction 40 times or more on day 101", test: (s) => turns(s.log.u) >= 40 },
        ],

      examples: (A) => [
