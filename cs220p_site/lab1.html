  steps.push({
    id: "goal", title: "Agent 3: goal-based (pre-cool for the batch job)", time: 15,
    mission: true,
    theory: `<h3>Act on what the future requires</h3>
      <p>A goal-based agent has a <b>goal</b> ("inlet air never above 27 °C, including when the scheduled batch job starts") and uses its model to work out which action now leads to the goal later. It looks ahead through the schedule, finds the largest load coming within its lookahead window, and computes from the transition model how much cooling that load will need:</p>
      <pre>L_max    = largest load in the next LOOKAHEAD minutes (from the schedule)
Q_needed = L_max + k_env × (T_outside − target)         # heat that must be removed
command  = Q_needed / gain + K × (T_filtered − target)  # feed-forward from the goal, plus a small correction</pre>
      <p>With a long enough lookahead the cooling is already up when the job starts, so the temperature barely moves. This is the lecture's message: goals plus a model let the agent choose actions by their <i>consequences</i>, which in general needs <b>search or planning</b>, the subject of the next lecture. Try lookahead 0 (no anticipation) vs 4 or 6 steps.</p>
      <p>What a goal cannot do: say how much a bit more energy is worth against a bit more risk. It is binary. That is what utilities add.</p>`,
    ask: `<div class='a'>Ask how far ahead the agent must look, given that the cooling units need about an hour to make most of a change. Measured on day 101 with target 24: lookahead 0 gives 120 minutes above the limit, and 6 steps (60 minutes) is the smallest lookahead with zero violations, the same as the ramp time. Then ask: "Is pre-cooling an hour early rational?" It avoids the violation but burns energy; the agent has no way to weigh that. Lead into utility.</div>
      <div class='a'>Examples: "Lookahead 0 to 6" and "Slow motion through the batch job" (the replay stops an hour before the first job). Edge cases: K = 0 trusts the model blindly (70 minutes above the limit at target 24, lookahead 6), and a target of 26.5 leaves no margin.</div>
      <div class='a'>Mission, measured on day 101 (budget 4,150 SAR; examples never tick targets): running cold instead of looking ahead also works, at a price: zero minutes with lookahead 3 or less, for example target 22, lookahead 3, K 1.5 (4,059 SAR, 91 under budget) or target 21, lookahead 0, K 1.5 (4,122 SAR). At least 280 SAR under budget: target 25.5, lookahead 7, K 1 (3,848 SAR, 302 under) or 26/8/0.5 (3,865, 285 under), cheaper than the utility agent's 3,905. Within budget on all 10 days with at least 1,800 SAR left: 26/8/0.5 (1,985 SAR), 25.5/7/1 (1,926), 25.5/8/1 (1,888). The examples end at target 24 with lookahead 6 (zero minutes but 191 SAR under budget and 562 SAR left over 10 days) or with violations, so none of them meets a target.</div>`,
    mount: () => agentStep({
      make: (p) => agents.goal(p.target, p.lookahead, p.K),
      params: [{ key: "target", label: "Target (°C)", min: 20, max: 26.5, step: 0.5, default: 25, fmt: (v) => v.toFixed(1) }, { key: "lookahead", label: "Lookahead (steps of 10 min)", min: 0, max: 12, step: 1, default: 4 }, { key: "K", label: "Correction gain K", min: 0, max: 4, step: 0.1, default: 1.5, fmt: (v) => v.toFixed(1) }],
      help: "<b>Target</b>: the temperature the agent plans to hold. <b>Lookahead</b>: how many 10-minute steps of the job schedule it reads ahead; it prepares for the largest load in that window. <b>Correction gain K</b>: how strongly it corrects with the thermometer when the plan is off. Every change is simulated at once on day 101.",
      mission: {
        goal: "Find two ways to keep day 101 at <b>zero minutes above 27 °C</b> (running cold, or looking ahead), then use the schedule to finish day 101 at least <b>280 SAR under budget</b> and stay <b>within budget on all 10 days</b> with at least 1,800 SAR left.",
        how: [
          "Drag <b>Lookahead</b> to 0: the agent learns of the purple batch job only when it starts, and the bold line crosses the dashed limit.",
          "First way, run cold: keep the lookahead at 3 or less and drag <b>Target</b> down (23, 22.5, 22) until <b>Minutes above 27 °C</b> shows 0. Note the cost.",
          "Second way, look ahead: drag the lookahead up step by step and watch the blue cooling level rise <i>before</i> the purple band. Now you can raise the target again.",
          "To save money, run warmer with foresight: <b>Target</b> 25 to 26, <b>Lookahead</b> 7 or 8, <b>Correction gain K</b> 0.5 to 1. Keep the minutes at 0 and watch <b>Under budget by</b> grow past 280 SAR.",
          "Check <b>Days within budget</b> and <b>Money left over 10 days</b>: good settings on day 101 should also hold on the other days.",
        ],
        targets: [
          { text: "Zero minutes on day 101 with a lookahead of 3 steps or less (run cold)", test: (s) => s.log.viol === 0 && s.p.lookahead <= 3 },
          { text: "At least 280 SAR under budget on day 101", test: (s) => s.left >= 280 },
          { text: "Within budget on all 10 days, with at least 1,800 SAR left", test: (s) => s.ev.within === PRACTICE.length && s.ev.left >= 1800 },
        ],
      },
      examples: (A) => [
        { label: "Lookahead 0 to 6 (target 24)", note: "Watch the blue cooling level in the bottom panel start rising earlier, ahead of the purple batch-job band, as the lookahead grows.",
          run: async () => { const a = (await A.reset({ target: 24, lookahead: 0 })).log; const b = (await A.glide("lookahead", 6, 2000)).log; A.say(`Lookahead 0: ${res(a)}. Lookahead 6 (one hour): ${res(b)}.`); } },
        { label: "Slow motion through the batch job", note: "Target 24, lookahead 6. The replay stops an hour before the first job; watch the command step up while the temperature is still low, then crawl through the job.",
          run: async () => { const r = await A.reset({ target: 24, lookahead: 6 }); const j0 = Math.min(...r.d.jobs.map((j) => j.start)), j1 = Math.max(...r.d.jobs.map((j) => j.end)); await A.view.play(5000, 0, Math.max(0, j0 - 6)); await sleep(1200); await A.view.play(40000, null, Math.min(STEPS - 1, j1 + 6)); A.say(`Command one hour before the job: ${r.log.u[Math.max(0, j0 - 6)]}; at the start of the job: ${r.log.u[j0]}. Peak during the jobs: ${fmt(Math.max(...r.log.T.slice(j0, j1)), 1)} °C.`); await A.view.play(5000); } },
        { label: "No correction: K = 0", kind: "edge", note: "With K = 0 the agent trusts its model completely and ignores the thermometer. Any error in the steady-state calculation is never corrected.",
          run: async () => { const a = (await A.reset({ target: 24, lookahead: 6 })).log; const b = (await A.glide("K", 0, 1500)).log; A.say(`K 1.5: ${res(a)}. K 0: ${res(b)}. Feed-forward alone is open loop again; a little feedback fixes what the model gets wrong.`, "edge"); } },
        { label: "Target near the limit (26.5)", kind: "edge", note: "The goal is still 27 °C, but the agent aims only 0.5 °C below it. Watch the noise and the slow cooling units push it over.",
          run: async () => { const a = (await A.reset({ target: 24, lookahead: 6 })).log; const b = (await A.glide("target", 26.5, 1500)).log; A.say(`Target 24: ${res(a)}. Target 26.5: ${res(b)}.`, "edge"); } },
      ],
    }),
  });

  steps.push({
    id: "utility", title: "Agent 4: utility-based (cost vs risk)", time: 20,
    mission: true,
    theory: `<h3>Choose the action with the highest expected utility</h3>
      <p>The utility function is the agent's internalized performance measure. Every 10 minutes the agent tries all 11 cooling levels, simulates each one over a short horizon with its model, and scores the outcome:</p>
      <pre>for each level u in 0..10:
    simulate H steps with the model (schedule, outside temp, price)
    cost  = electricity for those steps (at the price of each hour)
          + w_viol × 1000 SAR × P(temperature &gt; 27 °C)      # expected penalty, from the model
          + w_wear × |u − previous u|                          # equipment wear from big swings
    U(u) = −cost
choose the u with the highest U</pre>
      <p>Two things fall out of this that no earlier agent could do. It decides <b>how close to the limit to run</b>: w_viol is its risk aversion. With w_viol = 1 it is risk-neutral (it uses the true expected penalty); with 0 it is reckless; with 3 it is paranoid and overspends. And it prices every decision with the tariff of the hour, so it spends less cooling when electricity is expensive and more when it is cheap. The horizon H must cover the cooling units' ramp: with H = 3 the agent cannot see the consequences of its own actions and fails; with H = 6 (one hour) it works. Compare the bill with the goal-based agent.</p>`,
    ask: `<div class='a'>Ask students to predict what happens at w_viol = 0 before you drag it. Then drag H to 3 and ask why a lookahead shorter than the cooling ramp is useless. Ask what a rational w_viol is when the performance measure is money (1.0: exactly the expected cost) and why a real operator might still choose 2 (a violation also costs reputation, not in the measure).</div>
      <div class='a'>Measured on day 101: w_viol 0 gives 1,320 minutes above the limit (it switches the cooling off), H = 3 gives 460 minutes, H = 6 none. In an 8 °C heat wave H 6 gives 430 minutes while H 11 has none ("A heat wave of 8 °C"). Worth telling for the tournament: on practice day 110 (not shown on this page) H = 12 makes the agent give up. It assumes the peak load for two hours, every level looks doomed, the penalty term is the same for all of them, and it picks level 0 (460 minutes above the limit; H = 11 has none). A utility that saturates stops guiding the choice.</div>
      <div class='a'>Mission, measured on day 101 (budget 4,150 SAR; examples never tick targets): at least 270 SAR under budget with zero minutes: w_viol 1.2, H 5 (3,872 SAR, 278 under), w_viol 0.4, H 6 (3,874, 276 under), w_viol 1.5, H 5 (3,879, 271 under); the defaults give 245 under. At least 1,450 SAR left over 10 days: w_viol 0.5, H 6 (1,568), 0.6/6 (1,514); the defaults give 1,348 and w_viol 0.3 loses 39,939 SAR on one bad day. Zero minutes in a 5 °C heat wave: H 7 or H 8 with w_viol 1 (H 6 gives 10 minutes). The examples use w_viol 1, 2 and 3 (219 to 245 SAR under budget, 1,028 to 1,348 SAR left), H 3, w_viol 0 and an 8 °C heat wave at H 6, so none of them meets a target.</div>`,
    mount: () => agentStep({
      make: (p) => agents.utility({ wviol: p.wviol, horizon: p.horizon, wwear: p.wwear }),
      params: [{ key: "wviol", label: "w_viol (risk aversion)", min: 0, max: 3, step: 0.1, default: 1.0, fmt: (v) => v.toFixed(1) }, { key: "horizon", label: "Horizon H (steps of 10 min)", min: 1, max: 12, step: 1, default: 6 }, { key: "wwear", label: "w_wear", min: 0, max: 3, step: 0.1, default: 0, fmt: (v) => v.toFixed(1) }],
      heat: true,
      help: "<b>w_viol</b>: how much the agent fears a violation (1 = exactly its expected cost in SAR). <b>Horizon H</b>: how many 10-minute steps ahead it simulates each cooling level. <b>w_wear</b>: a cost it adds for changing the level; it is not part of the bill. <b>Heat wave</b>: makes the outside air hotter all day. Every change is simulated at once on day 101.",
      mission: {
        goal: "Balance money against risk: finish day 101 at least <b>270 SAR under budget</b>, keep at least <b>1,450 SAR</b> of budget over 10 days, and keep zero minutes on day 101 in a <b>5 °C heat wave</b>.",
        how: [
          "The starting settings (w_viol 1, H 6) keep day 101 safe for 3,905 SAR. Read the bill and the peak temperature under the chart.",
          "Drag <b>w_viol</b> down slowly: the agent fears violations less, runs closer to 27 °C and spends less. Watch <b>Under budget by</b> grow, and stop before red bands appear. Try <b>Horizon H</b> 5 as well.",
          "For the 10 days, try <b>w_viol</b> between 0.5 and 0.8 with <b>Horizon H</b> 6 and watch <b>Money left over 10 days</b>. Too low a w_viol saves on most days but loses thousands on one bad day.",
          "Drag <b>Heat wave</b> to 5: at H 6 the hall slips over the limit once. Then drag <b>Horizon H</b> up one step at a time until the red band disappears: a longer horizon plans the pre-cooling in time.",
          "Keep <b>w_wear</b> at 0 unless you want to see what smoothing costs: wear is not part of the performance measure.",
        ],
        targets: [
          { text: "At least 270 SAR under budget on day 101 (no heat wave)", test: (s) => s.heat === 0 && s.log.viol === 0 && s.left >= 270 },
          { text: "At least 1,450 SAR of budget left over 10 days (no heat wave)", test: (s) => s.heat === 0 && s.ev.left >= 1450 },
          { text: "Zero minutes on day 101 in a heat wave of 5 °C or more", test: (s) => s.heat >= 5 && s.log.viol === 0 },
        ],
      },
      examples: (A) => [
        { label: "Risk aversion: w_viol 1, 2, 3", note: "The slider stops at each value. Watch the peak temperature move away from the limit as w_viol grows, and what that costs.",
          run: async () => { const r = [[1, (await A.reset({ wviol: 1 })).log]]; r.push([2, (await A.glide("wviol", 2, 1200)).log]); await sleep(600); r.push([3, (await A.glide("wviol", 3, 1200)).log]); A.say(r.map(([w, l]) => `w_viol ${w}: cost ${fmt(l.cost, 0)} SAR, peak ${fmt(l.peak, 1)} °C, ${l.viol * 10} minutes above 27 °C`).join("<br>")); } },
        { label: "Shorten the horizon: H 6 to 3", note: "With H = 3 the agent looks only 30 minutes ahead, less than the cooling units need to respond. Watch it stop cooling and the red bands spread.",
          run: async () => { const a = (await A.reset()).log; const b = (await A.glide("horizon", 3, 1500)).log; A.say(`H 6: ${res(a)}. H 3: ${res(b)}. Every level looks the same over 30 minutes, so the cheapest wins.`); } },
        { label: "Play the day against the tariff", note: "Watch the cooling level against the colored tariff ribbon at the bottom, and the cost receipt under the chart. Every option is priced at each hour's tariff before the agent chooses.",
          run: async () => { const r = await A.reset(); await A.view.play(9000, 0); A.say(`${res(r.log)}, ${vsBudget(r.left)} (budget ${fmt(r.budget, 0)} SAR).`); } },
        { label: "w_viol = 0: no fear of violations", kind: "edge", note: "With w_viol = 0 the utility contains only the electricity bill. Watch what the cheapest action is.",
          run: async () => { await A.reset(); const b = (await A.glide("wviol", 0, 1500)).log; A.say(`${res(b)}, energy ${fmt(b.energy / 1000, 2)} MWh. The agent is perfectly rational for its utility; the utility is wrong.`, "edge"); } },
        { label: "A heat wave of 8 °C", kind: "edge", note: "The hottest day the slider allows, with the starting settings (H 6). Watch the afternoon: the agent sees the danger too late to pre-cool.",
          run: async () => { const a = (await A.reset()).log; const b = (await A.glide("heat", 8, 1800)).log; A.say(`Normal day: ${res(a)}. Heat wave +8 °C at H 6: ${res(b)}. The horizon that was enough on a normal day is too short on an extreme one.`, "edge"); } },
      ],
    }),
  });

  steps.push({
    id: "learning", title: "Agent 5: learning the model from data", time: 15,
    mission: true,
    theory: `<h3>When the designer's model is wrong</h3>
      <p>So far the agents used the hall's true thermal constants: thermal mass, heat leak, cooling per level. In practice the designer <i>guesses</i> them from the building plans, and the guess is off (here: thermal mass 75% too high, heat leak too low, cooling gain 25% too high, so it believes the hall heats slowly and the cooling units are strong). A utility agent with the wrong model runs the cooling at the wrong level. A learning agent fixes the model from logged days. Its four components:</p>
      <table><tr><th>Component</th><th>In our controller</th></tr>
      <tr><td>Performance element</td><td>the utility-based agent that picks the cooling level</td></tr>
      <tr><td>Critic</td><td>compares predicted and measured temperature changes (the performance standard is the physics)</td></tr>
      <tr><td>Learning element</td><td>fits the three constants by least squares on the logged transitions: ΔT = (Δt / C) × (load + k (T_out − T) − gain × cooling level reached)</td></tr>
      <tr><td>Problem generator</td><td>the logged days came from a deliberately crude thermostat that swings the cooling up and down: informative experiments, not optimal days</td></tr></table>
      <p>Drag the training days from 0 to 10 and watch the estimated constants converge to the true ones, and the bill and violations drop. This is the autonomy the lecture talks about: the agent relies less on its designer's prior knowledge and more on its own experience.</p>`,
    ask: `<div class='a'>Ask why the logged days used a crude controller (a good controller holds the temperature flat, which teaches nothing about the dynamics: no variation, no information). That is the exploration vs exploitation trade-off. Ask what else the agent could learn (the load pattern, the weather forecast, sensor bias).</div>
      <div class='a'>Measured on day 101: with 0 days (the designer's guess) the agent spends 70 minutes above the limit, 50 with 1 day, 20 with 2 days, none from 3 days on; from 4 days on the learned constants equal the true ones. "Log more days" animates the bars converging; the edge case "Only one day of data" shows the estimate moving only part of the way.</div>
      <div class='a'>Mission, measured on day 101 (examples never tick targets): the fewest logged days with the true constants is 4 (heat wave 0). Zero minutes with 3 days or fewer: exactly 3 days (3,874 SAR, 276 under budget). Money left over 10 days (w_viol 1): −8,699 SAR with 0 days, −3,866 with 1, −11 with 2, 1,680 with 3, 1,348 from 4 days on; at least 1,600 is reached with 3 days (1,680; with w_viol 0.5, 1,880). The 3-day model is slightly wrong but happens to be a little more cautious, which pays on these days: worth a question. The examples end at 10 days (1,348 SAR left), at 4 days in a 5 °C heat wave, at 0 days and at 1 day, so none of them meets a target.</div>`,
    mount() {
      const bars = canvas(760, 180); let shown = { ...GUESS }, btok = 0, shownDays = 0;
      const drawBars = (m, days) => { const P = palette(), ctx = bars.getContext("2d"); ctx.clearRect(0, 0, 760, 180); ctx.font = "12px Public Sans, system-ui"; ctx.textBaseline = "alphabetic"; [["thermal mass C (MWh/°C)", TRUE.cth, m.cth, 1.6], ["heat leak k (MW/°C)", TRUE.kenv, m.kenv, 0.14], ["cooling gain (MW per level)", TRUE.gain, m.gain, 0.8]].forEach(([n, tv, ev, mx], i) => { const x = 20 + i * 250; ctx.strokeStyle = P.grid; ctx.beginPath(); ctx.moveTo(x - 4, 150.5); ctx.lineTo(x + 134, 150.5); ctx.stroke(); ctx.fillStyle = P.dark ? "#7d8aa3" : "#aab5c7"; ctx.fillRect(x, 150 - (tv / mx) * 120, 60, (tv / mx) * 120); ctx.fillStyle = P.cool; ctx.fillRect(x + 70, 150 - (ev / mx) * 120, 60, (ev / mx) * 120); ctx.fillStyle = P.ink; ctx.fillText(n, x, 170); ctx.fillStyle = P.label; ctx.fillText(`true ${tv}`, x, 145 - (tv / mx) * 120); ctx.fillText(`${days ? "learned" : "guess"} ${ev.toFixed(2)}`, x + 70, 145 - (ev / mx) * 120); }); };
      const animateBars = (m, days) => { const my = ++btok, from = { ...shown }; shownDays = days; tween(450, (k) => { if (my !== btok) return; shown = { cth: from.cth + (m.cth - from.cth) * k, kenv: from.kenv + (m.kenv - from.kenv) * k, gain: from.gain + (m.gain - from.gain) * k }; drawBars(shown, days); }); };
      drawBars(shown, 0); onTheme(() => drawBars(shown, shownDays));
      return agentStep({
        make: (p) => agents.utility({ wviol: p.wviol, horizon: 6, wwear: 0 }, learnModel(p.days)),
        params: [{ key: "days", label: "Training days logged", min: 0, max: 10, step: 1, default: 0 }, { key: "wviol", label: "w_viol", min: 0, max: 3, step: 0.1, default: 1.0, fmt: (v) => v.toFixed(1) }],
        heat: true,
        help: "<b>Training days logged</b>: how many logged days the agent fits its model on (0 = the designer's guess). <b>w_viol</b>: its fear of violations, as in step 7. <b>Heat wave</b>: makes the outside air hotter all day. The bars under the chart compare the agent's model with the truth.",
        after: (p) => animateBars(learnModel(p.days), p.days),
        mission: {
          goal: "Let the agent learn its model: find the <b>fewest logged days</b> that give the true constants, keep day 101 at <b>zero minutes</b> with even fewer, and keep at least <b>1,600 SAR</b> of budget over 10 days.",
          how: [
            "Start at 0 training days: the agent uses the designer's guess. Compare the blue bars (its model) with the gray bars (the truth) under the chart, and note the red bands.",
            "Drag <b>Training days logged</b> up one day at a time and watch the blue bars move. Stop at the first value where all three match the gray bars (heat wave at 0).",
            "Drag it back down one day at a time: find the fewest days that still give 0 minutes above 27 °C on day 101. The model does not have to be perfect to be good enough.",
            "Then watch <b>Money left over 10 days</b>: try 3 days, and <b>w_viol</b> values below 1, until at least 1,600 SAR are left.",
          ],
          targets: [
            { text: "The fewest logged days that give the true constants (no heat wave)", test: (s) => s.heat === 0 && s.p.days === 4 },
            { text: "Zero minutes on day 101 with 3 logged days or fewer (no heat wave)", test: (s) => s.heat === 0 && s.log.viol === 0 && s.p.days <= 3 },
            { text: "At least 1,600 SAR of budget left over 10 days (no heat wave)", test: (s) => s.heat === 0 && s.ev.left >= 1600 },
          ],
        },
        below: h("div", {}, h("h3", {}, "Thermal constants: true vs the agent's model"), bars, themedLegend([[(P) => (P.dark ? "#7d8aa3" : "#aab5c7"), "true value"], [(P) => P.cool, "the agent's model"]])),
        examples: (A) => [
          { label: "Log more days: 0 to 10", note: "Watch the blue bars (the agent's model) slide to the gray bars (the truth), and the red bands on the chart disappear.",
            run: async () => { const a = (await A.reset()).log; const b = (await A.glide("days", 10, 2600)).log; A.say(`0 days (the designer's guess): ${res(a)}. 10 days: ${res(b)}.`); } },
          { label: "Guess against learned on a heat wave", note: "A 5 °C heat wave, first with the designer's guess, then with a model fitted on 4 logged days.",
            run: async () => { const a = (await A.reset({ heat: 5 })).log; const b = (await A.glide("days", 4, 1500)).log; A.say(`Heat wave with the guess: ${res(a)}. With 4 days of data: ${res(b)}.`); } },
          { label: "No data: 0 training days", kind: "edge", note: "With no logged days the learner has nothing to fit, so the agent falls back on the designer's guess. Play the day and watch where the wrong model lets the hall overheat.",
            run: async () => { const r = await A.reset({ days: 0 }); await A.view.play(8000, 0); A.say(`With the guess only: ${res(r.log)}. The guess says the hall heats slowly and the cooling units are strong, so the agent cools too little.`, "edge"); } },
          { label: "Only one day of data", kind: "edge", note: "One logged day is little evidence. The learner trusts the data fully only from 4 days, so after one day the estimate moves only part of the way from the guess.",
            run: async () => { await A.reset({ days: 0 }); const b = (await A.glide("days", 1, 900)).log; const m = learnModel(1); A.say(`After 1 day: thermal mass ${m.cth} (true ${TRUE.cth}), heat leak ${m.kenv} (true ${TRUE.kenv}), cooling gain ${m.gain} (true ${TRUE.gain}). ${res(b)}.`, "edge"); } },
        ],
      });
    },
  });

  steps.push({
    id: "measure", title: "Rationality and the performance measure", time: 10,
    mission: true,
    theory: `<h3>All the agents, three measures</h3>
      <p>Rationality is relative to the performance measure. Rank the agents under the real measure (bill plus penalties), then under "energy only" (a manager who looks at the PUE dashboard and nothing else) and under "never violate" (an operator afraid of the pager). Different winners.</p>
      <ul><li>The lecture's warning: reward what you actually want. "Minimize energy" alone is maximized by switching the cooling off. "Never exceed 27 °C" alone is satisfied by running everything at full blast.</li>
      <li><b>Omniscient</b> would mean knowing the exact load and weather every minute. The charts include such an agent: it is handed the true temperature and the exact future, and plans with them. Its cost is the best possible cost of a day, and the plant manager's budget is that cost plus 10%. No real agent can be expected to match it, only to come close with the knowledge it has.</li></ul>
      <p>The rank chart has one column per measure and one line per agent. A line that stays level keeps its rank whatever we measure; a line that jumps is an agent that one measure loves and another hates.</p>`,
    ask: `<div class='a'>Ask for predictions first. Then switch to energy-only: switching the cooling off "wins" while violating all day. Ask what this means for KPI design in a company. Switch to never-violate: several agents tie at zero minutes, full blast among them, so the measure cannot tell a careful agent from a wasteful one.</div>
      <div class='a'>Show the rank chart: cooling off goes from last under the bill to first under energy only; full blast goes from the middle to a tie for first under never violate. The bars show the selected measure on a plain scale; bars longer than the axis are cut at its end with the full value printed.</div>
      <div class='a'>Mission, measured on the 10 practice days (examples never tick targets; they all run with no heat wave except one that stays on energy only): under never violate the risk-neutral utility agent (w_viol 1) leaves the tie at rank 1 from a 5 °C heat wave (1 minute above the limit per day on average). Under the bill the cautious utility agent (w_viol 3) is cheaper from a 6 °C heat wave on: 5,250 against 5,609 SAR a day at +6, 5,927 against 9,760 at +8; at +5 the risk-neutral one is still cheaper (4,990 against 5,028). Without heat: energy only is won by cooling off (0.18 MWh and 1,326 minutes above the limit per day); never violate has 5 agents tied at 0 minutes.</div>`,
    mount() {
      let measure = "cost", heat = 0, focus = new Set();
      const box = sayBox(), cache = {};
      const list = [
        ["Simple reflex (T_set 24)", "Reflex 24", () => agents.reflex(24, 8, 2)],
        ["Simple reflex (T_set 26.5)", "Reflex 26.5", () => agents.reflex(26.5, 8, 2)],
        ["Model-based (K 1.5, horizon 3)", "Model-based", () => agents.model(24, 1.5, 3)],
        ["Goal-based (lookahead 40 min)", "Goal-based", () => agents.goal(25, 4, 1.5)],
        ["Utility (w_viol 1)", "Utility w 1", () => agents.utility(UDEF)],
